# Supabase CLI project config for the dreamspace whiteboard backend.
# Link the hosted project once it exists: supabase link --project-ref <ref>
project_id = "dreamspace-whiteboard"

[auth]
enabled = true
# Anonymous sign-ins power the zero-friction first sync (plan KTD4).
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = true
# Secure email change (U5): both the old and new address must confirm.
double_confirm_changes = true

# CAPTCHA on sign-in bounds bot abuse of anonymous accounts (plan R18).
# Fill in the secret from the hCaptcha or Turnstile dashboard, then set enabled = true.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = ""

# The CLI runs seed files as plain SQL (no psql meta-commands like \ir).
[db.seed]
enabled = true
sql_paths = ["./seed/templates_seed.sql"]

# AI Magic Toolbox functions check their own credential (a tester pass, the admin secret or the cron secret) in their code,
# so the platform's Supabase-login check is off for them; without this a tester pass would be refused before the code runs.
[functions.route]
verify_jwt = false

[functions.run]
verify_jwt = false

[functions.outcome]
verify_jwt = false

[functions.admin]
verify_jwt = false

[functions.cleanup]
verify_jwt = false

[functions.reconcile]
verify_jwt = false
