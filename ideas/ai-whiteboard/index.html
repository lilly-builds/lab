<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI whiteboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300&family=Newsreader:opsz,wght@6..72,300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --note: #bfd7ff;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
  body { color: var(--ink); font: 300 17px/1.4 var(--serif); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  canvas#board { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: crosshair; }
  canvas#board.move { cursor: grab; }
  canvas#board.txt { cursor: text; }

  textarea#noteEdit { position: fixed; display: none; margin: 0; padding: 8px; resize: none; overflow: hidden; border: 1px solid var(--ink); border-radius: 0;
    background: var(--note); font: 300 16px/20px var(--serif); outline: 0; box-shadow: none; aspect-ratio: 1 / 1; z-index: 5; }
  textarea#noteEdit:focus, textarea#noteEdit:focus-visible { outline: 0; box-shadow: none; }
  textarea#textEdit { position: fixed; display: none; margin: 0; padding: 0; resize: none; overflow: hidden; border: 0; border-radius: 0; background: transparent;
    font: 300 24px/31px var(--serif); text-decoration: none; box-shadow: none; outline: 1px solid var(--ink); outline-offset: 4px; z-index: 5; }
  textarea#textEdit:focus, textarea#textEdit:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  #dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 10; }
  #dock > * { pointer-events: auto; }

  #bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; background: var(--paper); max-width: 100%; }
  @media (max-width: 360px) { #bar { gap: 0; } }
  #bar button, #bar a.tpl { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  #bar button svg, #bar a.tpl svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  #bar a.tpl { gap: 8px; color: inherit; text-decoration: none; }
  #bar a.tpl .lbl { display: none; font: 300 12px/1 var(--mono); letter-spacing: .04em; white-space: nowrap; }
  @media (min-width: 900px) { #bar a.tpl { width: auto; padding: 0 16px; border-radius: 24px; } #bar a.tpl .lbl { display: inline; } }
  #bar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #bar button:disabled { opacity: .3; cursor: default; }
  #magic svg .tip { opacity: 0; }
  #magic.busy svg { animation: spin 12s linear infinite; transform-origin: 50% 50%; }
  #magic.busy svg .star { transform-origin: 10px 12px; animation: breathe 1.6s ease-in-out infinite; }
  #magic.busy svg .tip { stroke-width: 2.4; animation: shimmer 1.6s ease-in-out infinite; }
  #magic.busy svg .tip:nth-of-type(4) { animation-delay: .4s; }
  #magic.busy svg .tip:nth-of-type(5) { animation-delay: .8s; }
  #magic.busy svg .tip:nth-of-type(6) { animation-delay: 1.2s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes shimmer { 0%, 100% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    #magic.busy svg, #magic.busy svg .star, #magic.busy svg .tip { animation: none; }
    #magic.busy svg .star { fill: currentColor; }
  }

  #edge { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; display: none; }
  #edge rect { fill: none; stroke: #000; stroke-width: 1; opacity: .3; vector-effect: non-scaling-stroke; stroke-dasharray: 12 88; animation: lap 3s linear infinite; }
  @keyframes lap { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -100; } }
  body.busy #edge { display: block; }
  @media (prefers-reduced-motion: reduce) { body.busy #edge { display: none; } }

  #status { height: 20px; padding: 0 12px 0 0; font: 300 11px/20px var(--mono); font-variant-caps: all-small-caps; letter-spacing: .08em; white-space: nowrap; overflow: hidden; }
  #status span { display: block; opacity: 0; transition: opacity .2s ease; }
  #status span.on { opacity: 1; }
  #stopBtn { width: 44px; height: 44px; display: none; align-items: center; justify-content: center; border-radius: 50%; flex: none; }
  #stopBtn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 1.2; fill: none; }
  #stopBtn svg rect.in { fill: currentColor; }
  #panel.busy #stopBtn { display: flex; }
  #panel.busy .gear { display: none; }
  #panel.busy #makeReal { visibility: hidden; }
  #panel input:disabled { opacity: .5; }

  #panel, #xpanel { display: none; width: min(420px, 100%); background: var(--paper); border: 1px solid var(--ink); padding: 4px 4px 4px 12px; margin: 0; }
  #panel.open, #xpanel.open { display: block; }
  #panel .row, #xpanel .row { display: flex; align-items: center; }
  #panel .row2 { display: flex; justify-content: flex-end; padding-top: 2px; }
  #panel .mini { min-height: 36px; padding: 0 14px; border: 1px solid var(--ink); border-radius: 0; background: var(--paper); font: 300 12px/1 var(--mono); letter-spacing: .04em; }
  #panel .mini:active { background: var(--ink); color: var(--paper); }
  #panel input, #xpanel input { flex: 1; min-width: 0; min-height: 44px; border: 0; border-radius: 0; background: transparent; font: 300 16px/1.4 var(--serif); padding: 0; outline: 0; box-shadow: none; }
  #panel input:focus, #panel input:focus-visible, #xpanel input:focus, #xpanel input:focus-visible { outline: 0; box-shadow: none; }
  #panel .gear, #xpanel .gear { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex: none; }
  #panel .gear svg, #xpanel .gear svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }

  #err { font: 300 14px/1.4 var(--mono); opacity: 0; transition: opacity .8s ease; text-align: center; max-width: min(420px, 100%); background: var(--paper); pointer-events: none !important; }
  #err.show { opacity: 1; transition: none; }

  /* style bar: shown for a selection or an armed shape tool */
  #props { display: flex; flex-direction: column; align-items: center; background: var(--paper); max-width: 100%; }
  #props .grp { display: flex; flex-wrap: wrap; justify-content: center; }
  #props .chip { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  #props .chip i { display: block; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  #props .chip i.none { background: linear-gradient(to top right, transparent calc(50% - .5px), #000 50%, transparent calc(50% + .5px)), #fff; }
  #props .chip[aria-pressed="true"] i { outline: 1px solid var(--ink); outline-offset: 3px; }
  #props .tool { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  #props .tool svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-linecap: butt; }
  #props .tool.sz { font: 300 13px/1 var(--mono); }
  #props .tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* embedded frames: DOM layer above the canvas, pointers pass through except on the bar buttons */
  #embeds { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .emb { position: absolute; display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--ink); pointer-events: none; }
  .emb.sel { outline: 1px dashed var(--ink); outline-offset: 5px; }
  .emb .eh { display: none; position: absolute; width: 9px; height: 9px; background: var(--paper); border: 1px solid var(--ink); }
  .emb.sel .eh { display: block; }
  .emb .eh.a { left: -5.5px; top: -5.5px; } .emb .eh.b { right: -5.5px; top: -5.5px; }
  .emb .eh.c { right: -5.5px; bottom: -5.5px; } .emb .eh.d { left: -5.5px; bottom: -5.5px; }
  .ebar { flex: none; height: 32px; display: flex; align-items: center; padding: 0 14px 0 10px; border-bottom: 1px solid var(--ink); background: var(--paper); font: 300 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
  .etitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ebar button, .ebar a { pointer-events: auto; flex: none; min-width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--ink); text-decoration: none; text-transform: uppercase; letter-spacing: .08em; }
  .ebar button svg, .ebar a svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .ebar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .ebar .eretry { gap: 6px; padding: 0 6px; }
  .ebody { position: relative; flex: 1; min-height: 0; }
  .ebody iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--paper); pointer-events: none; transition: opacity .25s linear; }
  .ebody iframe.fade { opacity: 0; }
  .emb.act iframe { pointer-events: auto; }
  .epend { position: absolute; left: 8px; top: 8px; width: calc(100% - 16px); height: calc(100% - 16px); overflow: visible; }
  .epend rect { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 6 5; animation: march 1.2s linear infinite; }
  .emb.stall .epend rect { animation: none; }
  @keyframes march { to { stroke-dashoffset: -11; } }
  .enote { position: absolute; top: 0; left: 0; right: 0; padding: 7px 10px; background: var(--paper); border-bottom: 1px solid var(--ink); font: 300 12px/1.4 var(--mono); pointer-events: none; }
  .enote a { pointer-events: auto; color: var(--ink); text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .epend rect { animation: none; } .ebody iframe { transition: none; } }

  /* connect modal */
  #scrim { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(255,255,255,.88); }
  #dlg { position: relative; width: min(440px, 100%); max-height: 100%; overflow-y: auto; background: var(--paper); border: 1px solid var(--ink); border-radius: 0; padding: 44px 32px 32px; }
  @media (max-width: 400px) { #dlg { padding: 40px 20px 24px; } }
  #dlg h2 { margin: 0 0 28px; font: 300 28px/1.15 var(--serif); padding-right: 36px; }
  #dlgClose { position: absolute; top: 2px; right: 2px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  #dlgClose svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; }
  #provList { margin: 0 0 24px; }
  .prov { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 44px; text-align: left; font: 300 19px/1.3 var(--serif); }
  .prov .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .prov[aria-checked="true"] .dot { background: var(--ink); }
  .prov .hint { margin-left: auto; font: 300 14px/1 var(--mono); }
  .field { display: flex; align-items: center; border: 1px solid var(--ink); margin: 0 0 12px; background: var(--paper); }
  .field:focus-within { outline: 1px solid var(--ink); outline-offset: 3px; }
  .field input { flex: 1; min-width: 0; min-height: 48px; border: 0; border-radius: 0; background: transparent; padding: 0 12px; font: 300 16px/1.4 var(--mono); outline: 0; box-shadow: none; }
  .field button { min-width: 56px; min-height: 48px; padding: 0 12px; font: 300 14px/1 var(--mono); }
  .trust { margin: 16px 0 24px; font: 300 17px/1.4 var(--serif); }
  .btn { min-height: 48px; padding: 0 24px; border: 1px solid var(--ink); border-radius: 0; background: var(--paper); font: 300 17px/1 var(--serif); }
  .btn.solid { background: var(--ink); color: var(--paper); width: 100%; }
  .btn:disabled { opacity: .4; cursor: default; }
  #manageRow { display: flex; flex-wrap: wrap; gap: 8px; }
  #manageRow .btn { flex: 1 1 140px; }
  #state { margin: 16px 0 0; font: 300 14px/1.4 var(--mono); }
  #state:empty { display: none; }
</style>
</head>
<body>
<canvas id="board"></canvas>
<svg id="edge" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" pathLength="100"/></svg>
<div id="embeds"></div>
<textarea id="noteEdit" aria-label="Note" maxlength="400"></textarea>
<textarea id="textEdit" aria-label="Text" maxlength="2000" rows="1" spellcheck="false" autocorrect="off" wrap="soft"></textarea>

<div id="dock">
  <div id="err" role="status" aria-live="polite"></div>
  <div id="props" role="group" aria-label="Style" hidden>
    <div class="grp" id="pStroke" role="group" aria-label="Color"></div>
    <div class="grp" id="pFill" role="group" aria-label="Fill"></div>
    <div class="grp" id="pSize" role="group" aria-label="Text size" hidden>
      <button type="button" class="tool sz" data-size="16" aria-label="Small" aria-pressed="false">S</button>
      <button type="button" class="tool sz" data-size="24" aria-label="Medium" aria-pressed="false">M</button>
      <button type="button" class="tool sz" data-size="40" aria-label="Large" aria-pressed="false">L</button>
    </div>
    <div class="grp" id="pNote" role="group" aria-label="Note color"></div>
    <div class="grp" id="pMisc">
      <button type="button" class="tool" data-w="1" aria-label="Thin"><svg viewBox="0 0 24 24"><path d="M4 12h16" stroke-width="1"/></svg></button>
      <button type="button" class="tool" data-w="2" aria-label="Regular"><svg viewBox="0 0 24 24"><path d="M4 12h16" stroke-width="2"/></svg></button>
      <button type="button" class="tool" data-w="4" aria-label="Bold"><svg viewBox="0 0 24 24"><path d="M4 12h16" stroke-width="4"/></svg></button>
      <button type="button" class="tool" id="dashBtn" aria-label="Dashed" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 12h4M10 12h4M17 12h4" stroke-width="2"/></svg></button>
      <button type="button" class="tool" id="delBtn" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <form id="panel" autocomplete="off">
    <div class="row">
      <input id="ask" type="text" placeholder="Ask anything about the board" aria-label="Ask anything about the board" enterkeyhint="send" autocomplete="off">
      <button type="button" id="stopBtn" aria-label="Stop"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15"/><rect class="in" x="9" y="9" width="6" height="6"/></svg></button>
      <button type="button" class="gear" id="gear" aria-label="Settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
      </button>
    </div>
    <div id="status" aria-live="polite"></div>
    <div class="row2"><button type="button" class="mini" id="makeReal">Make it real</button></div>
  </form>
  <form id="xpanel" autocomplete="off" novalidate>
    <div class="row">
      <input id="xurl" type="url" placeholder="https://" aria-label="Page address" enterkeyhint="go" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="submit" class="gear" aria-label="Place frame"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
  </form>
  <div id="bar"role="toolbar" aria-label="Tools">
    <button type="button" data-tool="pen" aria-label="Pen" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 0a2 2 0 0 1 0 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg></button>
    <button type="button" data-tool="note" aria-label="Note" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15"/><path d="M8 9.5h8M8 13h5"/></svg></button>
    <button type="button" data-tool="text" aria-label="Text" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15"/><path d="M8.5 9.5V8h7v1.5M12 8v8M10.5 16h3"/></svg></button>
    <button type="button" data-tool="rect" aria-label="Rectangle" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="6.5" width="16" height="11"/></svg></button>
    <button type="button" data-tool="diamond" aria-label="Diamond" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"/></svg></button>
    <button type="button" data-tool="ellipse" aria-label="Ellipse" aria-pressed="false"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6"/></svg></button>
    <button type="button" data-tool="line" aria-label="Line" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
    <button type="button" data-tool="arrow" aria-label="Arrow" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
    <button type="button" id="embedBtn" aria-label="Embed a page" aria-expanded="false"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15"/><path d="M13.5 19.5v-6h6"/></svg></button>
    <button type="button" data-tool="move"aria-label="Select and move" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg></button>
    <button type="button" id="undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 8h-3"/></svg></button>
    <a id="tplLink" class="tpl" href="../templates/" aria-label="Templates"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="6" height="6"/><rect x="13.5" y="4.5" width="6" height="6"/><rect x="4.5" y="13.5" width="6" height="6"/><rect x="13.5" y="13.5" width="6" height="6"/></svg><span class="lbl">Templates</span></a>
    <button type="button" id="share" aria-label="Share as template"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></svg></button>
    <button type="button" id="magic" aria-label="Ask AI" aria-expanded="false"><svg viewBox="0 0 24 24"><path class="star" d="M10 4c.7 5 2.5 7.3 7 8-4.5.7-6.3 3-7 8-.7-5-2.5-7.3-7-8 4.5-.7 6.3-3 7-8z"/><path d="M19 3v4M17 5h4"/><path class="tip" d="M10 4v.01"/><path class="tip" d="M17 12v.01"/><path class="tip" d="M10 20v.01"/><path class="tip" d="M3 12v.01"/></svg></button>
  </div>
</div>

<div id="scrim" hidden>
  <div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <button type="button" id="dlgClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <h2 id="dlgTitle">Connect your AI tools</h2>
    <div id="provList" role="radiogroup" aria-label="Provider"></div>
    <form id="keyForm" autocomplete="off" novalidate>
      <div class="field" id="keyField">
        <input id="key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-ant-..." aria-label="API key">
        <button type="button" id="reveal" aria-pressed="false" aria-label="Show key">Show</button>
      </div>
      <div class="field" id="modelField">
        <input id="model" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Model id">
      </div>
      <p class="trust">Your key stays on this device.</p>
      <button type="submit" class="btn solid" id="connectBtn">Connect</button>
      <div id="manageRow">
        <button type="button" class="btn" id="replaceBtn">Replace key</button>
        <button type="button" class="btn" id="disconnectBtn">Disconnect</button>
      </div>
      <p id="state" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- providers: add another model by writing one more object ---------- */
  /* label, keyHint and placeholder feed the connect modal; verify() checks a key with one tiny real request */
  var providers = {
    anthropic: {
      id: 'anthropic',
      label: 'Anthropic',
      keyHint: 'sk-ant-',
      placeholder: 'sk-ant-...',
      defaults: { model: 'claude-sonnet-5' },
      post: async function (key, body, signal) {
        var res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          signal: signal,
          headers: {
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify(body)
        });
        var data = null;
        try { data = await res.json(); } catch (e) {}
        return { res: res, data: data };
      },
      /* true: key accepted, false: key rejected, throws: could not check */
      verify: async function (key, signal) {
        var r = await this.post(key, { model: this.defaults.model, max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] }, signal);
        if (r.res.ok) return true;
        if (r.res.status === 401 || r.res.status === 403) return false;
        /* 400/404/413/429 are answered after authentication, so the key itself is good */
        if ([400, 404, 413, 429].indexOf(r.res.status) >= 0) return true;

    var id = el.id;
    if (probing[id]) return;
    probing[id] = true;
    fetch(probeUrl(el.url) + '?v=' + Date.now(), { cache: 'no-store' }).then(function (res) {
      if (!res.ok) return;
      var cur = embedById(id);
      if (!cur || !cur.pending) return;
      cur.pending = false; delete cur.since; save(); draw();
    }).catch(function () {}).then(function () { delete probing[id]; });
  }
  function pollTick() {
    if (document.hidden) return;
    var any = false;
    els.forEach(function (el) {
      if (el.type !== 'embed' || !el.pending) return;
      any = true;
      if (!isStalled(el)) checkLive(el);
    });
    if (any) syncEmbeds();
  }
  setInterval(pollTick, 15000);
  document.addEventListener('visibilitychange', pollTick);

  resize();
  pollTick();
  var tplId = new URLSearchParams(location.search).get('template');
  if (tplId) loadTemplate(tplId);
})();
</script>
</body>
</html>
