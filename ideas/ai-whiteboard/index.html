<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI whiteboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300&family=Newsreader:opsz,wght@6..72,300&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --note: #bfd7ff;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
  body { color: var(--ink); font: 300 17px/1.4 var(--serif); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  canvas#board { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: crosshair; }
  canvas#board.move { cursor: grab; }

  textarea#noteEdit { position: fixed; display: none; margin: 0; padding: 8px; resize: none; overflow: hidden; border: 1px solid var(--ink); border-radius: 0;
    background: var(--note); font: 300 16px/20px var(--serif); outline: 0; box-shadow: none; aspect-ratio: 1 / 1; z-index: 5; }
  textarea#noteEdit:focus, textarea#noteEdit:focus-visible { outline: 0; box-shadow: none; }

  #dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 10; }
  #dock > * { pointer-events: auto; }

  #bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; background: var(--paper); max-width: 100%; }
  @media (max-width: 360px) { #bar { gap: 0; } }
  #bar button { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  #bar button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  #bar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #bar button:disabled { opacity: .3; cursor: default; }
  #magic.busy svg { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .25; transform: scale(.85); } }
  @media (prefers-reduced-motion: reduce) { #magic.busy svg { animation: none; opacity: .4; } }

  #panel { display: none; width: min(420px, 100%); background: var(--paper); border: 1px solid var(--ink); padding: 4px 4px 4px 12px; margin: 0; }
  #panel.open { display: block; }
  #panel .row { display: flex; align-items: center; }
  #panel input { flex: 1; min-width: 0; min-height: 44px; border: 0; border-radius: 0; background: transparent; font: 300 16px/1.4 var(--serif); padding: 0; outline: 0; box-shadow: none; }
  #panel input:focus, #panel input:focus-visible { outline: 0; box-shadow: none; }
  #panel .gear { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex: none; }
  #panel .gear svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }

  #err { font: 300 14px/1.4 var(--mono); opacity: 0; transition: opacity .8s ease; text-align: center; max-width: min(420px, 100%); background: var(--paper); pointer-events: none !important; }
  #err.show { opacity: 1; transition: none; }

  /* style bar: shown for a selection or an armed shape tool */
  #props { display: flex; flex-direction: column; align-items: center; background: var(--paper); max-width: 100%; }
  #props .grp { display: flex; flex-wrap: wrap; justify-content: center; }
  #props .chip { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  #props .chip i { display: block; width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
  #props .chip i.none { background: linear-gradient(to top right, transparent calc(50% - .5px), #000 50%, transparent calc(50% + .5px)), #fff; }
  #props .chip[aria-pressed="true"] i { outline: 1px solid var(--ink); outline-offset: 3px; }
  #props .tool { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  #props .tool svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-linecap: butt; }
  #props .tool[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  /* connect modal */
  #scrim { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(255,255,255,.88); }
  #dlg { position: relative; width: min(440px, 100%); max-height: 100%; overflow-y: auto; background: var(--paper); border: 1px solid var(--ink); border-radius: 0; padding: 44px 32px 32px; }
  @media (max-width: 400px) { #dlg { padding: 40px 20px 24px; } }
  #dlg h2 { margin: 0 0 28px; font: 300 28px/1.15 var(--serif); padding-right: 36px; }
  #dlgClose { position: absolute; top: 2px; right: 2px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
  #dlgClose svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; }
  #provList { margin: 0 0 24px; }
  .prov { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 44px; text-align: left; font: 300 19px/1.3 var(--serif); }
  .prov .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .prov[aria-checked="true"] .dot { background: var(--ink); }
  .prov .hint { margin-left: auto; font: 300 14px/1 var(--mono); }
  .field { display: flex; align-items: center; border: 1px solid var(--ink); margin: 0 0 12px; background: var(--paper); }
  .field:focus-within { outline: 1px solid var(--ink); outline-offset: 3px; }
  .field input { flex: 1; min-width: 0; min-height: 48px; border: 0; border-radius: 0; background: transparent; padding: 0 12px; font: 300 16px/1.4 var(--mono); outline: 0; box-shadow: none; }
  .field button { min-width: 56px; min-height: 48px; padding: 0 12px; font: 300 14px/1 var(--mono); }
  .trust { margin: 16px 0 24px; font: 300 17px/1.4 var(--serif); }
  .btn { min-height: 48px; padding: 0 24px; border: 1px solid var(--ink); border-radius: 0; background: var(--paper); font: 300 17px/1 var(--serif); }
  .btn.solid { background: var(--ink); color: var(--paper); width: 100%; }
  .btn:disabled { opacity: .4; cursor: default; }
  #manageRow { display: flex; flex-wrap: wrap; gap: 8px; }
  #manageRow .btn { flex: 1 1 140px; }
  #state { margin: 16px 0 0; font: 300 14px/1.4 var(--mono); }
  #state:empty { display: none; }
</style>
</head>
<body>
<canvas id="board"></canvas>
<textarea id="noteEdit" aria-label="Note" maxlength="400"></textarea>

<div id="dock">
  <div id="err" role="status" aria-live="polite"></div>
  <div id="props" role="group" aria-label="Style" hidden>
    <div class="grp" id="pStroke" role="group" aria-label="Color"></div>
    <div class="grp" id="pFill" role="group" aria-label="Fill"></div>
    <div class="grp" id="pNote" role="group" aria-label="Note color"></div>
    <div class="grp" id="pMisc">
      <button type="button" class="tool" data-w="1" aria-label="Thin"><svg viewBox="0 0 24 24"><path d="M4 12h16" stroke-width="1"/></svg></button>
      <button type="button" class="tool" data-w="2" aria-label="Regular"><svg viewBox="0 0 24 24"><path d="M4 12h16" stroke-width="2"/></svg></button>
      <button type="button" class="tool" data-w="4" aria-label="Bold"><svg viewBox="0 0 24 24"><path d="M4 12h16" stroke-width="4"/></svg></button>
      <button type="button" class="tool" id="dashBtn" aria-label="Dashed" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 12h4M10 12h4M17 12h4" stroke-width="2"/></svg></button>
      <button type="button" class="tool" id="delBtn" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-width="1.2" stroke-linecap="round"/></svg></button>
    </div>
  </div>
  <form id="panel" autocomplete="off">
    <div class="row">
      <input id="ask" type="text" placeholder="Ask anything about the board" aria-label="Ask anything about the board" enterkeyhint="send" autocomplete="off">
      <button type="button" class="gear" id="gear" aria-label="Settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>
      </button>
    </div>
  </form>
  <div id="bar" role="toolbar" aria-label="Tools">
    <button type="button" data-tool="pen" aria-label="Pen" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 0a2 2 0 0 1 0 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg></button>
    <button type="button" data-tool="note" aria-label="Note" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15"/><path d="M8 9.5h8M8 13h5"/></svg></button>
    <button type="button" data-tool="rect" aria-label="Rectangle" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="6.5" width="16" height="11"/></svg></button>
    <button type="button" data-tool="diamond" aria-label="Diamond" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"/></svg></button>
    <button type="button" data-tool="ellipse" aria-label="Ellipse" aria-pressed="false"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6"/></svg></button>
    <button type="button" data-tool="line" aria-label="Line" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
    <button type="button" data-tool="arrow" aria-label="Arrow" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
    <button type="button" data-tool="move" aria-label="Select and move" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg></button>
    <button type="button" id="undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 8h-3"/></svg></button>
    <button type="button" id="share" aria-label="Share as template"><svg viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></svg></button>
    <button type="button" id="magic" aria-label="Ask AI" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M10 4c.7 5 2.5 7.3 7 8-4.5.7-6.3 3-7 8-.7-5-2.5-7.3-7-8 4.5-.7 6.3-3 7-8z"/><path d="M19 3v4M17 5h4"/></svg></button>
  </div>
</div>

<div id="scrim" hidden>
  <div id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <button type="button" id="dlgClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <h2 id="dlgTitle">Connect your AI tools</h2>
    <div id="provList" role="radiogroup" aria-label="Provider"></div>
    <form id="keyForm" autocomplete="off" novalidate>
      <div class="field" id="keyField">
        <input id="key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-ant-..." aria-label="API key">
        <button type="button" id="reveal" aria-pressed="false" aria-label="Show key">Show</button>
      </div>
      <div class="field" id="modelField">
        <input id="model" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Model id">
      </div>
      <p class="trust">Your key stays on this device.</p>
      <button type="submit" class="btn solid" id="connectBtn">Connect</button>
      <div id="manageRow">
        <button type="button" class="btn" id="replaceBtn">Replace key</button>
        <button type="button" class="btn" id="disconnectBtn">Disconnect</button>
      </div>
      <p id="state" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- providers: add another model by writing one more object ---------- */
  /* label, keyHint and placeholder feed the connect modal; verify() checks a key with one tiny real request */
  var providers = {
    anthropic: {
      id: 'anthropic',
      label: 'Anthropic',
      keyHint: 'sk-ant-',
      placeholder: 'sk-ant-...',
      defaults: { model: 'claude-sonnet-5' },
      post: async function (key, body, signal) {
        var res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          signal: signal,
          headers: {
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify(body)
        });
        var data = null;
        try { data = await res.json(); } catch (e) {}
        return { res: res, data: data };
      },
      /* true: key accepted, false: key rejected, throws: could not check */
      verify: async function (key, signal) {
        var r = await this.post(key, { model: this.defaults.model, max_tokens: 1, messages: [{ role: 'user', content: 'hi' }] }, signal);
        if (r.res.ok) return true;
        if (r.res.status === 401 || r.res.status === 403) return false;
        /* 400/404/413/429 are answered after authentication, so the key itself is good */
        if ([400, 404, 413, 429].indexOf(r.res.status) >= 0) return true;
        throw new Error('status ' + r.res.status);
      },
      complete: async function (o) {
        var content = [];
        if (o.imagePng) content.push({ type: 'image', source: { type: 'base64', media_type: 'image/png', data: o.imagePng } });
        content.push({ type: 'text', text: o.text });
        var r = await this.post(o.key, { model: o.model || this.defaults.model, max_tokens: 2048, system: o.system, messages: [{ role: 'user', content: content }] }, o.signal);
        if (!r.res.ok) {
          var err = new Error((r.data && r.data.error && r.data.error.message) || ('Request failed (' + r.res.status + ')'));
          err.status = r.res.status;
          throw err;
        }
        var blocks = (r.data && r.data.content) || [];
        return blocks.filter(function (b) { return b.type === 'text'; }).map(function (b) { return b.text; }).join('\n');
      }
    },
    openai: {
      id: 'openai',
      label: 'OpenAI',
      keyHint: 'sk-',
      placeholder: 'sk-...',
      defaults: { model: 'gpt-6.1-sol' },
      post: async function (key, body, signal) {
        var res = await fetch('https://api.openai.com/v1/responses', {
          method: 'POST',
          signal: signal,
          headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        var data = null;
        try { data = await res.json(); } catch (e) {}
        return { res: res, data: data };
      },
      /* true: key accepted, false: key rejected, throws: could not check */
      verify: async function (key, signal) {
        var res = await fetch('https://api.openai.com/v1/models', { method: 'GET', signal: signal, headers: { 'Authorization': 'Bearer ' + key } });
        if (res.ok) return true;
        if (res.status === 401) return false;
        throw new Error('status ' + res.status);
      },
      complete: async function (o) {
        var content = [{ type: 'input_text', text: o.text }];
        if (o.imagePng) content.push({ type: 'input_image', image_url: 'data:image/png;base64,' + o.imagePng });
        var r = await this.post(o.key, {
          model: o.model || this.defaults.model,
          instructions: o.system,
          input: [{ role: 'user', content: content }],
          max_output_tokens: 4000,
          text: { format: { type: 'json_object' } }
        }, o.signal);
        if (!r.res.ok) {
          var err = new Error((r.data && r.data.error && r.data.error.message) || ('Request failed (' + r.res.status + ')'));
          err.status = r.res.status;
          throw err;
        }
        if (r.data && r.data.status === 'incomplete') throw new Error('Could not read the reply');
        var out = (r.data && r.data.output) || [], parts = [];
        out.forEach(function (item) {
          if (!item || item.type !== 'message') return;
          (item.content || []).forEach(function (c) { if (c && c.type === 'output_text' && typeof c.text === 'string') parts.push(c.text); });
        });
        return parts.join('\n');
      }
    }
  };

  /* ---------- palette: the only colors the board accepts ---------- */
  var STROKES = [['#1e1e1e', 'Black'], ['#e03131', 'Red'], ['#2f9e44', 'Green'], ['#1971c2', 'Blue'], ['#f08c00', 'Amber']];
  var FILLS = [['none', 'No fill'], ['#ffc9c9', 'Red tint'], ['#b2f2bb', 'Green tint'], ['#a5d8ff', 'Blue tint'], ['#ffec99', 'Amber tint'], ['#ffffff', 'White']];
  var NOTE_FILLS = [['#bfd7ff', 'Blue note'], ['#ffec99', 'Amber note'], ['#b2f2bb', 'Green note'], ['#ffc9c9', 'Red note']];
  var WIDTHS = [1, 2, 4];
  var SHAPES = ['rect', 'diamond', 'ellipse', 'line', 'arrow'];
  function pick(v, list, d) {
    if (typeof v !== 'string') return d;
    v = v.toLowerCase();
    for (var i = 0; i < list.length; i++) if (list[i][0] === v) return v;
    return d;
  }
  function nearWidth(v) { v = Number(v); return isFinite(v) && v > 0 ? (v <= 1.5 ? 1 : v <= 3 ? 2 : 4) : undefined; }
  function isClosed(t) { return t === 'rect' || t === 'diamond' || t === 'ellipse'; }

  var SYSTEM = [
    'You are a collaborator on a shared whiteboard. You get a PNG of the visible board and the board as JSON (element array, board coordinates; "view" is the visible region the PNG shows).',
    'Reply with ONLY one JSON object, no prose, no code fences: {"say": "optional short text reply", "add": [elements]}.',
    'Element types you may add:',
    '{"type":"note","x":0,"y":0,"text":"..."} square sticky note, x,y is top-left, keep text under 120 characters.',
    '{"type":"text","x":0,"y":0,"text":"..."} plain label, x,y is top-left.',
    '{"type":"rect","x":0,"y":0,"width":0,"height":0}, {"type":"ellipse", same fields} and {"type":"diamond", same fields}, optional "text" label.',
    '{"type":"line","x1":0,"y1":0,"x2":0,"y2":0} and {"type":"arrow", same fields}.',
    '{"type":"image","x":0,"y":0,"width":0,"height":0,"url":"https://..."} only with an image URL the user gave you.',
    'Optional style fields on any element except image, using ONLY these values:',
    '"strokeColor": "#1e1e1e" black, "#e03131" red, "#2f9e44" green, "#1971c2" blue, "#f08c00" amber.',
    '"fill" on rect, ellipse and diamond: "none", "#ffc9c9", "#b2f2bb", "#a5d8ff", "#ffec99" or "#ffffff". "fill" on note: "#bfd7ff", "#ffec99", "#b2f2bb" or "#ffc9c9".',
    '"strokeWidth": 1 thin, 2 regular or 4 bold. "dashed": true or false.',
    'Leave style out unless color helps meaning; use few colors. Existing elements may carry the same style fields.',
    'Use the same board coordinates as the JSON. Place new things in empty space near what the user drew, never on top of existing elements. Keep diagrams tidy and sparse: few elements, aligned, generous spacing. Notes are about 120 units wide. Answer questions with "say" and add nothing unless drawing helps.'
  ].join('\n');

  /* ---------- state ---------- */
  var KEY_SCENE = 'aiwb.scene', KEY_VIEW = 'aiwb.view', KEY_PROVIDER = 'aiwb.provider';
  var OLD_KEY = 'aiwb.key', OLD_MODEL = 'aiwb.model';
  var cv = document.getElementById('board'), ctx = cv.getContext('2d');
  var els = [], view = { x: 0, y: 0 }, tool = 'pen', undoStack = [], editing = null, busy = false, selId = null;
  var cur = { strokeColor: '#1e1e1e', fill: 'none', strokeWidth: 2, dashed: false, noteFill: '#bfd7ff' };
  var imgCache = {}, NOTE = 120, nextId = 1;
  var dpr = 1, W = 0, H = 0;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  /* provider credentials live in localStorage only, one entry per provider */
  function kKey(id) { return 'aiwb.provider.' + id + '.key'; }
  function kModel(id) { return 'aiwb.provider.' + id + '.model'; }
  function getKey(id) { return (lsGet(kKey(id)) || '').trim(); }
  function getModel(id) { return (lsGet(kModel(id)) || '').trim() || providers[id].defaults.model; }
  function mask(k) { return k ? '••••' + k.slice(-4) : ''; }
  var PROVIDER = providers[lsGet(KEY_PROVIDER)] ? lsGet(KEY_PROVIDER) : 'anthropic';

  /* silently move a key saved by the previous version of this page */
  (function migrate() {
    var old = lsGet(OLD_KEY), oldModel = lsGet(OLD_MODEL);
    if (old && old.trim() && !getKey('anthropic')) lsSet(kKey('anthropic'), old.trim());
    if (oldModel && oldModel.trim() && !lsGet(kModel('anthropic'))) lsSet(kModel('anthropic'), oldModel.trim());
    if (old !== null) lsDel(OLD_KEY);
    if (oldModel !== null) lsDel(OLD_MODEL);
  })();

  try { var s = JSON.parse(lsGet(KEY_SCENE) || '[]'); if (Array.isArray(s)) els = s.filter(function (e) { return e && typeof e === 'object' && e.type; }); } catch (e) {}
  try { var vv = JSON.parse(lsGet(KEY_VIEW) || 'null'); if (vv && isFinite(vv.x) && isFinite(vv.y)) view = { x: +vv.x, y: +vv.y }; } catch (e) {}
  els.forEach(function (e) { var n = parseInt(String(e.id).replace(/\D/g, ''), 10); if (n >= nextId) nextId = n + 1; });

  function save() { lsSet(KEY_SCENE, JSON.stringify(els)); }
  function saveView() { lsSet(KEY_VIEW, JSON.stringify(view)); }
  function snap() { undoStack.push(JSON.stringify(els)); if (undoStack.length > 60) undoStack.shift(); syncUndo(); }
  function syncUndo() { document.getElementById('undo').disabled = !undoStack.length; }
  function newId() { return 'e' + (nextId++); }
  function selEl() {
    if (!selId) return null;
    for (var i = 0; i < els.length; i++) if (els[i].id === selId) return els[i];
    selId = null; return null;

      var p = providers[id], b = document.createElement('button'), dot = document.createElement('span'), name = document.createElement('span'), hint = document.createElement('span');
      b.type = 'button'; b.className = 'prov'; b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(id === PROVIDER));
      dot.className = 'dot'; name.textContent = p.label; hint.className = 'hint';
      hint.textContent = getKey(id) ? mask(getKey(id)) : p.keyHint;
      b.appendChild(dot); b.appendChild(name); b.appendChild(hint);
      b.addEventListener('click', function () {
        if (id === PROVIDER) return;
        PROVIDER = id; lsSet(KEY_PROVIDER, id); replacing = false; keyIn.value = ''; setState(''); renderModal();
      });
      provList.appendChild(b);
    });
    var p = providers[PROVIDER], connected = !!getKey(PROVIDER), managed = connected && !replacing;
    keyField.hidden = managed; connectBtn.hidden = managed; modelField.hidden = !connected; manageRow.hidden = !managed;
    keyIn.placeholder = p.placeholder; keyIn.setAttribute('aria-label', p.label + ' API key');
    modelIn.placeholder = p.defaults.model; modelIn.value = getModel(PROVIDER);
  }
  function openModal(o) {
    o = o || {};
    opener = o.opener || magic; replacing = !!o.replace; resumeSend = !!o.resume;
    keyIn.value = ''; setReveal(false); renderModal(); setState(o.message);
    scrim.hidden = false; dock.inert = true; modalOpen = true;
    (keyField.hidden ? replaceBtn : keyIn).focus();
  }
  function closeModal() {
    if (!modalOpen) return;
    if (checking) { checking.abort(); checking = null; }
    modalOpen = false; scrim.hidden = true; dock.inert = false;
    keyIn.value = ''; setReveal(false); setState('');
    (opener || magic).focus();
  }
  document.getElementById('dlgClose').addEventListener('click', closeModal);
  scrim.addEventListener('pointerdown', function (e) { if (e.target === scrim) closeModal(); });
  reveal.addEventListener('click', function () { setReveal(keyIn.type === 'password'); keyIn.focus(); });
  modelIn.addEventListener('input', function () {
    var v = modelIn.value.trim();
    if (v) lsSet(kModel(PROVIDER), v); else lsDel(kModel(PROVIDER));
  });
  replaceBtn.addEventListener('click', function () { replacing = true; setState(''); renderModal(); keyIn.focus(); });
  disconnectBtn.addEventListener('click', function () {
    lsDel(kKey(PROVIDER)); replacing = false; keyIn.value = ''; setState(''); renderModal(); keyIn.focus();
  });
  dlg.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeModal(); return; }
    if (e.key !== 'Tab') return;
    var f = Array.prototype.filter.call(dlg.querySelectorAll('button, input'), function (n) { return !n.disabled && n.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || !dlg.contains(document.activeElement))) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && (document.activeElement === last || !dlg.contains(document.activeElement))) { e.preventDefault(); first.focus(); }
  });
  document.addEventListener('keydown', function (e) { if (modalOpen && e.key === 'Escape') closeModal(); }, true);

  keyForm.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (keyField.hidden || checking) return;
    var key = keyIn.value.trim();
    if (!key) { keyIn.focus(); return; }
    if (/\s/.test(key)) { setState("That key didn't work."); return; }
    var prov = providers[PROVIDER], id = PROVIDER, ac = new AbortController();
    checking = ac; connectBtn.disabled = true; setState('Checking…');
    try {
      var ok = await prov.verify(key, ac.signal);
      if (ac.signal.aborted) return;
      if (!ok) { setState("That key didn't work."); return; }
      lsSet(kKey(id), key);
      if (getKey(id) !== key) { setState("Couldn't save on this device."); return; }
      var go = resumeSend;
      closeModal();
      if (go) { if (ask.value.trim()) { openPanel(); send(); } else openPanel(); }
    } catch (err) {
      if (!ac.signal.aborted) setState("Couldn't check that key. Try again.");
    } finally {
      if (checking === ac) checking = null;
      connectBtn.disabled = false;
    }
  });

  /* ---------- sending ---------- */
  function sceneForModel() {
    var vis = { x: Math.round(view.x), y: Math.round(view.y), width: W, height: H };
    var list = els.map(function (el) {
      var b = bbox(el), o = { id: el.id, type: el.type };
      if (el.type === 'line' || el.type === 'arrow') { o.x1 = Math.round(el.x); o.y1 = Math.round(el.y); o.x2 = Math.round(el.x + el.w); o.y2 = Math.round(el.y + el.h); }
      else { o.x = Math.round(b.x); o.y = Math.round(b.y); o.width = Math.round(b.w); o.height = Math.round(b.h); }
      if (el.text) o.text = el.text;
      if (el.url) o.url = el.url;
      if (el.strokeColor) o.strokeColor = el.strokeColor;
      if (el.fill && el.fill !== 'none') o.fill = el.fill;
      if (el.strokeWidth) o.strokeWidth = el.strokeWidth;
      if (el.dashed != null) o.dashed = !!el.dashed;
      if (el.ai) o.byAI = true;
      return o;
    });
    return { view: vis, elements: list };
  }
  function boardPng() {
    var k = Math.min(1, 1400 / Math.max(W, H));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * k)); c.height = Math.max(1, Math.round(H * k));
    var g = c.getContext('2d');
    g.scale(k, k); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    els.forEach(function (el) { drawEl(g, el, view.x, view.y); });
    try { return c.toDataURL('image/png').split(',')[1]; } catch (e) { return null; }
  }
  async function send() {
    var q = ask.value.trim();
    if (!q || busy) return;
    var key = getKey(PROVIDER);
    if (!key) { openModal({ opener: magic, resume: true }); return; }
    var prov = providers[PROVIDER];
    busy = true; magic.classList.add('busy');
    try {
      var text = q + '\n\nBoard JSON:\n' + JSON.stringify(sceneForModel());
      var reply = await prov.complete({ system: SYSTEM, text: text, imagePng: boardPng(), model: getModel(PROVIDER), key: key, signal: undefined });
      var parsed = parseReply(reply);
      if (!parsed) { showErr('Could not read the reply'); return; }
      applyReply(parsed);
      ask.value = ''; closePanel();
    } catch (err) {
      if (err && (err.status === 401 || err.status === 403)) openModal({ opener: magic, resume: true, replace: true, message: "That key didn't work." });
      else if (err instanceof TypeError) showErr('Network error');
      else showErr(String((err && err.message) || 'Something went wrong').slice(0, 120));
    } finally {
      busy = false; magic.classList.remove('busy');
    }
  }

  /* ---------- reply parsing (defensive) ---------- */
  function parseReply(raw) {
    if (typeof raw !== 'string') return null;
    var s = raw.trim().replace(/^```[a-zA-Z]*\s*/, '').replace(/\s*```$/, '');
    var a = s.indexOf('{'), b = s.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    try { var o = JSON.parse(s.slice(a, b + 1)); return o && typeof o === 'object' && !Array.isArray(o) ? o : null; } catch (e) { return null; }
  }
  function num(v, d) { v = Number(v); return isFinite(v) ? Math.max(-20000, Math.min(20000, v)) : d; }
  function str(v, n) { return typeof v === 'string' ? v.slice(0, n) : ''; }
  /* copy only palette values; anything else is dropped */
  function applyStyle(a, el) {
    var t = el.type;
    if (t === 'image') return;
    var c = pick(a.strokeColor, STROKES, null);
    if (c && t !== 'note') el.strokeColor = c;
    if (t === 'note') { var nf = pick(a.fill, NOTE_FILLS, null); if (nf) el.fill = nf; }
    else if (isClosed(t)) { var f = pick(a.fill === null || a.fill === 'transparent' ? 'none' : a.fill, FILLS, null); if (f) el.fill = f; }
    var w = t === 'note' || t === 'text' ? undefined : nearWidth(a.strokeWidth);
    if (w) el.strokeWidth = w;
    if (typeof a.dashed === 'boolean' && (isClosed(t) || t === 'line' || t === 'arrow')) el.dashed = a.dashed;
  }
  function sanitize(a) {
    if (!a || typeof a !== 'object') return null;
    var t = a.type, el = { id: newId(), type: t, ai: true };
    if (t === 'note') { el.x = num(a.x, view.x + 40); el.y = num(a.y, view.y + 40); el.text = str(a.text, 400); if (!el.text) return null; fitNote(el); }
    else if (t === 'text') { el.x = num(a.x, 0); el.y = num(a.y, 0); el.text = str(a.text, 400); if (!el.text) return null; }
    else if (isClosed(t)) {
      el.x = num(a.x, 0); el.y = num(a.y, 0);
      el.w = Math.abs(num(a.width != null ? a.width : a.w, 120)) || 120;
      el.h = Math.abs(num(a.height != null ? a.height : a.h, 80)) || 80;
      el.text = str(a.text, 120);
    }
    else if (t === 'line' || t === 'arrow') {
      if (a.x1 != null || a.x2 != null) { el.x = num(a.x1, 0); el.y = num(a.y1, 0); el.w = num(a.x2, el.x) - el.x; el.h = num(a.y2, el.y) - el.y; }
      else { el.x = num(a.x, 0); el.y = num(a.y, 0); el.w = num(a.width, 100); el.h = num(a.height, 0); }
    }
    else if (t === 'image') {
      var u = str(a.url, 2000);
      if (!/^https?:\/\//i.test(u)) return null;
      el.url = u; el.x = num(a.x, 0); el.y = num(a.y, 0);
      el.w = Math.abs(num(a.width, 200)) || 200; el.h = Math.abs(num(a.height, 200)) || 200;
    }
    else return null;
    applyStyle(a, el);
    return el;
  }
  function freeSpot(size) {
    var boxes = els.map(bbox);
    for (var r = 0; r < 12; r++) for (var c = 0; c < 20; c++) {
      var x = view.x + 24 + c * 40, y = view.y + 24 + r * 40;
      if (x + size > view.x + W - 24 || y + size > view.y + H - 100) continue;
      var ok = boxes.every(function (b) { return x + size + 12 < b.x || x > b.x + b.w + 12 || y + size + 12 < b.y || y > b.y + b.h + 12; });
      if (ok) return { x: x, y: y };
    }
    return { x: view.x + 24, y: view.y + 24 };
  }
  function applyReply(r) {
    var add = Array.isArray(r.add) ? r.add.slice(0, 40).map(sanitize).filter(Boolean) : [];
    var say = typeof r.say === 'string' ? r.say.trim().slice(0, 400) : '';
    if (!add.length && !say) { showErr('Nothing to add'); return; }
    snap();
    add.forEach(function (e) { els.push(e); });
    if (say) {
      var n = { id: newId(), type: 'note', ai: true, text: say, x: 0, y: 0 };
      fitNote(n);
      var p = freeSpot(n.w); n.x = p.x; n.y = p.y;
      els.push(n);
    }
    save(); draw();
  }

  /* ---------- share: download the board as a template file ---------- */
  document.getElementById('share').addEventListener('click', function () {
    commitEdit();
    var blob = new Blob([JSON.stringify(els, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'template.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  /* ---------- ?template=<id>: start from a template ---------- */
  function loadTemplate(id) {
    fetch('../templates/templates.json').then(function (r) { return r.json(); }).then(function (list) {
      var t = (Array.isArray(list) ? list : []).filter(function (x) { return x && x.id === id && typeof x.file === 'string' && /^[\w.-]+\.json$/.test(x.file); })[0];
      if (!t) return null;
      return fetch('../templates/' + t.file).then(function (r) { return r.json(); });
    }).then(function (tpl) {
      if (!Array.isArray(tpl)) return;
      tpl = tpl.filter(function (e) { return e && typeof e === 'object' && e.type; });
      if (!tpl.length) return;
      if (els.length) lsSet(KEY_SCENE + '.prev.' + Date.now(), JSON.stringify(els));
      els = tpl; selId = null; nextId = 1; undoStack = []; syncUndo();
      els.forEach(function (e) { var n = parseInt(String(e.id).replace(/\D/g, ''), 10); if (n >= nextId) nextId = n + 1; });
      var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      els.forEach(function (e) { var b = bbox(e); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); });
      view = { x: Math.round((x0 + x1) / 2 - W / 2), y: Math.round((y0 + y1) / 2 - H / 2) };
      save(); saveView(); draw();
    }).catch(function () {});
    if (window.history && history.replaceState) history.replaceState(null, '', location.pathname);
  }

  resize();
  var tplId = new URLSearchParams(location.search).get('template');
  if (tplId) loadTemplate(tplId);
})();
</script>
</body>
