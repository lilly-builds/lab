<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The dev workflow, as train tracks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --ink: #000; --paper: #fff; --f: "Special Elite", "Courier New", monospace; }
  * { box-sizing: border-box; border-radius: 0; box-shadow: none; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f); font-weight: normal; font-style: normal; }
  body { padding: 20px 16px 60px; max-width: 1280px; }
  h1, h2, h3 { font-weight: normal; margin: 0; }
  h1 { font-size: 28px; letter-spacing: 0.5px; }
  h2 { font-size: 20px; margin: 20px 0 6px; }
  .sub { font-size: 13px; margin: 6px 0 14px; max-width: 760px; line-height: 1.4; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  button.tog { font-family: var(--f); font-size: 14px; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); padding: 6px 16px; cursor: pointer; }
  button.tog[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .good { font-size: 14px; margin: 0 0 12px; max-width: 760px; line-height: 1.4; }
  #scroller { border: 1px solid var(--ink); overflow-x: auto; background: var(--paper); }
  svg { display: block; min-width: 980px; width: 100%; height: auto; }
  svg text { font-family: var(--f); font-weight: normal; fill: var(--ink); }
  .sig { cursor: pointer; }
  .sig:focus { outline: none; }
  .sig:focus .ring, .sig.sel .ring { display: inline; }
  .ring { display: none; fill: none; stroke: var(--ink); stroke-width: 2; }
  #detail { margin-top: 12px; border: 1px solid var(--ink); padding: 9px 10px; font-size: 13px; line-height: 1.4; max-width: 520px; }
  #detail[hidden] { display: none; }
  .seed { margin-top: 24px; font-size: 12px; max-width: 760px; line-height: 1.5; }
  .seed span { display: inline-block; margin-right: 14px; }
</style>
</head>
<body>
<h1>The dev workflow, as train tracks</h1>
<p class="sub">Idea to live, with a few builds going at once. Green is moving. Yellow is stalled, the agent is stuck. Red is waiting on a human. Same five example builds in all three, so you can compare.</p>

<div class="bar" role="group" aria-label="Pick a take">
  <button class="tog" data-v="A" aria-pressed="true">A</button>
  <button class="tog" data-v="B" aria-pressed="false">B</button>
  <button class="tog" data-v="C" aria-pressed="false">C</button>
</div>

<h2 id="name"></h2>
<p class="good" id="good"></p>
<div id="scroller"><svg id="art" role="img" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="detail" hidden></div>

<p class="seed" id="seed"></p>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var COL = { green: "#b2f2bb", yellow: "#ffec99", red: "#ffc9c9" };
  var WORD = { green: "moving", yellow: "stalled", red: "needs you" };
  var RANK = { green: 1, yellow: 2, red: 3 };
  var STAGES = ["Idea", "Plan/spec", "Doc review", "Tests defined", "Build", "Code review", "Fix/optimize", "PR", "CI", "CD", "LIVE"];
  var WORK = [
    { name: "Search bug", stage: 4, state: "green" },
    { name: "New onboarding", stage: 2, state: "yellow" },
    { name: "Billing spike", stage: 7, state: "red" },
    { name: "Dark mode", stage: 5, state: "green" },
    { name: "Email digest", stage: 8, state: "yellow" }
  ];
  var TAKES = {
    A: { name: "A. One shared track", good: "Good for seeing the whole pipeline at a glance and where the traffic bunches up." },
    B: { name: "B. A track per build", good: "Good for following one build all the way through, and for when you are juggling a lot of them." },
    C: { name: "C. Signals on the track", good: "Good for a quick look: where is anything stuck or waiting on me. Least detail, fastest read." }
  };

  var svg = document.getElementById("art");
  var detail = document.getElementById("detail");
  var X0 = 70, DX = 100;
  var sx = function (i) { return X0 + DX * i; };

  function el(tag, attrs, parent, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function line(p, x1, y1, x2, y2, w, dash) {
    var a = { x1: x1, y1: y1, x2: x2, y2: y2, stroke: "#000", "stroke-width": w };
    if (dash) a["stroke-dasharray"] = dash;
    return el("line", a, p);
  }
  function stageLabels(p, y, size) {
    STAGES.forEach(function (s, i) {
      el("text", { x: sx(i), y: y, "text-anchor": "middle", "font-size": size }, p, s);
    });
  }
  function dot(p, i, y, big) {
    var r = i === 10 ? (big ? 16 : 9) : (big ? 9 : 5);
    if (i === 10) el("circle", { cx: sx(i), cy: y, r: r + 5, fill: "none", stroke: "#000", "stroke-width": 1.5 }, p);
    el("circle", { cx: sx(i), cy: y, r: r, fill: "#fff", stroke: "#000", "stroke-width": big ? 3 : 2 }, p);
  }
  function setSize(w, h) {
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("aria-label", "Preview of the dev workflow");
  }

  function drawA() {
    var H = 300, Y = 170;
    setSize(1210, H);
    line(svg, sx(0), Y, sx(10), Y, 4);
    // loopback from Fix/optimize back to Code review
    var a = sx(5), b = sx(6);
    el("path", { d: "M " + b + " " + Y + " C " + b + " " + (Y + 70) + " " + a + " " + (Y + 70) + " " + a + " " + Y, fill: "none", stroke: "#000", "stroke-width": 4 }, svg);
    el("path", { d: "M " + (a - 7) + " " + (Y + 10) + " L " + a + " " + Y + " L " + (a + 7) + " " + (Y + 10), fill: "none", stroke: "#000", "stroke-width": 3 }, svg);
    el("text", { x: (a + b) / 2, y: Y + 76, "text-anchor": "middle", "font-size": 11 }, svg, "loops until done");
    for (var i = 0; i < 11; i++) dot(svg, i, Y, true);
    stageLabels(svg, Y + 36, 11);
    WORK.forEach(function (w) {
      var x = sx(w.stage);
      line(svg, x, Y - 60, x, Y - 12, 1.5);
      el("rect", { x: x - 46, y: Y - 128, width: 92, height: 68, fill: COL[w.state], stroke: "#000", "stroke-width": 1.5 }, svg);
      el("text", { x: x, y: Y - 100, "text-anchor": "middle", "font-size": 11 }, svg, w.name);
      el("text", { x: x, y: Y - 76, "text-anchor": "middle", "font-size": 10 }, svg, WORD[w.state]);
    });
  }

  function drawB() {
    var ROW = 54, T = 56, H = T + ROW * WORK.length + 10;
    setSize(1210, H);
    stageLabels(svg, 22, 11);
    WORK.forEach(function (w, r) {
      var y = T + ROW * r + 14;
      line(svg, sx(0), y, sx(10), y, 3);
      for (var i = 0; i < 11; i++) dot(svg, i, y, false);
      el("text", { x: sx(0) - 50, y: y - 14, "font-size": 12 }, svg, w.name + " (" + WORD[w.state] + ")");
      var x = sx(w.stage);
      el("circle", { cx: x, cy: y, r: 13, fill: COL[w.state], stroke: "#000", "stroke-width": 3 }, svg);
    });
  }

  function drawC() {
    var Y = 130;
    setSize(1210, 230);
    line(svg, sx(0), Y, sx(10), Y, 4);
    for (var i = 0; i < 11; i++) {
      (function (i) {
        var here = WORK.filter(function (w) { return w.stage === i; });
        var worst = null;
        here.forEach(function (w) { if (!worst || RANK[w.state] > RANK[worst]) worst = w.state; });
        var g = el("g", { "class": "sig", tabindex: 0, role: "button", "aria-label": STAGES[i] + ": " + (worst ? WORD[worst] + ", " + here.length + " build" + (here.length > 1 ? "s" : "") : "empty") }, svg);
        var r = i === 10 ? 24 : 18;
        if (i === 10) el("circle", { cx: sx(i), cy: Y, r: r + 6, fill: "none", stroke: "#000", "stroke-width": 1.5 }, g);
        el("circle", { cx: sx(i), cy: Y, r: r, fill: worst ? COL[worst] : "#fff", stroke: "#000", "stroke-width": 3 }, g);
        el("circle", { "class": "ring", cx: sx(i), cy: Y, r: r + 9 }, g);
        if (here.length) el("text", { x: sx(i), y: Y + 5, "text-anchor": "middle", "font-size": 14 }, g, String(here.length));
        el("text", { x: sx(i), y: Y + 50, "text-anchor": "middle", "font-size": 11 }, g, STAGES[i]);
        var pick = function () {
          Array.prototype.forEach.call(svg.querySelectorAll(".sig"), function (n) { n.classList.remove("sel"); });
          g.classList.add("sel");
          detail.hidden = false;
          detail.textContent = "";
          detail.appendChild(document.createTextNode(STAGES[i] + ": "));
          detail.appendChild(document.createTextNode(here.length ? here.map(function (w) { return w.name + " (" + WORD[w.state] + ")"; }).join(", ") : "nothing here right now"));
        };
        g.addEventListener("click", pick);
        g.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
      })(i);
    }
    el("text", { x: sx(0) - 50, y: 40, "font-size": 12 }, svg, "Each light shows the worst state at that stop. The number is how many builds are there. Click one.");
  }

  function show(v) {
    svg.textContent = "";
    detail.hidden = true;
    document.getElementById("name").textContent = TAKES[v].name;
    document.getElementById("good").textContent = TAKES[v].good;
    Array.prototype.forEach.call(document.querySelectorAll("button.tog"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-v") === v ? "true" : "false");
    });
    ({ A: drawA, B: drawB, C: drawC })[v]();
    if (history.replaceState) history.replaceState(null, "", "#" + v);
  }

  Array.prototype.forEach.call(document.querySelectorAll("button.tog"), function (b) {
    b.addEventListener("click", function () { show(b.getAttribute("data-v")); });
  });

  var seed = document.getElementById("seed");
  WORK.forEach(function (w) {
    var s = document.createElement("span");
    s.textContent = w.name + ": " + STAGES[w.stage] + ", " + WORD[w.state];
    seed.appendChild(s);
  });

  var h = (location.hash || "").replace("#", "").toUpperCase();
  show(TAKES[h] ? h : "A");
})();
</script>
</body>
</html>
