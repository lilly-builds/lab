<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The dev workflow, as train tracks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<meta name="color-scheme" content="dark">
<style>
  :root { --ink: #e6e6e6; --paper: #0f1115; --f: "Special Elite", "Courier New", monospace; }
  * { box-sizing: border-box; border-radius: 0; box-shadow: none; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f); font-weight: normal; font-style: normal; }
  body { padding: 20px 16px 60px; max-width: 1280px; }
  h1 { font-weight: normal; margin: 0 0 14px; font-size: 28px; letter-spacing: 0.5px; }
  .key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 12px; padding: 0; list-style: none; font-size: 12px; }
  .key li { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .key i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--ink); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  button.tog { font-family: var(--f); font-size: 14px; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); padding: 6px 16px; cursor: pointer; }
  button.tog[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #scroller { border: 1px solid #3a3f4b; overflow-x: auto; background: var(--paper); -webkit-overflow-scrolling: touch; }
  svg { display: block; width: 100%; height: auto; }
  .key[hidden], .bar[hidden] { display: none; }
  .key svg { display: inline-block; width: auto; height: auto; }
  .blink-slow { animation: slow 2.8s ease-in-out infinite; }
  .blink-fast { animation: fast 0.6s steps(1, end) infinite; }
  .blink-double { animation: dbl 1.6s steps(1, end) infinite; }
  @keyframes slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes fast { 0% { opacity: 1; } 50% { opacity: 0.1; } }
  @keyframes dbl { 0% { opacity: 1; } 12% { opacity: 0.1; } 24% { opacity: 1; } 36% { opacity: 0.1; } 48%, 100% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .blink-slow, .blink-fast, .blink-double { animation: none; } }
  svg text { font-family: var(--f); font-weight: normal; fill: var(--ink); }
</style>
</head>
<body>
<h1>The dev workflow, as train tracks</h1>

<ul class="key" id="key-circles">
  <li><i style="background:#b2f2bb"></i>moving</li>
  <li><i style="background:#ffec99"></i>stalled / agent stuck</li>
  <li><i style="background:#ffc9c9"></i>needs a human</li>
</ul>

<ul class="key" id="key-spec" hidden></ul>

<div class="bar" role="group" aria-label="View">
  <button class="tog vw" data-w="spectrum" aria-pressed="true">Spectrum</button>
  <button class="tog vw" data-w="git" aria-pressed="false">Git branches</button>
</div>

<div class="bar" id="layout-bar" role="group" aria-label="Layout" hidden></div>

<div id="scroller"><svg id="art" role="img" xmlns="http://www.w3.org/2000/svg"></svg></div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  var COL = { green: "#b2f2bb", yellow: "#ffec99", red: "#ffc9c9" };
  var WORD = { green: "moving", yellow: "stalled", red: "needs you" };
  var STAGES = ["Idea", "Spec", "Spec review", "Tests", "Build", "Code review", "Fix/optimize", "Security & deps scan", "PR", "CI", "Preview deploy", "CD", "Live", "Observe & rollback"];
  var LAST = STAGES.length - 1, LIVE = 12;
  var WORK = [
    { name: "Owner live dashboard", stage: 4, state: "green", attn: null },
    { name: "Builder manifesto docs", stage: 12, state: "green", attn: null },
    { name: "Guidance tool", stage: 12, state: "green", attn: null },
    { name: "Report panels", stage: 12, state: "green", attn: null },
    { name: "Evals schema", stage: 12, state: "green", attn: null },
    { name: "Eval runbook", stage: 12, state: "green", attn: null },
    { name: "Build contracts", stage: 12, state: "green", attn: null },
    { name: "Main caught up to live", stage: 12, state: "green", attn: null },
    { name: "Polish CI tests", stage: 0, state: "green", attn: null },
    { name: "Dev docs", stage: 0, state: "green", attn: null },
    { name: "8 git issues", stage: 1, state: "green", attn: null }
  ];
  var VARS = { B: 1 };
  var VIEWS = { spectrum: 1, git: 1 };
  // Spectrum view: attention shapes and what they mean.
  var SHAPE_WORD = { diamond: "needs human judgment", square: "agent stuck", triangle: "needs debugging" };
  var SHAPE_BLINK = { diamond: "blink-slow", square: "blink-fast", triangle: "blink-double" };
  var BAND_L = 20, BAND_R = 1450;
  // Git story for the same builds. Time slots t run oldest (0) to newest (11).
  // A build at or past Live is merged into main; the rest are live branches.
  // Slots: 0 #133 opened Oct 10; 1-3 #136 (Oct 13); 5 #138, 6 #139, 7 #137, 8 #133, 9 #140, 11 manifesto.
  var MAIN_T = [0, 3, 5, 6, 7, 8, 9, 11];
  var BRANCHES = [
    { name: "Report panels", fork: 0, commits: [1], merge: 8 },
    { name: "Owner live dashboard", fork: 1, commits: [2] },
    { name: "Main caught up to live", fork: 1, commits: [2], merge: 3 },
    { name: "Evals schema", fork: 3, commits: [4], merge: 5 },
    { name: "Eval runbook", fork: 3, commits: [4], merge: 6 },
    { name: "Build contracts", fork: 3, commits: [4], merge: 7 },
    { name: "Guidance tool", fork: 7, commits: [8], merge: 9 },
    { name: "Builder manifesto docs", fork: 9, commits: [10], merge: 11 }
  ];
  function work(name) { return WORK.filter(function (w) { return w.name === name; })[0]; }

  var svg = document.getElementById("art");
  var X0 = 70, DX = 100;
  var view = "spectrum", variant = "B";
  var sx = function (i) { return X0 + DX * i; };

  function el(tag, attrs, parent, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function line(p, x1, y1, x2, y2, w, dash) {
    var a = { x1: x1, y1: y1, x2: x2, y2: y2, stroke: "#e6e6e6", "stroke-width": w };
    if (dash) a["stroke-dasharray"] = dash;
    return el("line", a, p);
  }
  function stopLabel(p, i, y, size) {
    var words = STAGES[i].split(" ");
    var lines = STAGES[i].length > 14 ? [words.slice(0, 2).join(" "), words.slice(2).join(" ")] : [STAGES[i]];
    lines.forEach(function (t, k) {
      el("text", { x: sx(i), y: y + k * 13, "text-anchor": "middle", "font-size": size }, p, t);
    });
  }
  function stageLabels(p, y, size) {
    STAGES.forEach(function (s, i) { stopLabel(p, i, y, size); });
  }
  function dot(p, i, y, big) {
    var r = i === LIVE ? (big ? 16 : 9) : (big ? 9 : 5);
    if (i === LIVE) el("circle", { cx: sx(i), cy: y, r: r + 5, fill: "none", stroke: "#e6e6e6", "stroke-width": 1.5 }, p);
    el("circle", { cx: sx(i), cy: y, r: r, fill: "#0f1115", stroke: "#e6e6e6", "stroke-width": big ? 3 : 2 }, p);
  }
  function setSize(w, h, min) {
    svg.style.minWidth = min ? min + "px" : "0";
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("aria-label", "Preview of the dev workflow");
  }

  function drawA() {
    var H = 300, Y = 170;
    setSize(1470, H, 1190);
    line(svg, sx(0), Y, sx(LAST), Y, 4);
    // loopback from Fix/optimize back to Code review
    var a = sx(5), b = sx(6);
    el("path", { d: "M " + b + " " + Y + " C " + b + " " + (Y + 70) + " " + a + " " + (Y + 70) + " " + a + " " + Y, fill: "none", stroke: "#e6e6e6", "stroke-width": 4 }, svg);
    el("path", { d: "M " + (a - 7) + " " + (Y + 10) + " L " + a + " " + Y + " L " + (a + 7) + " " + (Y + 10), fill: "none", stroke: "#e6e6e6", "stroke-width": 3 }, svg);
    el("text", { x: (a + b) / 2, y: Y + 76, "text-anchor": "middle", "font-size": 11 }, svg, "loops until done");
    for (var i = 0; i <= LAST; i++) dot(svg, i, Y, true);
    stageLabels(svg, Y + 36, 11);
    WORK.forEach(function (w) {
      var x = sx(w.stage);
      line(svg, x, Y - 60, x, Y - 12, 1.5);
      el("rect", { x: x - 46, y: Y - 128, width: 92, height: 68, fill: COL[w.state], stroke: "#e6e6e6", "stroke-width": 1.5 }, svg);
      el("text", { x: x, y: Y - 100, "text-anchor": "middle", "font-size": 11 }, svg, w.name);
      el("text", { x: x, y: Y - 76, "text-anchor": "middle", "font-size": 10 }, svg, WORD[w.state]);
    });
  }

  function drawB() {
    var ROW = 54, T = 56, H = T + ROW * WORK.length + 10;
    setSize(1470, H, 1190);
    stageLabels(svg, 22, 11);
    WORK.forEach(function (w, r) {
      var y = T + ROW * r + 14;
      line(svg, sx(0), y, sx(LAST), y, 3);
      for (var i = 0; i <= LAST; i++) dot(svg, i, y, false);
      el("text", { x: sx(0) - 50, y: y - 14, "font-size": 12 }, svg, w.name + " (" + WORD[w.state] + ")");
      var x = sx(w.stage);
      el("circle", { cx: x, cy: y, r: 13, fill: COL[w.state], stroke: "#e6e6e6", "stroke-width": 3 }, svg);
    });
  }

  // ---- Spectrum ----
  // Red (hue 0) to violet (hue 270) across the band; t runs 0..1.
  function spectrum(t) { return "hsl(" + Math.round(270 * t) + ",100%,50%)"; }
  function bandDefs(p, id, x1, x2) {
    var g = el("linearGradient", { id: id, gradientUnits: "userSpaceOnUse", x1: x1, y1: 0, x2: x2, y2: 0 }, el("defs", {}, p));
    for (var k = 0; k <= 54; k++) el("stop", { offset: (k / 54 * 100) + "%", "stop-color": spectrum(k / 54) }, g);
  }
  function shapeEl(p, kind, x, y, r, fill, w, cls) {
    var a = { fill: fill, stroke: "#e6e6e6", "stroke-width": w };
    if (cls) a["class"] = cls;
    if (kind === "diamond") { a.points = [x, y - r - 3, x + r + 3, y, x, y + r + 3, x - r - 3, y].join(" "); return el("polygon", a, p); }
    if (kind === "triangle") { a.points = [x, y - r - 2, x + r + 3, y + r - 1, x - r - 3, y + r - 1].join(" "); return el("polygon", a, p); }
    if (kind === "square") { a.x = x - r; a.y = y - r; a.width = r * 2; a.height = r * 2; return el("rect", a, p); }
    a.cx = x; a.cy = y; a.r = r; return el("circle", a, p);
  }
  function drawSpectrum() {
    var BT = 8, BH = 26, ROW = 62, T = BT + BH + 40, H = T + ROW * WORK.length + 6;
    setSize(1470, H, 1190);
    bandDefs(svg, "bandmain", BAND_L, BAND_R);
    el("rect", { x: BAND_L, y: BT, width: BAND_R - BAND_L, height: BH, fill: "url(#bandmain)", stroke: "#e6e6e6", "stroke-width": 1.5 }, svg);
    stageLabels(svg, BT + BH + 18, 11);
    WORK.forEach(function (w, r) {
      var y = T + ROW * r + 14, x = sx(w.stage);
      line(svg, sx(0), y, sx(LAST), y, 3);
      for (var i = 0; i <= LAST; i++) el("circle", { cx: sx(i), cy: y, r: 5, fill: "#0f1115", stroke: "#e6e6e6", "stroke-width": 2 }, svg);
      el("text", { x: sx(0) - 50, y: y - 20, "font-size": 12 }, svg, w.name + " (" + (w.attn ? SHAPE_WORD[w.attn] : "moving") + ")");
      shapeEl(svg, w.attn || "circle", x, y, 13, spectrum((x - BAND_L) / (BAND_R - BAND_L)), 3, w.attn ? SHAPE_BLINK[w.attn] : "");
    });
  }
  function buildKeys() {
    var k = document.getElementById("key-spec");
    var li = document.createElement("li"), bs = document.createElementNS(NS, "svg");
    k.appendChild(li);
    bs.setAttribute("width", 90); bs.setAttribute("height", 11); bs.setAttribute("viewBox", "0 0 90 11");
    bs.setAttribute("aria-hidden", "true");
    bandDefs(bs, "bandkey", 0, 90);
    el("rect", { x: 0.5, y: 0.5, width: 89, height: 10, fill: "url(#bandkey)", stroke: "#e6e6e6", "stroke-width": 1 }, bs);
    li.appendChild(bs); li.appendChild(document.createTextNode("where it is in the process"));
    ["diamond", "square", "triangle"].forEach(function (s) {
      var l = document.createElement("li"), v = document.createElementNS(NS, "svg");
      v.setAttribute("width", 14); v.setAttribute("height", 14); v.setAttribute("viewBox", "0 0 14 14");
      v.setAttribute("aria-hidden", "true");
      shapeEl(v, s, 7, 7, s === "square" ? 4.5 : 4, "none", 1.5);
      l.appendChild(v); l.appendChild(document.createTextNode(SHAPE_WORD[s]));
      k.appendChild(l);
    });
  }

  // ---- Git branches ----
  function chev(p, x, y, dir) {
    var d = dir === "left" ? "M " + (x + 8) + " " + (y - 6) + " L " + x + " " + y + " L " + (x + 8) + " " + (y + 6)
                           : "M " + (x - 6) + " " + (y + 8) + " L " + x + " " + y + " L " + (x + 6) + " " + (y + 8);
    el("path", { d: d, fill: "none", stroke: "#e6e6e6", "stroke-width": 3 }, p);
  }
  function gdot(p, x, y, kind) {
    // kind: plain | ink (merged commit) | a state colour (live tip, or the light on main)
    if (kind === "plain") el("circle", { cx: x, cy: y, r: 5, fill: "#0f1115", stroke: "#e6e6e6", "stroke-width": 2 }, p);
    else if (kind === "ink") el("circle", { cx: x, cy: y, r: 5, fill: "#e6e6e6", stroke: "#e6e6e6", "stroke-width": 2 }, p);
    else el("circle", { cx: x, cy: y, r: 10, fill: COL[kind], stroke: "#e6e6e6", "stroke-width": 3 }, p);
  }
  function glabel(p, x, y, w) {
    el("text", { x: x, y: y - 2, "font-size": 14 }, p, w.name);
    el("text", { x: x, y: y + 13, "font-size": 12 }, p, WORD[w.state]);
  }
  function mainDots(p, pos, head) {
    MAIN_T.forEach(function (t) {
      var m = BRANCHES.filter(function (b) { return b.merge === t; })[0];
      var q = pos(t);
      if (t === 11) {
        el("circle", { cx: q[0], cy: q[1], r: 8, fill: "#0f1115", stroke: "#e6e6e6", "stroke-width": 3 }, p);
        el("text", { x: q[0] + head[0], y: q[1] + head[1], "font-size": 14 }, p, "main");
      } else gdot(p, q[0], q[1], m ? work(m.name).state : "plain");
    });
  }

  // Layout B: vertical git graph, newest on top.
  function gitB() {
    var ROW = 44, TOP = 44, MX = 40, LBL = 306, TN = 11;
    var LANE = {};
    BRANCHES.forEach(function (b, i) { LANE[b.name] = 90 + i * 26; });
    var y = function (t) { return TOP + (TN - t) * ROW; };
    setSize(560, TOP * 2 + TN * ROW, 0); svg.style.maxWidth = "760px";
    line(svg, MX, y(0), MX, y(TN), 4);
    BRANCHES.forEach(function (b) {
      var w = work(b.name), lx = LANE[b.name], merged = w.stage >= LIVE;
      var last = merged ? b.merge : b.commits[b.commits.length - 1];
      var d = "M " + MX + " " + y(b.fork) + " H " + lx + " V " + y(last) + (merged ? " H " + MX : "");
      el("path", { d: d, fill: "none", stroke: "#e6e6e6", "stroke-width": 3 }, svg);
      if (merged) chev(svg, MX + 12, y(b.merge), "left");
      b.commits.forEach(function (t, i) {
        var tip = !merged && i === b.commits.length - 1;
        gdot(svg, lx, y(t), merged ? "ink" : tip ? w.state : "plain");
      });
      line(svg, lx + 14, y(last), LBL - 8, y(last), 1, "2 4");
      glabel(svg, LBL, y(last), w);
    });
    mainDots(svg, function (t) { return [MX, y(t)]; }, [-16, -16]);
  }

  // Layout A: horizontal main, branches forking above and below.
  function gitA() {
    var X0g = 60, DXg = 88, YM = 160;
    var LANE = { "Search bug": -60, "New onboarding": -120, "Dark mode": 60, "Email digest": 120, "Billing spike": 180 };
    var x = function (t) { return X0g + DXg * t; };
    setSize(1190, YM + 230, 1190);
    line(svg, x(0), YM, x(11), YM, 4);
    BRANCHES.forEach(function (b) {
      var w = work(b.name), ly = YM + LANE[b.name], merged = w.stage >= LIVE;
      var last = merged ? b.merge : b.commits[b.commits.length - 1];
      var d = "M " + x(b.fork) + " " + YM + " V " + ly + " H " + x(last) + (merged ? " V " + YM : "");
      el("path", { d: d, fill: "none", stroke: "#e6e6e6", "stroke-width": 3 }, svg);
      if (merged) chev(svg, x(b.merge), YM + 12, "up");
      b.commits.forEach(function (t, i) {
        var tip = !merged && i === b.commits.length - 1;
        gdot(svg, x(t), ly, merged ? "ink" : tip ? w.state : "plain");
      });
      glabel(svg, x(last) + 18, ly + 1, w);
    });
    mainDots(svg, function (t) { return [x(t), YM]; }, [18, 5]);
  }

  function show(w, v) {
    view = w; variant = v;
    svg.textContent = "";
    Array.prototype.forEach.call(document.querySelectorAll("button.vw"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-w") === w ? "true" : "false");
    });
    Array.prototype.forEach.call(document.querySelectorAll("button.vr"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-v") === v ? "true" : "false");
    });
    var spec = w === "spectrum";
    document.getElementById("key-circles").hidden = spec;
    document.getElementById("key-spec").hidden = !spec;
    document.getElementById("layout-bar").hidden = spec;
    svg.style.maxWidth = "none";
    document.getElementById("scroller").style.maxWidth = spec ? "none" : "762px";
    if (spec) drawSpectrum();
    else gitB();
    if (history.replaceState) history.replaceState(null, "", "#" + w + "-" + v);
  }

  Array.prototype.forEach.call(document.querySelectorAll("button.vw"), function (b) {
    b.addEventListener("click", function () { show(b.getAttribute("data-w"), variant); });
  });
  Array.prototype.forEach.call(document.querySelectorAll("button.vr"), function (b) {
    b.addEventListener("click", function () { show(view, b.getAttribute("data-v")); });
  });

  buildKeys();
  var parts = (location.hash || "").replace("#", "").toLowerCase().split("-");
  var hv = (parts[1] || parts[0]).toUpperCase();
  show(VIEWS[parts[0]] ? parts[0] : "spectrum", "B");
})();
</script>
</body>
</html>
