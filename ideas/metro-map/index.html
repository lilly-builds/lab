<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The dreamspace, as a metro map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --ink: #000; --paper: #fff; --f: "Special Elite", "Courier New", monospace; }
  * { box-sizing: border-box; border-radius: 0; box-shadow: none; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f); font-weight: normal; font-style: normal; }
  body { padding: 20px 16px 60px; }
  h1, h2, h3 { font-weight: normal; margin: 0; }
  h1 { font-size: 28px; letter-spacing: 0.5px; }
  h2 { font-size: 20px; margin: 36px 0 12px; }
  h3 { font-size: 15px; }
  .sub { font-size: 13px; margin: 6px 0 14px; }
  .bar { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; margin-bottom: 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .label { font-size: 12px; margin-right: 2px; }
  .key { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .key svg { display: block; overflow: visible; }
  .tag { display: inline-block; font-family: var(--f); font-size: 11px; line-height: 1; padding: 3px 6px; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); }
  .tag.SHIPPED { background: var(--ink); color: var(--paper); }
  .tag.BUILDING { border-width: 2px; padding: 2px 5px; }
  .tag.QUEUED { border: 1px solid var(--ink); }
  .tag.IDEA { border: 1px dashed var(--ink); }
  button.tog { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f); font-size: 12px; font-weight: normal; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); padding: 5px 9px; cursor: pointer; }
  button.tog[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  button.tog svg { display: block; overflow: visible; background: var(--paper); }
  #scroller { border: 1px solid var(--ink); overflow-x: auto; overflow-y: hidden; background: var(--paper); }
  #wrap { position: relative; }
  #map { display: block; width: 100%; height: auto; }
  #map text { font-family: var(--f); font-weight: normal; font-style: normal; fill: var(--ink); }
  #map text.halo { paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: miter; }
  #map .st { cursor: pointer; }
  #map .st:focus { outline: none; }
  #map .st .ring { display: none; fill: none; stroke: var(--ink); stroke-width: 2; }
  #map .st:focus .ring, #map .st.sel .ring { display: block; }
  #map .dim { opacity: 0.25; }
  #card { position: absolute; width: 230px; background: var(--paper); border: 1px solid var(--ink); padding: 9px 10px; font-size: 13px; line-height: 1.35; z-index: 2; }
  #card[hidden] { display: none; }
  #card .ct { font-size: 15px; margin-bottom: 6px; }
  #card .cl { font-size: 11px; margin-top: 6px; }
  #card .cn { margin-top: 7px; }
  #map { user-select: none; -webkit-user-select: none; }
  #map .st { touch-action: none; }
  #map .st .shadow, #map .st .more { display: none; }
  #map .st.drag .shadow { display: block; }
  #map .st.drag { cursor: grabbing; }
  #map .st.sel .more { display: block; }
  #map .more, #map .addb { cursor: pointer; }
  #map .addb:focus { outline: none; }
  #map .addb:focus rect, #map .more:focus rect { stroke-width: 3; }
  button.tog:disabled { opacity: 0.4; cursor: default; }
  button.quiet { font-family: var(--f); font-size: 11px; font-weight: normal; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); padding: 3px 7px; cursor: pointer; }
  #resetbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: -8px 0 16px; }
  input.ed { position: absolute; z-index: 4; width: 220px; font-family: var(--f); font-size: 14px; background: var(--paper); color: var(--ink); border: 2px solid var(--ink); padding: 4px 6px; outline: none; }
  #menu { position: absolute; z-index: 4; width: 190px; background: var(--paper); border: 1px solid var(--ink); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  #menu[hidden] { display: none; }
  #menu .mh { font-size: 11px; }
  button.mi { font-family: var(--f); font-size: 12px; font-weight: normal; text-align: left; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); padding: 5px 8px; cursor: pointer; }
  button.mi[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #toast { position: fixed; left: 16px; bottom: 16px; z-index: 10; display: flex; align-items: center; gap: 12px; background: var(--paper); border: 1px solid var(--ink); padding: 8px 10px; font-size: 13px; }
  #toast[hidden] { display: none; }
  .lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .block { border: 1px solid var(--ink); padding: 12px; }
  .block h3 { display: flex; align-items: center; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--ink); margin-bottom: 8px; }
  .block h3 svg { flex: none; }
  .block ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .block li { font-size: 14px; line-height: 1.3; }
  .block li .tag { margin-left: 6px; vertical-align: 1px; }
  .block li .nt { display: block; font-size: 11px; margin-top: 3px; }
  .end { margin-top: 20px; font-size: 13px; }
</style>
</head>
<body>
<h1>The dreamspace, as a metro map</h1>
<div class="sub">Lines are workstreams. Stations are features. Everything ends at one place.</div>
<div class="bar">
  <div class="row" id="legend"></div>
  <div class="row" id="filters"><span class="label">Show only</span></div>
  <div class="row" id="tools"></div>
</div>
<div id="resetbox"></div>
<div id="scroller">
  <div id="wrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Metro map of the dreamspace plan. A list version follows below the map."></svg>
    <div id="card" role="status" hidden></div>
    <div id="menu" role="group" aria-label="Station menu" hidden></div>
  </div>
</div>
<h2>As a list</h2>
<div class="lists" id="lists"></div>
<div class="end" id="endnote"></div>
<div id="toast" role="status" hidden></div>

<script>
// ===== DATA BLOCK: the only part future edits touch =====
// To add a feature: add one line to STATIONS in the order it appears along its line.
// LINES: {id, name, pattern}  pattern is one of: solid, dashed, dotted, double, dashdot.
//   Lines are drawn top to bottom in this order.
// STATIONS: {id, line, text, status, note?, also?}
//   status is exactly one of: SHIPPED, BUILDING, QUEUED, IDEA.
//   also (optional) is a second line id: the station is an interchange and sits on the
//   lane of `line`; the other line bends over to touch it. List it once, never twice.
// Unknown line or status ends up on the "Loose" line at the bottom so nothing is dropped.
var LINES = [
  {id: "core", name: "Core loop", pattern: "solid"},
  {id: "share", name: "Share and publish", pattern: "double"},
  {id: "gallery", name: "Gallery and community", pattern: "dotted"},
  {id: "canvas", name: "Canvas", pattern: "dashed"},
  {id: "vision", name: "Vision", pattern: "dashdot"}
];
var STATIONS = [
  {id: "input", line: "core", text: "One input box", status: "BUILDING"},
  {id: "drawback", line: "core", text: "Draw-back AI", status: "SHIPPED"},
  {id: "router", line: "core", text: "One router picks the tool", status: "SHIPPED", note: "issue 57"},
  {id: "makereal", line: "core", text: "Make it real in the browser", status: "SHIPPED"},
  {id: "errors", line: "core", text: "Real errors and retry", status: "BUILDING"},
  {id: "timer", line: "core", text: "Live build timer", status: "QUEUED"},
  {id: "whirlwind", line: "core", text: "The whirlwind build moment", status: "BUILDING"},

  {id: "embeds", line: "share", text: "Embeds", status: "SHIPPED"},
  {id: "sitecards", line: "share", text: "Cards for sites that cannot embed", status: "SHIPPED"},
  {id: "invite", line: "share", text: "Invite link", status: "SHIPPED", also: "gallery"},
  {id: "publish", line: "share", text: "Publish to a link", status: "SHIPPED", note: "GitHub, owner only"},
  {id: "ownpage", line: "share", text: "Own page per idea", status: "SHIPPED"},
  {id: "ideamap", line: "share", text: "Idea map", status: "SHIPPED", also: "core"},

  {id: "templates", line: "gallery", text: "Template gallery", status: "SHIPPED"},
  {id: "cards", line: "gallery", text: "Index-card cards", status: "SHIPPED"},
  {id: "submit", line: "gallery", text: "Community submit", status: "SHIPPED"},
  {id: "xhandle", line: "gallery", text: "X handle", status: "SHIPPED"},

  {id: "shapes", line: "canvas", text: "Shapes and circles", status: "SHIPPED"},
  {id: "texttool", line: "canvas", text: "Text tool", status: "SHIPPED"},
  {id: "eraser", line: "canvas", text: "Eraser", status: "SHIPPED"},
  {id: "spatial", line: "canvas", text: "Spatial awareness", status: "SHIPPED"},
  {id: "editask", line: "canvas", text: "Edit the board by asking", status: "SHIPPED"},
  {id: "bare", line: "canvas", text: "Bare images", status: "QUEUED"},

  {id: "zeroadmin", line: "vision", text: "Zero admin for users", status: "SHIPPED"},
  {id: "nomodes", line: "vision", text: "No modes, no tool names", status: "BUILDING"},
  {id: "myplan", line: "vision", text: "Use my plan, not an API key", status: "IDEA", note: "needs a backend and a business decision"},
  {id: "platformkey", line: "vision", text: "Platform key with a free allowance", status: "IDEA"},
  {id: "havetos", line: "vision", text: "Have-to's picked up and relentlessly done by an agent", status: "IDEA", note: "a background agent that takes the have-to list and keeps working it until done"},
  {id: "testreal", line: "vision", text: "Tested in a real browser", status: "IDEA"}
];
var TERMINUS = {text: "One fluid creative dreamspace"};
// ===== END DATA BLOCK =====

var STATUSES = ["SHIPPED", "BUILDING", "QUEUED", "IDEA"];
var PATTERNS = [
  ["solid", "solid"], ["dashed", "dashed"], ["dotted", "dotted"], ["double", "double"], ["dashdot", "dash-dot"]
];
var NS = "http://www.w3.org/2000/svg";

// geometry
var LANE = 90;       // vertical distance between lanes
var DX = 190;        // horizontal distance between station columns
var TAG_X = 20, TAG_W = 156, TAG_H = 46;
var X0 = TAG_X + TAG_W + 100;   // x of column 0
var Y0 = 70;         // y of the first lane
var HALF = 9, IHALF = 13;       // half size of a station / interchange marker
var LABEL_WRAP = 20;
var LH = 15;         // label line height

function S(tag, attrs, text) {
  var e = document.createElementNS(NS, tag);
  if (attrs) Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
  if (text != null) e.textContent = text;
  return e;
}
function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function wrap(text, n, maxLines) {
  var words = String(text).split(/\s+/), out = [], cur = "";
  words.forEach(function (w) {
    if (cur && (cur + " " + w).length > n) { out.push(cur); cur = w; }
    else cur = cur ? cur + " " + w : w;
  });
  if (cur) out.push(cur);
  return out;
}

// ---- line pattern: a miter-joined polyline in one of five patterns ----
function patternPath(pts, pattern) {
  var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0] + " " + p[1]; }).join(" ");
  var g = S("g");
  var base = {d: d, fill: "none", stroke: "#000", "stroke-width": 4, "stroke-linejoin": "miter", "stroke-linecap": "butt", "stroke-miterlimit": 10};
  if (pattern === "dashed") base["stroke-dasharray"] = "8 6";
  else if (pattern === "dotted") base["stroke-dasharray"] = "2 5";
  else if (pattern === "dashdot") base["stroke-dasharray"] = "10 5 2 5";
  else if (pattern === "double") base["stroke-width"] = 6;   // 2 + 2 gap + 2
  g.appendChild(S("path", base));
  if (pattern === "double") {
    g.appendChild(S("path", {d: d, fill: "none", stroke: "#fff", "stroke-width": 2, "stroke-linejoin": "miter", "stroke-linecap": "butt", "stroke-miterlimit": 10}));
  }
  return g;
}

// ---- station markers, centered on 0,0 ----
function marker(status, half) {
  var g = S("g");
  var s = half * 2;
  if (status === "SHIPPED") {
    g.appendChild(S("rect", {x: -half, y: -half, width: s, height: s, fill: "#000"}));
    return g;
  }
  g.appendChild(S("rect", {x: -half, y: -half, width: s, height: s, fill: "#fff"}));
  if (status === "BUILDING") g.appendChild(S("rect", {x: -half, y: -half, width: half, height: s, fill: "#000"}));
  var o = {x: -half + 1, y: -half + 1, width: s - 2, height: s - 2, fill: "none", stroke: "#000", "stroke-width": 2};
  if (status === "IDEA") o["stroke-dasharray"] = "4 3";
  g.appendChild(S("rect", o));
  return g;
}
function interchange(half, dashed) {
  var g = S("g");
  var s = half * 2;
  var o = {x: -half + 1.5, y: -half + 1.5, width: s - 3, height: s - 3, fill: "#fff", stroke: "#000", "stroke-width": 3};
  if (dashed) o["stroke-dasharray"] = "5 3";
  g.appendChild(S("rect", o));
  return g;
}

function miniSvg(w, h) {
  return S("svg", {width: w, height: h, viewBox: "0 0 " + w + " " + h, "aria-hidden": "true"});
}
function statusIcon(status) {
  var v = miniSvg(18, 18);
  var g = marker(status, HALF);
  g.setAttribute("transform", "translate(9 9)");
  v.appendChild(g);
  return v;
}
function patternIcon(pattern, w) {
  var v = miniSvg(w, 10);
  v.appendChild(patternPath([[0, 5], [w, 5]], pattern));
  return v;
}

// ---- legend + filters ----
var activeFilters = {};
var selected = null;      // station record
var stationEls = [];      // {rec, g}
var lineEls = {};         // line id -> [elements] to dim together

(function () {
  var lg = document.getElementById("legend");
  var fl = document.getElementById("filters");
  lg.appendChild(el("span", "label", "Stations"));
  STATUSES.forEach(function (s) {
    var k = el("span", "key");
    k.appendChild(statusIcon(s));
    k.appendChild(el("span", null, s));
    lg.appendChild(k);
    var b = el("button", "tog");
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.appendChild(statusIcon(s));
    b.appendChild(el("span", null, s));
    b.onclick = function (ev) {
      ev.stopPropagation();
      activeFilters[s] = !activeFilters[s];
      b.setAttribute("aria-pressed", activeFilters[s] ? "true" : "false");
      refresh();
    };
    fl.appendChild(b);
  });
  lg.appendChild(el("span", "label", "Lines"));
  PATTERNS.forEach(function (p) {
    var k = el("span", "key");
    k.appendChild(patternIcon(p[0], 40));
    k.appendChild(el("span", null, p[1]));
    lg.appendChild(k);
  });
})();

// ---- the user's edits: overrides kept in localStorage, layered on top of the data block ----
// The data block above is never written to. Anything added there later still shows up.
var EDITS_KEY = "metro-map-edits-v1";
var MAX_NAME = 60, MAX_NOTE = 200, MAX_HIST = 50, GRID = 10;
function has(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
function emptyEdits() { return {pos: {}, text: {}, status: {}, note: {}, deleted: {}, added: []}; }
function isEmptyEdits(e) {
  return !Object.keys(e.pos).length && !Object.keys(e.text).length && !Object.keys(e.status).length &&
    !Object.keys(e.note).length && !Object.keys(e.deleted).length && !e.added.length;
}
function isObj(o) { return o && typeof o === "object" && !Array.isArray(o); }
function cleanEdits(raw) {
  var e = emptyEdits();
  if (!isObj(raw)) return e;
  if (isObj(raw.pos)) Object.keys(raw.pos).forEach(function (id) {
    var p = raw.pos[id];
    if (isObj(p) && typeof p.x === "number" && typeof p.y === "number" && isFinite(p.x) && isFinite(p.y)) e.pos[id] = {x: p.x, y: p.y};
  });
  if (isObj(raw.text)) Object.keys(raw.text).forEach(function (id) {
    if (typeof raw.text[id] === "string" && raw.text[id].trim()) e.text[id] = raw.text[id].slice(0, MAX_NAME);
  });
  if (isObj(raw.status)) Object.keys(raw.status).forEach(function (id) {
    if (STATUSES.indexOf(raw.status[id]) >= 0) e.status[id] = raw.status[id];
  });
  if (isObj(raw.note)) Object.keys(raw.note).forEach(function (id) {
    if (typeof raw.note[id] === "string") e.note[id] = raw.note[id].slice(0, MAX_NOTE);
  });
  if (isObj(raw.deleted)) Object.keys(raw.deleted).forEach(function (id) { if (raw.deleted[id]) e.deleted[id] = true; });
  if (Array.isArray(raw.added)) raw.added.forEach(function (a) {
    if (isObj(a) && typeof a.id === "string" && typeof a.line === "string" && typeof a.text === "string" && a.text.trim()) {
      e.added.push({id: a.id, line: a.line, text: a.text.slice(0, MAX_NAME),
        status: STATUSES.indexOf(a.status) >= 0 ? a.status : "IDEA"});
    }
  });
  return e;
}
function loadEdits() {
  try { return cleanEdits(JSON.parse(localStorage.getItem(EDITS_KEY))); } catch (err) { return emptyEdits(); }
}
function saveEdits() {
  try {
    if (isEmptyEdits(edits)) localStorage.removeItem(EDITS_KEY);
    else localStorage.setItem(EDITS_KEY, JSON.stringify(edits));
  } catch (err) { /* storage unavailable: edits last for this visit only */ }
}
var edits = loadEdits();

// data block + overrides, as fresh copies
function effectiveStations() {
  var out = [];
  STATIONS.concat(edits.added).forEach(function (s) {
    if (has(edits.deleted, s.id)) return;
    var c = {id: s.id, line: s.line, text: s.text, status: s.status, note: s.note, also: s.also};
    if (has(edits.text, s.id)) c.text = edits.text[s.id];
    if (has(edits.status, s.id)) c.status = edits.status[s.id];
    if (has(edits.note, s.id)) c.note = edits.note[s.id];
    out.push(c);
  });
  return out;
}

// ---- session history (undo / redo) ----
var undoStack = [], redoStack = [];
var focusId = null;       // station to focus after the next rebuild
function snapshot() { return JSON.stringify(edits); }
function commit(next) {
  undoStack.push(snapshot());
  if (undoStack.length > MAX_HIST) undoStack.shift();
  redoStack = [];
  edits = next;
  saveEdits();
  build();
}
function mutate(fn) {
  var next = cleanEdits(JSON.parse(snapshot()));
  fn(next);
  commit(next);
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  edits = cleanEdits(JSON.parse(undoStack.pop()));
  saveEdits();
  build();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  edits = cleanEdits(JSON.parse(redoStack.pop()));
  saveEdits();
  build();
}

// ---- model: resolve lines, interchanges, columns ----
function buildModel() {
  var lines = LINES.map(function (l) { return {id: l.id, name: l.name, pattern: l.pattern, items: [], visits: []}; });
  var byId = {};
  lines.forEach(function (l) { byId[l.id] = l; });
  var loose = {id: "__loose", name: "Loose", pattern: "solid", items: [], visits: [], loose: true};
  var recs = [];
  effectiveStations().forEach(function (s) {
    var okStatus = STATUSES.indexOf(s.status) >= 0;
    var ok = byId[s.line] && okStatus;
    var host = ok ? byId[s.line] : loose;
    var also = (ok && s.also && s.also !== s.line && byId[s.also]) ? byId[s.also] : null;
    var r = {src: s, host: host, also: also, status: okStatus ? s.status : "IDEA", col: 0};
    host.items.push(r);
    if (also) also.visits.push(r);
    recs.push(r);
  });
  if (loose.items.length) lines.push(loose);
  lines.forEach(function (l, i) { l.index = i; l.y = Y0 + i * LANE; });

  // columns: stations take consecutive columns, skipping columns where another
  // line's interchange sits on this lane. Repeat until stable (hosts can be visited too).
  recs.forEach(function (r) { r.col = r.host.items.indexOf(r); });
  for (var pass = 0; pass < 20; pass++) {
    var changed = false;
    lines.forEach(function (l) {
      var taken = {};
      l.visits.forEach(function (v) { taken[v.col] = true; });
      var c = 0;
      l.items.forEach(function (r) {
        while (taken[c]) c++;
        if (r.col !== c) { r.col = c; changed = true; }
        c++;
      });
    });
    if (!changed) break;
  }
  recs.forEach(function (r) {
    r.x = X0 + r.col * DX;
    r.y = r.host.y;
    r.x0 = r.x; r.y0 = r.y;       // where the data block alone would put it
    r.moved = false;
    if (has(edits.pos, r.src.id)) {
      r.x = edits.pos[r.src.id].x;
      r.y = edits.pos[r.src.id].y;
      r.moved = true;
    }
  });
  return {lines: lines, recs: recs};
}

var model = null;
var ATT = 16;            // spacing of the lines where they meet the terminus
var gLinesEl = null;

// append a point, bending with 0 / 45 / 90 degree segments only.
// A bend sits next to the end that is off its lane, so a station dragged away
// from its lane gets a straight run on the lane and a 45 degree leg to the station.
function addTo(pts, p, lane) {
  var a = pts[pts.length - 1];
  if (a) {
    var dx = p[0] - a[0], dy = p[1] - a[1], adx = Math.abs(dx), ady = Math.abs(dy);
    if (dx && dy && adx !== ady) {
      var sx = dx < 0 ? -1 : 1, sy = dy < 0 ? -1 : 1, m;
      if (a[1] !== lane && p[1] === lane) m = adx > ady ? [a[0] + sx * ady, p[1]] : [p[0], a[1] + sy * adx];
      else m = adx > ady ? [p[0] - sx * ady, a[1]] : [a[0], a[1] + sy * (ady - adx)];
      pts.push(m);
    }
  }
  pts.push(p);
}

// the line from its label through every station it serves, in order
function routeLine(l) {
  var ev = [];
  l.items.forEach(function (r) { ev.push({col: r.col, rec: r, visit: false}); });
  l.visits.forEach(function (r) { ev.push({col: r.col, rec: r, visit: true}); });
  ev.sort(function (a, b) { return a.col - b.col; });
  var pts = [[TAG_X + TAG_W, l.y]];
  ev.forEach(function (e) {
    var r = e.rec;
    if (e.visit && !r.moved) {
      // interchange on another lane: this line bends over to touch it
      var run = Math.abs(r.y - l.y);
      addTo(pts, [r.x - run, l.y], l.y);
      addTo(pts, [r.x, r.y], l.y);
      addTo(pts, [r.x + run, l.y], l.y);
    } else addTo(pts, [r.x, r.y], l.y);
  });
  l.pts = pts;
}
function finishLine(l, xB) {
  var pts = l.pts.slice();
  addTo(pts, [l.run > 0 ? xB - l.run : xB, l.y], l.y);
  pts.push([xB, l.ay]);
  return pts;
}
function drawLine(l) { return patternPath(finishLine(l, model.xB), l.pattern); }
function redrawLines() {
  model.lines.forEach(function (l) {
    routeLine(l);
    var g = drawLine(l);
    gLinesEl.replaceChild(g, lineEls[l.id][0]);
    lineEls[l.id][0] = g;
  });
  refresh();
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function bounds(r) {
  var run = Math.max(r.host.run || 0, r.also ? r.also.run || 0 : 0);
  var vb = model.vb;
  return {x0: TAG_X + TAG_W + 30, x1: Math.max(TAG_X + TAG_W + 30, model.xB - 60 - run),
    y0: vb.y + 24, y1: vb.y + vb.h - 24};
}
function svgScale() { return document.getElementById("map").getBoundingClientRect().width / model.vb.w; }
function toPx(x, y) {
  var s = svgScale();
  return {x: (x - model.vb.x) * s, y: (y - model.vb.y) * s};
}
function placeStation(rec, x, y) {
  var b = bounds(rec);
  rec.x = clamp(x, b.x0, b.x1);
  rec.y = clamp(y, b.y0, b.y1);
}
function commitMove(rec) {
  var id = rec.src.id, x = rec.x, y = rec.y;
  focusId = id;
  mutate(function (e) {
    if (x === rec.x0 && y === rec.y0) delete e.pos[id];
    else e.pos[id] = {x: x, y: y};
  });
}

function build() {
  var svg = document.getElementById("map");
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  closeEditor();
  var selId = selected ? selected.src.id : null;
  model = buildModel();
  selected = null;
  model.recs.forEach(function (r) { if (r.src.id === selId) selected = r; });
  if (menuFor && menuFor !== selected) closeMenu();
  var lines = model.lines;
  var n = lines.length;

  // terminus geometry
  var yMid = (lines[0].y + lines[n - 1].y) / 2;
  var tLines = wrap(String(TERMINUS.text).toUpperCase(), 13);
  var TW = 210;
  var TH = Math.max(140, (n - 1) * ATT + 70, tLines.length * 24 + 50);
  var tTop = yMid - TH / 2;
  var minY = Math.min(lines[0].y - TAG_H / 2, tTop - 6, lines[0].y - 60) - 14;
  var maxY = Math.max(lines[n - 1].y + 62, tTop + TH + 6) + 14;
  model.vb = {x: 0, y: minY, w: 0, h: maxY - minY};

  lines.forEach(function (l, i) {
    l.ay = yMid + (i - (n - 1) / 2) * ATT;
    l.run = Math.abs(l.ay - l.y);
  });
  // saved positions are kept inside the map
  model.recs.forEach(function (r) {
    if (r.moved) {
      r.y = clamp(r.y, model.vb.y + 24, model.vb.y + model.vb.h - 24);
      r.x = Math.max(r.x, TAG_X + TAG_W + 30);
    }
  });

  // paths
  var maxNeed = 0;
  lines.forEach(function (l) {
    routeLine(l);
    l.pts.forEach(function (p) { maxNeed = Math.max(maxNeed, p[0] + l.run); });
  });
  var xB = maxNeed + 60;
  model.xB = xB;

  var gLines = S("g"), gTags = S("g"), gSt = S("g"), gAdd = S("g");
  gLinesEl = gLines;
  lines.forEach(function (l) {
    lineEls[l.id] = [];
    var g = drawLine(l);
    gLines.appendChild(g);
    lineEls[l.id].push(g);

    // label tag at the start of the line
    var tg = S("g");
    tg.appendChild(S("rect", {x: TAG_X, y: l.y - TAG_H / 2, width: TAG_W, height: TAG_H, fill: "#fff", stroke: "#000", "stroke-width": 2}));
    var nm = wrap(l.name, 17);
    nm.slice(0, 2).forEach(function (t, i) {
      tg.appendChild(S("text", {x: TAG_X + 10, y: l.y - TAG_H / 2 + 15 + i * 14, "font-size": 13}, t));
    });
    tg.appendChild(patternPath([[TAG_X + 10, l.y + TAG_H / 2 - 8], [TAG_X + TAG_W - 10, l.y + TAG_H / 2 - 8]], l.pattern));
    gTags.appendChild(tg);
    lineEls[l.id].push(tg);

    // "+ Station" at the end of the line label
    if (!l.loose) {
      var ab = S("g", {"class": "addb", tabindex: 0, role: "button", "aria-label": "Add a station to " + l.name,
        transform: "translate(" + (TAG_X + TAG_W + 6) + " " + (l.y + 5) + ")"});
      ab.appendChild(S("rect", {x: 0, y: 0, width: 64, height: 18, fill: "#fff", stroke: "#000", "stroke-width": 1}));
      ab.appendChild(S("text", {x: 32, y: 13, "text-anchor": "middle", "font-size": 11}, "+ Station"));
      var line = l;
      ab.addEventListener("click", function (ev) { ev.stopPropagation(); addStation(line); });
      ab.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); ev.stopPropagation(); addStation(line); }
      });
      gAdd.appendChild(ab);
    }
  });

  // terminus
  var gT = S("g");
  gT.appendChild(S("rect", {x: xB - 6, y: tTop - 6, width: TW + 12, height: TH + 12, fill: "none", stroke: "#000", "stroke-width": 1}));
  gT.appendChild(S("rect", {x: xB, y: tTop, width: TW, height: TH, fill: "#fff", stroke: "#000", "stroke-width": 2}));
  tLines.forEach(function (t, i) {
    gT.appendChild(S("text", {x: xB + TW / 2, y: yMid - (tLines.length - 1) * 12 + i * 24 + 6, "text-anchor": "middle", "font-size": 17}, t));
  });

  // stations
  stationEls = [];
  model.recs.forEach(function (r) {
    var isX = !!r.also;
    var half = isX ? IHALF : HALF;
    var g = S("g", {"class": "st", tabindex: 0, role: "button", "aria-pressed": "false",
      transform: "translate(" + r.x + " " + r.y + ")",
      "aria-label": r.src.text + ", " + String(r.src.status) + (isX ? ", interchange with " + r.also.name : "") + ", on " + r.host.name});
    g.appendChild(S("rect", {"class": "ring", x: -half - 5, y: -half - 5, width: half * 2 + 10, height: half * 2 + 10}));
    g.appendChild(S("rect", {"class": "shadow", x: -half + 4, y: -half + 4, width: half * 2, height: half * 2, fill: "#000"}));
    g.appendChild(isX ? interchange(half, r.status === "IDEA") : marker(r.status, half));
    // label side: away from the line that bends over to touch an interchange,
    // otherwise alternate along the lane
    var up = r.host.items.indexOf(r) % 2 === 0;
    if (isX) up = r.also.y > r.y;
    r.up = up;
    var ls = wrap(r.src.text, LABEL_WRAP);
    var off = half + 4;
    ls.forEach(function (t, i) {
      var by = up ? -off - 3 - (ls.length - 1 - i) * LH : off + 11 + i * LH;
      g.appendChild(S("text", {"class": "halo", x: 0, y: by, "text-anchor": "middle", "font-size": 14}, t));
    });
    var rec = r;
    // "..." opens the station menu (visible on the selected station)
    var more = S("g", {"class": "more", role: "button", "aria-label": "Station menu"});
    more.appendChild(S("rect", {x: half + 8, y: -8, width: 24, height: 16, fill: "#fff", stroke: "#000", "stroke-width": 1.5}));
    more.appendChild(S("text", {x: half + 20, y: 4, "text-anchor": "middle", "font-size": 14}, "..."));
    more.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
    more.addEventListener("click", function (ev) { ev.stopPropagation(); openMenu(rec); });
    g.appendChild(more);

    g.addEventListener("pointerdown", function (ev) { dragStart(ev, rec, g); });
    g.addEventListener("pointermove", dragMove);
    g.addEventListener("pointerup", dragEnd);
    g.addEventListener("pointercancel", dragCancel);
    g.addEventListener("touchmove", function (ev) { ev.preventDefault(); }, {passive: false});
    g.addEventListener("click", function (ev) { ev.stopPropagation(); stationClick(rec); });
    g.addEventListener("keydown", function (ev) { stationKey(ev, rec); });
    gSt.appendChild(g);
    stationEls.push({rec: r, g: g});
  });

  svg.appendChild(gLines);
  svg.appendChild(gTags);
  svg.appendChild(gAdd);
  svg.appendChild(gT);
  svg.appendChild(gSt);

  // viewBox from content
  model.vb.w = xB + TW + 6 + TAG_X;
  svg.setAttribute("viewBox", model.vb.x + " " + model.vb.y + " " + model.vb.w + " " + model.vb.h);
  svg.style.minWidth = Math.max(900, Math.round(model.vb.w * 0.75)) + "px";

  buildList();
  refresh();
  updateTools();
  if (focusId) {
    stationEls.forEach(function (s) { if (s.rec.src.id === focusId) s.g.focus({preventScroll: true}); });
    focusId = null;
  }
}

// ---- list view ----
function statusTag(s) { return el("span", "tag " + (STATUSES.indexOf(s) >= 0 ? s : "IDEA"), String(s)); }

function buildList() {
  var box = document.getElementById("lists");
  while (box.firstChild) box.removeChild(box.firstChild);
  model.lines.forEach(function (l) {
    var b = el("section", "block");
    var h = el("h3");
    h.appendChild(patternIcon(l.pattern, 44));
    h.appendChild(el("span", null, l.name));
    b.appendChild(h);
    var ul = el("ul");
    var rows = l.items.concat(l.visits);
    rows.sort(function (a, c) { return (l.items.indexOf(a) >= 0 ? a.col : a.col) - c.col; });
    rows.forEach(function (r) {
      var li = el("li");
      li.appendChild(el("span", null, r.src.text));
      li.appendChild(statusTag(r.src.status));
      var other = r.host === l ? r.also : r.host;
      if (other && (r.also)) li.appendChild(el("span", "nt", "interchange with " + other.name));
      if (r.src.note) li.appendChild(el("span", "nt", r.src.note));
      ul.appendChild(li);
    });
    b.appendChild(ul);
    box.appendChild(b);
  });
  document.getElementById("endnote").textContent = "Every line ends at: " + String(TERMINUS.text).toUpperCase();
}

// ---- interaction ----
function anyFilter() { return STATUSES.some(function (s) { return activeFilters[s]; }); }

function toggle(rec) {
  closeMenu();
  selected = selected === rec ? null : rec;
  refresh();
}

function refresh() {
  var hl = null;
  if (selected) {
    hl = {};
    hl[selected.host.id] = true;
    if (selected.also) hl[selected.also.id] = true;
  }
  Object.keys(lineEls).forEach(function (id) {
    lineEls[id].forEach(function (e) {
      e.setAttribute("class", hl && !hl[id] ? "dim" : "");
    });
  });
  var f = anyFilter();
  stationEls.forEach(function (s) {
    var r = s.rec;
    var onLine = !hl || hl[r.host.id] || (r.also && hl[r.also.id]);
    var match = !f || activeFilters[r.src.status];
    var cls = "st" + (!onLine || !match ? " dim" : "") + (r === selected ? " sel" : "") +
      (drag && drag.moving && drag.rec === r ? " drag" : "");
    s.g.setAttribute("class", cls);
    s.g.setAttribute("aria-pressed", r === selected ? "true" : "false");
  });
  showCard();
}

function showCard() {
  var card = document.getElementById("card");
  while (card.firstChild) card.removeChild(card.firstChild);
  if (!selected || menuFor || (drag && drag.moving)) { card.hidden = true; return; }
  var r = selected;
  card.appendChild(el("div", "ct", r.src.text));
  card.appendChild(statusTag(r.src.status));
  if (r.src.note) card.appendChild(el("div", "cn", r.src.note));
  card.appendChild(el("div", "cl", r.also ? "Interchange: " + r.host.name + " and " + r.also.name : "Line: " + r.host.name));
  card.hidden = false;
  var svg = document.getElementById("map");
  var scale = svg.getBoundingClientRect().width / model.vb.w;
  var wrapW = svg.getBoundingClientRect().width;
  var left = (r.x - model.vb.x) * scale - 115;
  var top = (r.y - model.vb.y) * scale + (r.up ? 24 : 24) * 1.0;
  if (!r.up) top = (r.y - model.vb.y) * scale - card.offsetHeight - 24;
  if (top < 4) top = (r.y - model.vb.y) * scale + 24;
  left = Math.max(4, Math.min(left, wrapW - 234));
  card.style.left = left + "px";
  card.style.top = top + "px";
}

// ---- dragging a station (mouse, touch, pen) ----
var drag = null;
var suppressUntil = 0;     // a drag ends with a click; swallow it
function snap(v) { return Math.round(v / GRID) * GRID; }

function dragStart(ev, rec, g) {
  if (ev.button > 0) return;
  drag = {rec: rec, g: g, pid: ev.pointerId, sx: ev.clientX, sy: ev.clientY, ox: rec.x, oy: rec.y, moving: false};
  try { g.setPointerCapture(ev.pointerId); } catch (err) { /* not capturable: window events still arrive */ }
}
function dragMove(ev) {
  if (!drag || ev.pointerId !== drag.pid) return;
  var dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
  if (!drag.moving) {
    if (Math.abs(dx) < 4 && Math.abs(dy) < 4) return;     // still a tap
    drag.moving = true;
    closeMenu();
    closeEditor();
  }
  var s = svgScale();
  var rec = drag.rec;
  placeStation(rec, snap(drag.ox + dx / s), snap(drag.oy + dy / s));
  rec.moved = true;
  drag.g.setAttribute("transform", "translate(" + rec.x + " " + rec.y + ")");
  redrawLines();
}
function dragEnd(ev) {
  if (!drag || ev.pointerId !== drag.pid) return;
  var d = drag;
  drag = null;
  try { d.g.releasePointerCapture(ev.pointerId); } catch (err) { /* already released */ }
  if (!d.moving) return;                   // a tap: the click handler does the highlight
  suppressUntil = Date.now() + 400;
  if (d.rec.x === d.ox && d.rec.y === d.oy) { build(); return; }
  commitMove(d.rec);
}
function dragCancel(ev) {
  if (!drag || ev.pointerId !== drag.pid) return;
  drag = null;
  build();
}
document.addEventListener("click", function (ev) {
  if (Date.now() < suppressUntil) { ev.stopPropagation(); ev.preventDefault(); }
}, true);

// ---- clicks and keys on a station ----
var lastTap = {id: null, t: 0};
function stationClick(rec) {
  var now = Date.now(), id = rec.src.id;
  if (lastTap.id === id && now - lastTap.t < 400) {      // double click / double tap
    lastTap = {id: null, t: 0};
    closeMenu();
    selected = rec;
    refresh();
    editName(rec);
    return;
  }
  lastTap = {id: id, t: now};
  toggle(rec);
}

function stationKey(ev, rec) {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var k = ev.key, dx = 0, dy = 0;
  if (k === "ArrowLeft") dx = -1;
  else if (k === "ArrowRight") dx = 1;
  else if (k === "ArrowUp") dy = -1;
  else if (k === "ArrowDown") dy = 1;
  if (dx || dy) {
    ev.preventDefault(); ev.stopPropagation();
    var ox = rec.x, oy = rec.y;
    var x = dx > 0 ? Math.floor(rec.x / GRID) * GRID + GRID : dx < 0 ? Math.ceil(rec.x / GRID) * GRID - GRID : rec.x;
    var y = dy > 0 ? Math.floor(rec.y / GRID) * GRID + GRID : dy < 0 ? Math.ceil(rec.y / GRID) * GRID - GRID : rec.y;
    placeStation(rec, x, y);
    if (rec.x === ox && rec.y === oy) return;
    rec.moved = true;
    commitMove(rec);
  } else if (k === "Enter") {
    ev.preventDefault(); ev.stopPropagation();
    selected = rec; refresh();
    editName(rec);
  } else if (k === " ") {
    ev.preventDefault(); ev.stopPropagation();
    toggle(rec);
  } else if (k === "Delete") {
    ev.preventDefault(); ev.stopPropagation();
    removeStation(rec);
  } else if (k === "ContextMenu" || k === "m" || k === "M" || (k === "F10" && ev.shiftKey)) {
    ev.preventDefault(); ev.stopPropagation();
    selected = rec; refresh();
    openMenu(rec);
  }
}

// ---- inline text entry (names, notes, new stations) ----
var editor = null;
function closeEditor() {
  if (!editor) return;
  var inp = editor.inp;
  editor.done = true;
  editor = null;
  if (inp.parentNode) inp.parentNode.removeChild(inp);
}
function focusStation(id) {
  stationEls.forEach(function (s) { if (s.rec.src.id === id) s.g.focus({preventScroll: true}); });
}
// x,y: map position to anchor on; dy: pixel offset below it
function openEditor(x, y, dy, initial, max, label, onSave, returnId) {
  closeEditor();
  var inp = el("input", "ed");
  inp.type = "text";
  inp.maxLength = max;
  inp.value = initial;
  inp.setAttribute("aria-label", label);
  inp.placeholder = label;
  var p = toPx(x, y);
  var wrapW = document.getElementById("map").getBoundingClientRect().width;
  inp.style.left = clamp(p.x - 110, 4, Math.max(4, wrapW - 230)) + "px";
  inp.style.top = Math.max(2, p.y + dy) + "px";
  var ed = {inp: inp, done: false};
  function finish(save, refocus) {
    if (ed.done) return;
    closeEditor();
    var v = inp.value.replace(/\s+/g, " ").trim().slice(0, max);
    if (save && v !== initial) onSave(v);
    if (refocus && returnId) focusStation(returnId);
  }
  inp.addEventListener("keydown", function (ev) {
    ev.stopPropagation();
    if (ev.key === "Enter") { ev.preventDefault(); finish(true, true); }
    else if (ev.key === "Escape") { ev.preventDefault(); finish(false, true); }
  });
  inp.addEventListener("blur", function () { finish(true, false); });
  inp.addEventListener("click", function (ev) { ev.stopPropagation(); });
  inp.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
  editor = ed;
  document.getElementById("wrap").appendChild(inp);
  inp.focus();
  inp.select();
}

function editName(rec) {
  var id = rec.src.id;
  openEditor(rec.x, rec.y, rec.up ? -52 : 20, rec.src.text, MAX_NAME, "Station name", function (v) {
    if (!v) return;
    focusId = id;
    mutate(function (e) { e.text[id] = v; });
  }, id);
}
function editNote(rec) {
  var id = rec.src.id;
  openEditor(rec.x, rec.y, rec.up ? -52 : 20, rec.src.note || "", MAX_NOTE, "Note", function (v) {
    focusId = id;
    mutate(function (e) { e.note[id] = v; });
  }, id);
}
function addStation(l) {
  closeMenu();
  openEditor(TAG_X + TAG_W + 38, l.y, 28, "", MAX_NAME, "New station name", function (v) {
    if (!v) return;
    var id = "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    focusId = id;
    mutate(function (e) { e.added.push({id: id, line: l.id, text: v, status: "IDEA"}); });
  }, null);
}

function removeStation(rec) {
  var id = rec.src.id, name = rec.src.text;
  closeMenu();
  if (selected === rec) selected = null;
  mutate(function (e) {
    var at = -1;
    e.added.forEach(function (a, i) { if (a.id === id) at = i; });
    if (at >= 0) e.added.splice(at, 1);
    else e.deleted[id] = true;
    delete e.pos[id]; delete e.text[id]; delete e.status[id]; delete e.note[id];
  });
  showToast("Deleted " + name, undoStack.length);
}

// ---- the "..." menu ----
var menuFor = null;
function closeMenu() {
  menuFor = null;
  document.getElementById("menu").hidden = true;
}
function openMenu(rec) {
  var m = document.getElementById("menu");
  while (m.firstChild) m.removeChild(m.firstChild);
  menuFor = rec;
  var id = rec.src.id;
  m.appendChild(el("div", "mh", "Status"));
  STATUSES.forEach(function (s) {
    var b = el("button", "mi", s);
    b.type = "button";
    b.setAttribute("aria-pressed", rec.status === s ? "true" : "false");
    b.onclick = function (ev) {
      ev.stopPropagation();
      closeMenu();
      if (rec.src.status === s) { refresh(); return; }
      focusId = id;
      mutate(function (e) { e.status[id] = s; });
    };
    m.appendChild(b);
  });
  var nb = el("button", "mi", "Edit note");
  nb.type = "button";
  nb.onclick = function (ev) { ev.stopPropagation(); closeMenu(); refresh(); editNote(rec); };
  m.appendChild(nb);
  var db = el("button", "mi", "Delete station");
  db.type = "button";
  db.onclick = function (ev) { ev.stopPropagation(); removeStation(rec); };
  m.appendChild(db);
  m.hidden = false;
  var p = toPx(rec.x, rec.y);
  var wrapW = document.getElementById("map").getBoundingClientRect().width;
  m.style.left = clamp(p.x + 40, 4, Math.max(4, wrapW - 200)) + "px";
  m.style.top = Math.max(4, p.y - 20) + "px";
  refresh();
  var first = m.querySelector("button[aria-pressed=true]") || m.querySelector("button");
  if (first) first.focus({preventScroll: true});
}

// ---- undo toast ----
var toastTimer = null;
function hideToast() {
  clearTimeout(toastTimer);
  document.getElementById("toast").hidden = true;
}
function showToast(msg, depth) {
  var t = document.getElementById("toast");
  while (t.firstChild) t.removeChild(t.firstChild);
  t.appendChild(el("span", null, msg));
  var b = el("button", "tog", "Undo");
  b.type = "button";
  b.onclick = function (ev) {
    ev.stopPropagation();
    if (undoStack.length === depth) undo();
    hideToast();
  };
  t.appendChild(b);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}

// ---- undo / redo buttons and "Reset my edits" ----
var btnUndo = null, btnRedo = null;
(function () {
  var tools = document.getElementById("tools");
  btnUndo = el("button", "tog", "Undo");
  btnRedo = el("button", "tog", "Redo");
  btnUndo.type = btnRedo.type = "button";
  btnUndo.onclick = function (ev) { ev.stopPropagation(); undo(); };
  btnRedo.onclick = function (ev) { ev.stopPropagation(); redo(); };
  tools.appendChild(btnUndo);
  tools.appendChild(btnRedo);
})();
function updateTools() {
  btnUndo.disabled = !undoStack.length;
  btnRedo.disabled = !redoStack.length;
}

function renderReset(confirming) {
  var box = document.getElementById("resetbox");
  while (box.firstChild) box.removeChild(box.firstChild);
  if (!confirming) {
    var b = el("button", "quiet", "Reset my edits");
    b.type = "button";
    b.onclick = function (ev) { ev.stopPropagation(); renderReset(true); };
    box.appendChild(b);
    return;
  }
  box.appendChild(el("span", "label", "Clear all your edits and go back to the original map?"));
  var yes = el("button", "quiet", "Yes, reset");
  var no = el("button", "quiet", "Keep my edits");
  yes.type = no.type = "button";
  yes.onclick = function (ev) {
    ev.stopPropagation();
    renderReset(false);
    hideToast();
    if (!isEmptyEdits(edits)) commit(emptyEdits());
  };
  no.onclick = function (ev) { ev.stopPropagation(); renderReset(false); };
  box.appendChild(yes);
  box.appendChild(no);
}

document.addEventListener("click", function () {
  if (selected || menuFor) { closeMenu(); selected = null; refresh(); }
});
document.getElementById("card").addEventListener("click", function (ev) { ev.stopPropagation(); });
document.getElementById("menu").addEventListener("click", function (ev) { ev.stopPropagation(); });
document.addEventListener("keydown", function (ev) {
  var t = ev.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  var k = String(ev.key).toLowerCase();
  if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && (k === "z" || k === "y")) {
    ev.preventDefault();
    if (k === "y" || ev.shiftKey) redo(); else undo();
    return;
  }
  if (k === "escape") {
    if (menuFor) {
      var id = menuFor.src.id;
      closeMenu();
      refresh();
      focusStation(id);
    } else if (selected) { selected = null; refresh(); }
  }
});
window.addEventListener("resize", function () { if (selected) showCard(); });

renderReset(false);
build();
</script>
</body>
</html>
