<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --note: #bfd7ff;
    --serif: "Special Elite", "Courier New", monospace;
    --mono: "Special Elite", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { background: var(--paper); color: var(--ink); font: 400 17px/1.45 var(--serif); font-synthesis: none; min-height: 100vh; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  .app { max-width: 1140px; margin: 0 auto; padding: 20px 12px 56px; }
  .prompt { text-align: center; margin: 10px 0 12px; font-size: clamp(26px, 6vw, 38px); }

  .board { position: relative; width: 100%; max-width: 1100px; margin: 0 auto; aspect-ratio: 16 / 10; touch-action: manipulation; cursor: crosshair; }
  svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  svg.rings circle { fill: none; stroke: var(--ink); stroke-width: .4; stroke-dasharray: 1; stroke-dashoffset: 1;
    transform-origin: center; transform-box: fill-box; transform: rotate(-90deg); animation: draw 1.6s cubic-bezier(.5,0,.2,1) forwards; }
  svg.rings circle:nth-child(2) { animation-delay: .7s; }
  svg.rings circle:nth-child(3) { animation-delay: 1.4s; }
  /* Final keyframe drops the dash pattern so the closed loop has no seam at its start/end point. */
  @keyframes draw { 0% { stroke-dasharray: 1; stroke-dashoffset: 1; } 99.9% { stroke-dasharray: 1; stroke-dashoffset: 0; } 100% { stroke-dasharray: none; stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { svg.rings circle { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; } }

  /* Labels sit just above each circle's top edge, outside the outline. Keep the circle
     positions here in step with the SVG circles and the CIRCLES table below.
     SVG viewBox is 160x100 (16:10): left% = cx/160, top% = cy - r. */
  .label { position: absolute; min-height: 44px; min-width: 44px; padding: 0 10px; font-size: clamp(14px, 2.4vw, 26px); letter-spacing: 0; white-space: nowrap; z-index: 3; transform: translate(-50%, -100%); }
  .label:hover { text-decoration: underline; text-underline-offset: 4px; }
  .label.dream { left: 50%; top: 22%; }
  .label.have { left: 17%; top: 28.5%; }
  .label.want { left: 83%; top: 28.5%; }

  .sticky { position: absolute; width: clamp(76px, 15%, 150px); aspect-ratio: 1 / 1; box-sizing: border-box; padding: 6px 8px; background: var(--note); border: 1px solid var(--ink);
    transform: translate(-50%, -50%); display: flex; flex-direction: column; justify-content: space-between; gap: 4px; z-index: 2;
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; font-size: 15px; line-height: 1.2; }
  .sticky.dragging { cursor: grabbing; z-index: 10; }
  .sticky .txt { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; padding-right: 14px; }
  .sticky .x { position: absolute; top: -10px; right: -10px; width: 32px; height: 32px; border-radius: 50%; background: var(--paper); border: 1px solid var(--ink);
    font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .sticky input { width: 100%; min-height: 44px; border: 0; background: transparent; font-size: 16px; padding: 0; border-radius: 0; box-shadow: none; }
  @media (max-width: 600px) { .sticky { font-size: 13px; padding: 4px 6px; } }
  .sticky input:focus, .sticky input:focus-visible { outline: 0; box-shadow: none; }
</style>
</head>
<body>
<div class="app">
  <p class="prompt">What’s on your mind?</p>

  <div class="board" id="board">
    <svg class="rings" viewBox="0 0 160 100" aria-hidden="true">
      <circle cx="80" cy="47.3" r="24.8" pathLength="1"/>
      <circle cx="27.2" cy="54" r="24.8" pathLength="1"/>
      <circle cx="132.8" cy="54" r="24.8" pathLength="1"/>
    </svg>
    <button class="label dream" data-add="dream" type="button">Dream</button>
    <button class="label have" data-add="have" type="button">Have to do</button>
    <button class="label want" data-add="want" type="button">Want to do</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* cx and r are fractions of the board width; cy is a fraction of its height (16:10).
     Same circles as the SVG: cx*160, cy*100, r*160. */
  var ASPECT = 1.6;
  var CIRCLES = {
    dream: { name: 'Dream',      cx: 0.50, cy: 0.473, r: 0.155 },
    have:  { name: 'Have to do', cx: 0.17, cy: 0.54,  r: 0.155 },
    want:  { name: 'Want to do', cx: 0.83, cy: 0.54,  r: 0.155 }
  };

  var board = document.getElementById('board');
  var notes = [], nextId = 1;

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---------- geometry ---------- */
  function circleAt(fx, fy) {
    var found = null;
    Object.keys(CIRCLES).forEach(function (k) {
      var c = CIRCLES[k];
      if (Math.hypot(fx - c.cx, (fy - c.cy) / ASPECT) <= c.r) found = k;
    });
    return found;
  }
  function clampPos(fx, fy) {
    var W = board.clientWidth || 300, H = W / ASPECT, sw = clamp(0.15 * W, 76, 150);
    return { x: clamp(fx, sw / 2 / W, 1 - sw / 2 / W), y: clamp(fy, sw / 2 / H, 1 - sw / 2 / H) };
  }
  function anchor(circle, i) {
    var c = CIRCLES[circle], a = (i || 0) * 2.4;
    return clampPos(c.cx + Math.cos(a) * 0.03, c.cy + 0.05 + Math.sin(a) * 0.06);
  }

  /* ---------- notes ---------- */
  function addNote(text, circle, pos) {
    var n = { id: nextId++, text: text, circle: circle, x: pos.x, y: pos.y };
    var s = h('div', { 'class': 'sticky', 'aria-label': text + ', ' + CIRCLES[circle].name }, [
      h('span', { 'class': 'txt', text: text }),
      h('button', { 'class': 'x', type: 'button', 'aria-label': 'Delete note: ' + text, text: '×' })
    ]);
    var x = s.querySelector('.x');
    x.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    x.addEventListener('click', function (e) {
      e.stopPropagation();
      s.remove();
      notes.splice(notes.indexOf(n), 1);
    });
    s.style.left = n.x * 100 + '%'; s.style.top = n.y * 100 + '%';
    attachDrag(s, n);
    notes.push(n);
    board.appendChild(s);
    return n;
  }

  /* ---------- dragging ---------- */
  function attachDrag(s, n) {
    var start = null;
    s.addEventListener('click', function (e) { e.stopPropagation(); });
    s.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button > 0) return;
      e.stopPropagation();
      start = { px: e.clientX, py: e.clientY, ox: n.x, oy: n.y, r: board.getBoundingClientRect(), moved: false, id: e.pointerId };
      s.setPointerCapture(e.pointerId);
    });
    s.addEventListener('pointermove', function (e) {
      if (!start || e.pointerId !== start.id) return;
      var dx = e.clientX - start.px, dy = e.clientY - start.py;
      if (!start.moved && Math.hypot(dx, dy) < 6) return;
      start.moved = true;
      s.classList.add('dragging');
      var p = clampPos(start.ox + dx / start.r.width, start.oy + dy / start.r.height);
      n.x = p.x; n.y = p.y;
      s.style.left = n.x * 100 + '%'; s.style.top = n.y * 100 + '%';
    });
    function end(e, cancelled) {
      if (!start || e.pointerId !== start.id) return;
      var st = start; start = null;
      s.classList.remove('dragging');
      if (!st.moved) return;
      var target = cancelled ? null : circleAt(n.x, n.y);
      if (!target) { n.x = st.ox; n.y = st.oy; }
      else n.circle = target;
      s.style.left = n.x * 100 + '%'; s.style.top = n.y * 100 + '%';
      s.setAttribute('aria-label', n.text + ', ' + CIRCLES[n.circle].name);
    }
    s.addEventListener('pointerup', function (e) { end(e, false); });
    s.addEventListener('pointercancel', function (e) { end(e, true); });
  }

  /* ---------- adding: a blue note appears in place, type, Enter ---------- */
  function compose(circle, pos) {
    var done = false;
    var inp = h('input', { type: 'text', maxlength: '80', autocomplete: 'off', 'aria-label': 'New note in ' + CIRCLES[circle].name });
    var s = h('div', { 'class': 'sticky' }, [inp]);
    s.style.left = pos.x * 100 + '%'; s.style.top = pos.y * 100 + '%';
    s.addEventListener('click', function (e) { e.stopPropagation(); });
    s.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    s.style.cursor = 'text';
    function finish(commit) {
      if (done) return; done = true;
      var v = inp.value.trim();
      s.remove();
      if (commit && v) addNote(v, circle, pos);
    }
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') finish(true);
      else if (e.key === 'Escape') finish(false);
    });
    inp.addEventListener('blur', function () { finish(true); });
    board.appendChild(s);
    inp.focus();
  }

  board.addEventListener('click', function (e) {
    var r = board.getBoundingClientRect();
    var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    var c = circleAt(fx, fy);
    if (c) compose(c, clampPos(fx, fy));
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-add]'), function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); var c = b.dataset.add; compose(c, anchor(c, notes.length)); });
  });
})();
</script>
</body>
</html>
