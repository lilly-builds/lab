<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dream board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Newsreader:opsz,wght@6..72,300;6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --note: #bfd7ff;
    --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
    --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { background: var(--paper); color: var(--ink); font: 300 17px/1.45 var(--serif); min-height: 100vh; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  .app { max-width: 760px; margin: 0 auto; padding: 20px 12px 56px; }
  .prompt { text-align: center; font-style: italic; margin: 10px 0 12px; font-size: clamp(26px, 6vw, 38px); }

  .board { position: relative; width: 100%; max-width: 720px; margin: 0 auto; aspect-ratio: 1 / 1; touch-action: manipulation; cursor: crosshair; }
  svg.rings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  svg.rings circle { fill: none; stroke: var(--ink); stroke-width: .35; stroke-dasharray: 1; stroke-dashoffset: 1;
    transform-origin: center; transform-box: fill-box; transform: rotate(-90deg); animation: draw 1.6s cubic-bezier(.5,0,.2,1) forwards; }
  svg.rings circle:nth-child(2) { animation-delay: .7s; }
  svg.rings circle:nth-child(3) { animation-delay: 1.4s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { svg.rings circle { animation: none; stroke-dashoffset: 0; } }

  /* Labels are centred well inside each circle (0.13 of the board below the
     circle's top-centre region), so the outline never reaches the text. */
  .label { position: absolute; min-height: 44px; min-width: 44px; padding: 0 10px; font-size: clamp(16px, 3.4vw, 26px); letter-spacing: -.01em; white-space: nowrap; z-index: 3; transform: translate(-50%, -50%); }
  .label:hover { text-decoration: underline; text-underline-offset: 4px; }
  .label.dream { left: 50%; top: 14%; }
  .label.have { left: 25%; top: 60%; }
  .label.want { left: 75%; top: 60%; }

  .sticky { position: absolute; width: clamp(92px, 24%, 150px); min-height: 64px; padding: 6px 8px; background: var(--note); border: 1px solid var(--ink);
    transform: translate(-50%, -50%); display: flex; flex-direction: column; justify-content: space-between; gap: 4px; z-index: 2;
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; font-size: 15px; line-height: 1.2; }
  .sticky.dragging { cursor: grabbing; z-index: 10; }
  .sticky .txt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; padding-right: 14px; }
  .sticky .x { position: absolute; top: -10px; right: -10px; width: 32px; height: 32px; border-radius: 50%; background: var(--paper); border: 1px solid var(--ink);
    font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .sticky input { width: 100%; min-height: 44px; border: 0; border-bottom: 1px solid var(--ink); background: transparent; font-size: 16px; padding: 0; border-radius: 0; }
  .sticky input:focus-visible { outline: 0; }
</style>
</head>
<body>
<div class="app">
  <p class="prompt">What’s on your mind?</p>

  <div class="board" id="board">
    <svg class="rings" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="27" r="25" pathLength="1"/>
      <circle cx="25" cy="73" r="25" pathLength="1"/>
      <circle cx="75" cy="73" r="25" pathLength="1"/>
    </svg>
    <button class="label dream" data-add="dream" type="button">Dream</button>
    <button class="label have" data-add="have" type="button">Have to do</button>
    <button class="label want" data-add="want" type="button">Want to do</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var CIRCLES = {
    dream: { name: 'Dream',      cx: 0.50, cy: 0.27, r: 0.25 },
    have:  { name: 'Have to do', cx: 0.25, cy: 0.73, r: 0.25 },
    want:  { name: 'Want to do', cx: 0.75, cy: 0.73, r: 0.25 }
  };

  var board = document.getElementById('board');
  var notes = [], nextId = 1;

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) e.appendChild(c); });
    return e;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---------- geometry ---------- */
  function circleAt(fx, fy) {
    var found = null;
    Object.keys(CIRCLES).forEach(function (k) {
      var c = CIRCLES[k];
      if (Math.hypot(fx - c.cx, fy - c.cy) <= c.r) found = k;
    });
    return found;
  }
  function clampPos(fx, fy) {
    var W = board.clientWidth || 300, sw = clamp(0.24 * W, 92, 150);
    return { x: clamp(fx, sw / 2 / W, 1 - sw / 2 / W), y: clamp(fy, 40 / W, 1 - 40 / W) };
  }
  function anchor(circle, i) {
    var c = CIRCLES[circle], a = (i || 0) * 2.4;
    return clampPos(c.cx + Math.cos(a) * 0.05, c.cy + 0.06 + Math.sin(a) * 0.05);
  }

  /* ---------- notes ---------- */
  function addNote(text, circle, pos) {
    var n = { id: nextId++, text: text, circle: circle, x: pos.x, y: pos.y };
    var s = h('div', { 'class': 'sticky', 'aria-label': text + ', ' + CIRCLES[circle].name }, [
      h('span', { 'class': 'txt', text: text }),
      h('button', { 'class': 'x', type: 'button', 'aria-label': 'Delete note: ' + text, text: '×' })
    ]);
    var x = s.querySelector('.x');
    x.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    x.addEventListener('click', function (e) {
      e.stopPropagation();
      s.remove();
      notes.splice(notes.indexOf(n), 1);
    });
    s.style.left = n.x * 100 + '%'; s.style.top = n.y * 100 + '%';
    attachDrag(s, n);
    notes.push(n);
    board.appendChild(s);
    return n;
  }

  /* ---------- dragging ---------- */
  function attachDrag(s, n) {
    var start = null;
    s.addEventListener('click', function (e) { e.stopPropagation(); });
    s.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button > 0) return;
      e.stopPropagation();
      start = { px: e.clientX, py: e.clientY, ox: n.x, oy: n.y, r: board.getBoundingClientRect(), moved: false, id: e.pointerId };
      s.setPointerCapture(e.pointerId);
    });
    s.addEventListener('pointermove', function (e) {
      if (!start || e.pointerId !== start.id) return;
      var dx = e.clientX - start.px, dy = e.clientY - start.py;
      if (!start.moved && Math.hypot(dx, dy) < 6) return;
      start.moved = true;
      s.classList.add('dragging');
      var p = clampPos(start.ox + dx / start.r.width, start.oy + dy / start.r.height);
      n.x = p.x; n.y = p.y;
      s.style.left = n.x * 100 + '%'; s.style.top = n.y * 100 + '%';
    });
    function end(e, cancelled) {
      if (!start || e.pointerId !== start.id) return;
      var st = start; start = null;
      s.classList.remove('dragging');
      if (!st.moved) return;
      var target = cancelled ? null : circleAt(n.x, n.y);
      if (!target) { n.x = st.ox; n.y = st.oy; }
      else n.circle = target;
      s.style.left = n.x * 100 + '%'; s.style.top = n.y * 100 + '%';
      s.setAttribute('aria-label', n.text + ', ' + CIRCLES[n.circle].name);
    }
    s.addEventListener('pointerup', function (e) { end(e, false); });
    s.addEventListener('pointercancel', function (e) { end(e, true); });
  }

  /* ---------- adding: a blue note appears in place, type, Enter ---------- */
  function compose(circle, pos) {
    var done = false;
    var inp = h('input', { type: 'text', maxlength: '80', autocomplete: 'off', 'aria-label': 'New note in ' + CIRCLES[circle].name });
    var s = h('div', { 'class': 'sticky' }, [inp]);
    s.style.left = pos.x * 100 + '%'; s.style.top = pos.y * 100 + '%';
    s.addEventListener('click', function (e) { e.stopPropagation(); });
    s.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    s.style.cursor = 'text';
    function finish(commit) {
      if (done) return; done = true;
      var v = inp.value.trim();
      s.remove();
      if (commit && v) addNote(v, circle, pos);
    }
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') finish(true);
      else if (e.key === 'Escape') finish(false);
    });
    inp.addEventListener('blur', function () { finish(true); });
    board.appendChild(s);
    inp.focus();
  }

  board.addEventListener('click', function (e) {
    var r = board.getBoundingClientRect();
    var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    var c = circleAt(fx, fy);
    if (c) compose(c, clampPos(fx, fy));
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-add]'), function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); var c = b.dataset.add; compose(c, anchor(c, notes.length)); });
  });
})();
</script>
</body>
</html>
