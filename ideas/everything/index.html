<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everything, everywhere, all at once.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --ink: #000; --paper: #fff; --f: "Special Elite", "Courier New", monospace; }
  * { box-sizing: border-box; border-radius: 0; box-shadow: none; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
  body { color: var(--ink); font: 400 16px/1.4 var(--f); font-synthesis: none; }
  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }

  canvas#board { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
  canvas#board.pen { cursor: crosshair; }
  canvas#board.txt { cursor: text; }
  canvas#board.erase { cursor: none; }
  #eraseCur { position: fixed; left: 0; top: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; border: 1px solid var(--ink); border-radius: 50% !important; pointer-events: none; z-index: 6; display: none; }

  textarea#noteEdit { position: fixed; transform-origin: 0 0; display: none; margin: 0; padding: 8px; resize: none; overflow: hidden; border: 1px solid var(--ink);
    background: var(--paper); font: 400 16px/20px var(--f); outline: 0; z-index: 5; }
  textarea#textEdit { position: fixed; transform-origin: 0 0; display: none; margin: 0; padding: 0; resize: none; overflow: hidden; border: 0; background: transparent;
    font: 400 24px/31px var(--f); outline: 1px solid var(--ink); outline-offset: 4px; z-index: 5; }

  #top { position: fixed; left: 0; right: 0; top: 0; z-index: 8; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left)); pointer-events: none; }
  #top h1 { margin: 0; font: 400 15px/1.3 var(--f); background: var(--paper); padding: 2px 4px 2px 0; }
  #modes { display: flex; flex: none; pointer-events: auto; background: var(--paper); border: 1px solid var(--ink); }
  #modes button { width: 32px; height: 32px; font: 400 12px/1 var(--f); }
  #modes button + button { border-left: 1px solid var(--ink); }
  #modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  #dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left)); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 10; }
  #dock > * { pointer-events: auto; }
  #index { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; width: 100%; max-width: 560px; }
  #index button { min-height: 36px; padding: 0 10px; border: 1px solid var(--ink); background: var(--paper); font: 400 12px/1.1 var(--f); }
  #index button[aria-current="true"] { background: var(--ink); color: var(--paper); }
  body[data-mode="A"] #index button[aria-current="true"]::before { content: "now "; font-size: 10px; opacity: .75; }
  #bar { display: flex; justify-content: center; background: var(--paper); max-width: 100%; }
  #bar button { width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #bar button svg, #shapeFly button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  #bar button[aria-pressed="true"], #shapeFly button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #bar button:disabled { opacity: .3; cursor: default; }
  #shapeFly { position: fixed; z-index: 11; display: flex; background: var(--paper); border: 1px solid var(--ink); max-width: calc(100vw - 8px); }
  #shapeFly button { width: 44px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; }

  #zoom { position: fixed; right: calc(10px + env(safe-area-inset-right)); top: 52px; z-index: 9; display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--ink); }
  #zoom button { width: 32px; height: 32px; font: 400 14px/1 var(--f); display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
  #zoom button + button { border-top: 1px solid var(--ink); }
  #zoom button:disabled { opacity: .3; cursor: default; }
  @media (pointer: coarse) { #zoom { display: none; } }
</style>
</head>
<body data-mode="A">
<canvas id="board"></canvas>
<div id="eraseCur" aria-hidden="true"></div>
<textarea id="noteEdit" aria-label="Note" maxlength="400"></textarea>
<textarea id="textEdit" aria-label="Text" maxlength="2000" rows="1" spellcheck="false" autocorrect="off" wrap="soft"></textarea>

<div id="top">
  <h1>Everything, everywhere, all at once.</h1>
  <div id="modes" role="group" aria-label="Focus">
    <button type="button" data-mode="A" aria-label="Now bar" title="Now bar" aria-pressed="true">A</button>
    <button type="button" data-mode="B" aria-label="Solo" title="Solo" aria-pressed="false">B</button>
    <button type="button" data-mode="C" aria-label="Dim" title="Dim" aria-pressed="false">C</button>
  </div>
</div>
<div id="zoom" role="group" aria-label="Zoom"><button type="button" id="zIn" aria-label="Zoom in">+</button><button type="button" id="zOut" aria-label="Zoom out">-</button></div>

<div id="dock">
  <nav id="index" aria-label="Areas"></nav>
  <div id="bar" role="toolbar" aria-label="Tools">
    <button type="button" data-tool="move" aria-label="Select and move" title="Select and move" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg></button>
    <button type="button" data-tool="pen" aria-label="Pen" title="Pen" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 0a2 2 0 0 1 0 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg></button>
    <button type="button" data-tool="note" aria-label="Note" title="Note" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15"/><path d="M8 9.5h8M8 13h5"/></svg></button>
    <button type="button" data-tool="text" aria-label="Text" title="Text" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15"/><path d="M8.5 9.5V8h7v1.5M12 8v8M10.5 16h3"/></svg></button>
    <button type="button" id="shapeBtn" aria-label="Shapes" title="Shapes" aria-haspopup="true" aria-expanded="false" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 5l8 14H4z"/></svg></button>
    <button type="button" data-tool="erase" aria-label="Eraser" title="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 19L4.6 14.6a1.6 1.6 0 0 1 0-2.2l8-8a1.6 1.6 0 0 1 2.2 0l4.6 4.6a1.6 1.6 0 0 1 0 2.2L12 19z"/><path d="M8.3 8.7l7 7M9 19h11"/></svg></button>
    <button type="button" id="undo" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 8h-3"/></svg></button>
  </div>
</div>

<div id="shapeFly" role="group" aria-label="Shapes" hidden>
  <button type="button" data-tool="rect" aria-label="Rectangle" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="6.5" width="16" height="11"/></svg></button>
  <button type="button" data-tool="diamond" aria-label="Diamond" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3.5l8.5 8.5-8.5 8.5L3.5 12z"/></svg></button>
  <button type="button" data-tool="ellipse" aria-label="Ellipse" aria-pressed="false"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6"/></svg></button>
  <button type="button" data-tool="line" aria-label="Line" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg></button>
  <button type="button" data-tool="arrow" aria-label="Arrow" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg></button>
</div>

<script>
(function () {
  'use strict';

  // ===== SEED: the only content this page starts with =====
  // Five areas, each a titled region at a fixed place on the canvas (board units, x/y = top-left).
  // `notes` are sticky notes placed inside the area: dx/dy are offsets from the area's top-left.
  // The seed is written to localStorage once, only when there is no saved board yet.
  // To change what a fresh visit shows, edit this block (and nothing else).
  var AREA_W = 360, AREA_H = 560, NOTE_SIZE = 200;
  var SEED = [
    { id: 'work', title: 'Work coding project', x: 0, y: 0, notes: [] },
    { id: 'pickleball', title: 'Pickleball plans', x: 440, y: 0, notes: [] },
    { id: 'coliving', title: 'Biohacker coliving hub - SF', x: 880, y: 0, notes: [
      { text: 'Getting sponsorships', dx: 80, dy: 110 }
    ] },
    { id: 'whiteboard', title: 'Whiteboard project', x: 0, y: 680, notes: [
      { text: 'Open the whiteboard - lilly-builds.github.io/lab/ideas/ai-whiteboard/', dx: 80, dy: 110 },
      { text: 'Metro map - lilly-builds.github.io/lab/ideas/metro-map/', dx: 80, dy: 330 }
    ] },
    { id: 'health-beauty', title: 'Health & beauty', x: 440, y: 680, notes: [] }
  ];
  // ===== END SEED =====

  var AREAS = SEED.map(function (a) { return { id: a.id, title: a.title, x: a.x, y: a.y, w: AREA_W, h: AREA_H }; });
  function areaById(id) { for (var i = 0; i < AREAS.length; i++) if (AREAS[i].id === id) return AREAS[i]; return null; }

  /* ---------- palette: black ink on white paper ---------- */
  var STROKES = [['#000000', 'Black']];
  var FILLS = [['none', 'No fill']];
  var NOTE_FILLS = [['#ffffff', 'White']];
  var WIDTHS = [1, 2, 4];
  var SHAPES = ['rect', 'diamond', 'ellipse', 'line', 'arrow'];
  var TYPES = ['pen', 'note', 'text', 'rect', 'diamond', 'ellipse', 'line', 'arrow'];
  function pick(v, list, d) {
    if (typeof v !== 'string') return d;
    v = v.toLowerCase();
    for (var i = 0; i < list.length; i++) if (list[i][0] === v) return v;
    return d;
  }
  function isClosed(t) { return t === 'rect' || t === 'diamond' || t === 'ellipse'; }
  function num(v, d) { v = Number(v); return isFinite(v) ? Math.max(-20000, Math.min(20000, v)) : d; }
  function str(v, n) { return typeof v === 'string' ? v.slice(0, n) : ''; }

  /* ---------- state ---------- */
  var KEY_SCENE = 'everything.scene', KEY_NOW = 'everything.now', KEY_MODE = 'everything.mode';
  var cv = document.getElementById('board'), ctx = cv.getContext('2d');
  var dock = document.getElementById('dock');
  var els = [], view = { x: 0, y: 0, z: 1 }, tool = 'move', undoStack = [], editing = null, selId = null, eraseIds = {};
  var cur = { strokeColor: '#000000', fill: 'none', strokeWidth: 2, dashed: false, noteFill: '#ffffff', size: 24 };
  var NOTE = 120, nextId = 1, editNew = false;
  var dpr = 1, W = 0, H = 0;
  var now = AREAS[0].id, mode = 'A';

  /* zoom:start */
  var MIN_Z = 0.25, MAX_Z = 4;
  function clampZ(z, minZ, maxZ) { return Math.max(minZ == null ? MIN_Z : minZ, Math.min(maxZ == null ? MAX_Z : maxZ, z)); }
  /* the view after scaling by factor, with the world point under screen (cx, cy) held fixed */
  function zoomAround(v, factor, cx, cy, minZ, maxZ) {
    var z0 = v.z || 1, z1 = clampZ(z0 * factor, minZ, maxZ);
    return { x: v.x + cx / z0 - cx / z1, y: v.y + cy / z0 - cy / z1, z: z1 };
  }
  function screenToWorld(v, sx, sy) { var z = v.z || 1; return { x: v.x + sx / z, y: v.y + sy / z }; }
  function worldToScreen(v, wx, wy) { var z = v.z || 1; return { x: (wx - v.x) * z, y: (wy - v.y) * z }; }
  /* zoom:end */
  function toWorld(cx, cy) { return screenToWorld(view, cx, cy); }
  function toScreen(wx, wy) { return worldToScreen(view, wx, wy); }

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function clampSize(v) { v = Number(v); return isFinite(v) ? Math.max(10, Math.min(120, Math.round(v))) : 24; }
  function cleanText(o) {
    var text = str(o.text, 2000);
    if (!text.trim()) return null;
    return {
      id: typeof o.id === 'string' && /^[\w-]{1,24}$/.test(o.id) ? o.id : null,
      type: 'text', x: num(o.x, 0), y: num(o.y, 0), text: text, size: clampSize(o.size),
      color: pick(o.color, STROKES, '#000000'),
      w: Math.max(40, Math.min(2000, Math.abs(num(o.w, 280))))
    };
  }
  /* keep known element types only; text is rebuilt from known fields */
  function loadEls(arr) {
    var out = [];
    arr.forEach(function (e) {
      if (!e || typeof e !== 'object' || TYPES.indexOf(e.type) < 0) return;
      if (e.type === 'text') { e = cleanText(e); if (!e) return; }
      out.push(e);
    });
    return out;
  }
  function newId() { return 'e' + (nextId++); }
  function seedBoard() {
    SEED.forEach(function (a) {
      a.notes.forEach(function (n) {
        els.push({ id: newId(), type: 'note', x: a.x + n.dx, y: a.y + n.dy, w: NOTE_SIZE, h: NOTE_SIZE, text: n.text, fill: '#ffffff' });
      });
    });
  }

  function ser(v) { return JSON.stringify(v); }
  function save() { lsSet(KEY_SCENE, ser(els)); }
  function snap() { undoStack.push(ser(els)); if (undoStack.length > 60) undoStack.shift(); syncUndo(); }
  function syncUndo() { document.getElementById('undo').disabled = !undoStack.length; }
  function selEl() {
    if (!selId) return null;
    for (var i = 0; i < els.length; i++) if (els[i].id === selId) return els[i];
    selId = null; return null;
  }

  /* saved board wins; the seed loads only when there is none */
  (function boot() {
    var raw = lsGet(KEY_SCENE), saved = null;
    if (raw !== null) { try { var s = JSON.parse(raw); if (Array.isArray(s)) saved = s; } catch (e) {} }
    if (saved) els = loadEls(saved);
    els.forEach(function (e) { var n = parseInt(String(e.id).replace(/\D/g, ''), 10); if (n >= nextId) nextId = n + 1; });
    els.forEach(function (e) { if (!e.id) e.id = newId(); });
    if (!saved) { seedBoard(); save(); }
    var n0 = lsGet(KEY_NOW), m0 = lsGet(KEY_MODE);
    if (areaById(n0)) now = n0;
    if (m0 === 'A' || m0 === 'B' || m0 === 'C') mode = m0;
    var h = decodeURIComponent((location.hash || '').slice(1));
    if (areaById(h)) now = h;
  })();

  /* ---------- text layout ---------- */
  var FAMILY = '"Special Elite", "Courier New", monospace';
  var FONT = '400 16px ' + FAMILY;
  function wrap(text, maxW, font) {
    ctx.font = font;
    var out = [];
    String(text || '').split('\n').forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean), line = '';
      if (!words.length) { out.push(''); return; }
      words.forEach(function (w) {
        /* a link wider than the box is broken across lines instead of spilling out */
        while (ctx.measureText(w).width > maxW && w.length > 1) {
          var n = w.length - 1;
          while (n > 1 && ctx.measureText(w.slice(0, n)).width > maxW) n--;
          if (line) { out.push(line); line = ''; }
          out.push(w.slice(0, n)); w = w.slice(n);
        }
        var t = line ? line + ' ' + w : w;
        if (line && ctx.measureText(t).width > maxW) { out.push(line); line = w; } else line = t;
      });
      out.push(line);
    });
    return out;
  }
  function fitNote(el) {
    var s = NOTE;
    while (s < 280 && wrap(el.text, s - 16, FONT).length * 20 > s - 16) s += 20;
    el.w = el.h = s;
  }
  /* note text: 16px, shrinking one px at a time to 12px when the square is too small */
  function noteLayout(el) {
    var fs = 16, font, lh, lines;
    for (; fs >= 12; fs--) {
      font = '400 ' + fs + 'px ' + FAMILY; lh = Math.round(fs * 1.25);
      lines = wrap(el.text, el.w - 16, font);
      if (lines.length * lh <= el.h - 16) break;
    }
    return { font: font, lh: lh, lines: lines, max: Math.floor((el.h - 16) / lh) };
  }
  function textLH(el) { return Math.round(el.size * 1.4); }
  function textBox(el) {
    var font = '400 ' + el.size + 'px ' + FAMILY, lh = textLH(el);
    var lines = wrap(el.text, el.w, font);
    var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l).width); });
    return { lines: lines, font: font, lh: lh, w: Math.max(24, w), h: Math.max(1, lines.length) * lh };
  }

  /* ---------- geometry ---------- */
  function bbox(el) {
    if (el.type === 'pen') {
      var minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
      el.pts.forEach(function (p) { minx = Math.min(minx, p[0]); miny = Math.min(miny, p[1]); maxx = Math.max(maxx, p[0]); maxy = Math.max(maxy, p[1]); });
      return { x: el.x + minx, y: el.y + miny, w: maxx - minx, h: maxy - miny };
    }
    if (el.type === 'text') { var t = textBox(el); return { x: el.x, y: el.y, w: t.w, h: t.h }; }
    if (el.type === 'line' || el.type === 'arrow') return { x: Math.min(el.x, el.x + el.w), y: Math.min(el.y, el.y + el.h), w: Math.abs(el.w), h: Math.abs(el.h) };
    return { x: el.x, y: el.y, w: el.w, h: el.h };
  }
  function distSeg(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy, t = l ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l)) : 0;
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }

  /* an element belongs to the area its center sits in */
  function areaOf(el) {
    var b = bbox(el), cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    for (var i = 0; i < AREAS.length; i++) {
      var a = AREAS[i];
      if (cx >= a.x && cx <= a.x + a.w && cy >= a.y && cy <= a.y + a.h) return a.id;
    }
    return null;
  }
  /* focus modes: B shows only the selected area, C dims every other one */
  function visible(el) { return mode !== 'B' || areaOf(el) === now; }
  function alphaFor(id) { return mode === 'C' && id !== now ? 0.25 : 1; }

  function hit(el, px, py) {
    var pad = 10 / view.z, pad4 = 4 / view.z;
    if (el.type === 'pen') {
      for (var i = 0; i < el.pts.length; i++) {
        var a = el.pts[i], b = el.pts[i + 1] || a;
        if (distSeg(px, py, el.x + a[0], el.y + a[1], el.x + b[0], el.y + b[1]) < pad) return true;
      }
      return false;
    }
    if (el.type === 'line' || el.type === 'arrow') return distSeg(px, py, el.x, el.y, el.x + el.w, el.y + el.h) < pad;
    var b2 = bbox(el);
    return px >= b2.x - pad4 && px <= b2.x + b2.w + pad4 && py >= b2.y - pad4 && py <= b2.y + b2.h + pad4;
  }
  function topAt(px, py) { for (var i = els.length - 1; i >= 0; i--) if (visible(els[i]) && hit(els[i], px, py)) return els[i]; return null; }

  /* resize handles: corners for boxes, both ends for lines and arrows */
  function handles(el) {
    if (el.type === 'line' || el.type === 'arrow') return [{ x: el.x, y: el.y }, { x: el.x + el.w, y: el.y + el.h }];
    if (el.type === 'text') { var tb = bbox(el); return [{ x: tb.x, y: tb.y }, { x: tb.x + tb.w, y: tb.y }, { x: tb.x + tb.w, y: tb.y + tb.h }, { x: tb.x, y: tb.y + tb.h }]; }
    if (isClosed(el.type)) return [{ x: el.x, y: el.y }, { x: el.x + el.w, y: el.y }, { x: el.x + el.w, y: el.y + el.h }, { x: el.x, y: el.y + el.h }];
    return [];
  }
  function handleAt(el, px, py) {
    var hs = handles(el);
    for (var i = 0; i < hs.length; i++) if (Math.hypot(px - hs[i].x, py - hs[i].y) < 16 / view.z) return i;
    return -1;
  }

  /* ---------- rendering ---------- */
  function elWidth(el) { return WIDTHS.indexOf(el.strokeWidth) >= 0 ? el.strokeWidth : (el.type === 'pen' ? 2.2 : 1.5); }
  function shapePath(g, el, x, y) {
    g.beginPath();
    if (el.type === 'rect') g.rect(x, y, el.w, el.h);
    else if (el.type === 'diamond') { g.moveTo(x + el.w / 2, y); g.lineTo(x + el.w, y + el.h / 2); g.lineTo(x + el.w / 2, y + el.h); g.lineTo(x, y + el.h / 2); g.closePath(); }
    else { g.ellipse(x + el.w / 2, y + el.h / 2, Math.abs(el.w / 2), Math.abs(el.h / 2), 0, 0, Math.PI * 2); g.closePath(); }
  }
  function drawEl(g, el, ox, oy) {
    var col = pick(el.strokeColor, STROKES, '#000000');
    var lw = elWidth(el);
    g.save();
    g.lineWidth = lw;
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = col;

      if (!d.moved) {
        undoStack.pop(); syncUndo();
        if (d.el.type === 'note') editNote(d.el);
        else if (d.el.type === 'text') {
          var nowT = Date.now();
          if (lastTap.id === d.el.id && nowT - lastTap.t < 350) { lastTap = { id: null, t: 0 }; editText(d.el, false); }
          else lastTap = { id: d.el.id, t: nowT };
        }
      }
      else save();
    } else if (d.kind === 'text') editText(d.el, d.isNew);
    else if (d.kind === 'shape') {
      if (Math.hypot(d.el.w, d.el.h) < 6) { els = els.filter(function (x) { return x !== d.el; }); undoStack.pop(); syncUndo(); }
      else { setTool('move'); selId = d.el.id; save(); }
    }
    else if (d.kind !== 'pan') save();
    draw();
  }
  function up(e) {
    delete ptrs[e.pointerId];
    if (pinch && ptrIds().length < 2) pinch = null;
    end(e);
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);

  /* wheel pans; ctrl+wheel and trackpad pinch zoom around the pointer */
  window.addEventListener('wheel', function (e) {
    e.preventDefault();
    stopAnim();
    var dx = e.deltaX * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1), dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1);
    if (e.ctrlKey) zoomBy(Math.exp(-dy * (Math.abs(dy) >= 50 ? 0.002 : 0.01)), e.clientX, e.clientY);
    else setView({ x: view.x + dx / view.z, y: view.y + dy / view.z, z: view.z });
  }, { passive: false });
  /* Safari reports pinch as gesture events; keep them from zooming the page */
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }); });
  var zOut = document.getElementById('zOut'), zIn = document.getElementById('zIn');
  zOut.addEventListener('click', function () { zoomBy(1 / 1.25, W / 2, H / 2); });
  zIn.addEventListener('click', function () { zoomBy(1.25, W / 2, H / 2); });
  function syncZoomUI() {
    zOut.disabled = view.z <= MIN_Z + 1e-6; zIn.disabled = view.z >= MAX_Z - 1e-6;
  }

  /* ---------- shape slot ---------- */
  var shapeBtn = document.getElementById('shapeBtn'), shapeFly = document.getElementById('shapeFly');
  var shapeItems = Array.prototype.slice.call(shapeFly.querySelectorAll('[data-tool]'));
  function setShapeIcon(t) {
    var it = shapeItems.filter(function (b) { return b.dataset.tool === t; })[0];
    if (it) shapeBtn.innerHTML = it.innerHTML;
  }
  function syncShape(t) {
    var on = SHAPES.indexOf(t) >= 0;
    if (on) setShapeIcon(t);
    shapeBtn.setAttribute('aria-pressed', String(on));
  }
  function closeFly(refocus) {
    if (shapeFly.hidden) return;
    shapeFly.hidden = true; shapeBtn.setAttribute('aria-expanded', 'false');
    if (refocus) shapeBtn.focus();
  }
  function openFly() {
    shapeFly.hidden = false; shapeBtn.setAttribute('aria-expanded', 'true');
    var r = shapeBtn.getBoundingClientRect(), w = shapeFly.offsetWidth, h = shapeFly.offsetHeight, vw = document.documentElement.clientWidth;
    var x = Math.max(4, Math.min(r.left + r.width / 2 - w / 2, vw - w - 4));
    var y = r.top - h - 4; if (y < 4) y = Math.min(r.bottom + 4, window.innerHeight - h - 4);
    shapeFly.style.left = x + 'px'; shapeFly.style.top = y + 'px';
    (shapeItems.filter(function (b) { return b.dataset.tool === tool; })[0] || shapeItems[0]).focus();
  }
  shapeBtn.addEventListener('click', function () { commitEdit(); if (shapeFly.hidden) openFly(); else closeFly(false); });
  shapeItems.forEach(function (b) { b.addEventListener('click', function () { closeFly(true); }); });
  shapeFly.addEventListener('keydown', function (e) {
    var i = shapeItems.indexOf(document.activeElement), n = shapeItems.length;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); shapeItems[(i + 1) % n].focus(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); shapeItems[(i + n - 1) % n].focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeFly(true); }
  });
  document.addEventListener('pointerdown', function (e) {
    if (!shapeFly.hidden && !shapeFly.contains(e.target) && !shapeBtn.contains(e.target)) closeFly(false);
  }, true);

  /* ---------- toolbar ---------- */
  var toolBtns = document.querySelectorAll('[data-tool]');
  var prevTool = 'move';
  function setTool(t) {
    if (t === 'erase' && tool !== 'erase') prevTool = tool;
    if (drag && drag.kind === 'erase') { drag = null; endErase(false); }
    tool = t; selId = null;
    if (t !== 'erase') eraseCur.style.display = 'none';
    toolBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.tool === t)); });
    syncShape(t);
    cv.className = t === 'move' ? '' : t === 'text' ? 'txt' : t === 'erase' ? 'erase' : 'pen';
    draw();
  }
  toolBtns.forEach(function (b) { b.addEventListener('click', function () { commitEdit(); setTool(b.dataset.tool === 'erase' && tool === 'erase' ? prevTool : b.dataset.tool); }); });
  function undo() {
    commitEdit();
    if (!undoStack.length) return;
    els = JSON.parse(undoStack.pop()); save(); syncUndo(); draw();
  }
  document.getElementById('undo').addEventListener('click', undo);
  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement && document.activeElement.tagName, typing = tag === 'TEXTAREA' || tag === 'INPUT';
    if (e.key === 'Escape') { closeFly(false); if (tool === 'erase') setTool(prevTool); return; }
    if (typing) return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { if (selEl()) { e.preventDefault(); deleteSel(); } }
    else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomBy(1.25, W / 2, H / 2); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomBy(1 / 1.25, W / 2, H / 2); }
    else if (e.key === '0') { e.preventDefault(); zoomReset(); }
    else if (e.key.toLowerCase() === 'e') { e.preventDefault(); commitEdit(); setTool(tool === 'erase' ? prevTool : 'erase'); }
    else if (e.key.toLowerCase() === 't') { e.preventDefault(); commitEdit(); setTool('text'); }
  });

  /* ---------- start: open on the NOW area ---------- */
  document.body.dataset.mode = mode;
  modeBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.mode === mode)); });
  syncUndo(); syncIndex(); resize();
  history.replaceState(null, '', '#' + now);
  setView(fitView(areaById(now)));
})();
</script>
</body>
</html>
