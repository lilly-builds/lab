<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everything, everywhere, all at once</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --ink: #000; --paper: #fff; --f: "Special Elite", "Courier New", monospace; }
  * { box-sizing: border-box; border-radius: 0; box-shadow: none; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink); }
  body { font: 400 16px/1.4 var(--f); font-synthesis: none; overscroll-behavior: none; }
  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  canvas#board { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: crosshair; }
  canvas#board.move { cursor: grab; }
  canvas#board.txt { cursor: text; }
  canvas#board.erase { cursor: none; }
  #eraseCur { position: fixed; left: 0; top: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; border: 1px solid var(--ink); border-radius: 50% !important; pointer-events: none; z-index: 6; display: none; }

  textarea#noteEdit { position: fixed; transform-origin: 0 0; display: none; margin: 0; padding: 8px; resize: none; overflow: hidden; border: 1px solid var(--ink); background: var(--paper); font: 400 16px/20px var(--f); outline: 0; z-index: 5; }
  textarea#textEdit { position: fixed; transform-origin: 0 0; display: none; margin: 0; padding: 0; resize: none; overflow: hidden; border: 0; background: transparent; font: 400 20px/28px var(--f); outline: 1px solid var(--ink); outline-offset: 4px; z-index: 5; }

  #top { position: fixed; top: 0; left: 0; right: 0; z-index: 8; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left)); pointer-events: none; }
  #top h1 { margin: 0; font: 400 17px/1.25 var(--f); letter-spacing: .3px; padding-top: 4px; }
  #focus { display: flex; flex: none; background: var(--paper); pointer-events: auto; }
  #focus button { width: 32px; height: 32px; border: 1px solid var(--ink); margin-left: -1px; font-size: 13px; line-height: 1; background: var(--paper); }
  #focus button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 8px calc(8px + env(safe-area-inset-bottom)); pointer-events: none; }
  #dock > * { pointer-events: auto; }
  #bar { display: flex; justify-content: center; max-width: 100%; background: var(--paper); border: 1px solid var(--ink); }
  #bar button { width: 42px; height: 40px; display: flex; align-items: center; justify-content: center; }
  #bar button + button { border-left: 1px solid var(--ink); }
  #bar button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  #bar button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #bar button:disabled { opacity: .3; cursor: default; }

  #index { display: flex; width: 100%; max-width: 760px; overflow-x: auto; scrollbar-width: none; background: var(--paper); border: 1px solid var(--ink); }
  #index::-webkit-scrollbar { display: none; }
  #index button { position: relative; flex: 1 0 auto; min-height: 46px; padding: 14px 14px 4px; white-space: nowrap; font-size: 14px; line-height: 1.2; }
  #index button + button { border-left: 1px solid var(--ink); }
  #index button[aria-current="true"] { background: var(--ink); color: var(--paper); }
  #index button i { display: none; position: absolute; left: 0; right: 0; top: 3px; text-align: center; font-style: normal; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; }
  body.m-A #index button[aria-current="true"] i { display: block; }
</style>
</head>
<body>
<canvas id="board"></canvas>
<div id="eraseCur" aria-hidden="true"></div>
<textarea id="noteEdit" aria-label="Note" maxlength="400"></textarea>
<textarea id="textEdit" aria-label="Text" maxlength="2000" rows="1" spellcheck="false" autocorrect="off" wrap="soft"></textarea>

<div id="top">
  <h1>Everything, everywhere, all at once.</h1>
  <div id="focus" role="group" aria-label="Focus">
    <button type="button" data-mode="A" title="Now bar" aria-label="Now bar" aria-pressed="true">A</button>
    <button type="button" data-mode="B" title="Solo" aria-label="Solo" aria-pressed="false">B</button>
    <button type="button" data-mode="C" title="Dim" aria-label="Dim" aria-pressed="false">C</button>
  </div>
</div>

<div id="dock">
  <div id="bar" role="toolbar" aria-label="Tools">
    <button type="button" data-tool="move" aria-label="Select and move" title="Select and move" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-2.5 2.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg></button>
    <button type="button" data-tool="pen" aria-label="Pen" title="Pen" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 0a2 2 0 0 1 0 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg></button>
    <button type="button" data-tool="note" aria-label="Note" title="Note" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15"/><path d="M8 9.5h8M8 13h5"/></svg></button>
    <button type="button" data-tool="text" aria-label="Text" title="Text" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15"/><path d="M8.5 9.5V8h7v1.5M12 8v8M10.5 16h3"/></svg></button>
    <button type="button" id="shapeBtn" aria-label="Shape" title="Shape (tap again for next)" aria-pressed="false"></button>
    <button type="button" data-tool="erase" aria-label="Eraser" title="Eraser" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 19L4.6 14.6a1.6 1.6 0 0 1 0-2.2l8-8a1.6 1.6 0 0 1 2.2 0l4.6 4.6a1.6 1.6 0 0 1 0 2.2L12 19z"/><path d="M8.3 8.7l7 7M9 19h11"/></svg></button>
    <button type="button" id="undo" aria-label="Undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 8h-3"/></svg></button>
    <button type="button" id="del" aria-label="Delete" title="Delete" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <nav id="index" aria-label="Areas"></nav>
</div>

<script>
(function () {
  'use strict';

  /* ---------- SEED: the whole starting board ----------
     Five areas, each a titled region at a fixed spot on one big canvas (world units, 1 unit = 1px at 100%).
     id    -> the sublink: .../everything/#<id>
     title -> the heading drawn on the board and the label in the index bar
     x, y  -> top-left corner of the area on the canvas
     notes -> sticky notes placed inside the area, top to bottom
     Areas are always drawn from this block. The notes are copied into localStorage
     ("everything.scene") only when no saved board exists, then belong to the user. */
  var AREA_W = 360, AREA_H = 520;
  var SEED = [
    { id: 'work',          title: 'Work coding project',        x: 0,   y: 0,   notes: [] },
    { id: 'pickleball',    title: 'Pickleball plans',           x: 480, y: 0,   notes: [] },
    { id: 'coliving',      title: 'Biohacker coliving hub - SF', x: 960, y: 0,  notes: ['Getting sponsorships'] },
    { id: 'whiteboard',    title: 'Whiteboard project',         x: 0,   y: 640, notes: ['Open the whiteboard - lilly-builds.github.io/lab/ideas/ai-whiteboard/', 'Metro map - lilly-builds.github.io/lab/ideas/metro-map/'] },
    { id: 'health-beauty', title: 'Health & beauty',            x: 480, y: 640, notes: [] }
  ];

  /* storage: every key starts with "everything." and never touches the whiteboard's own keys */
  var K = { scene: 'everything.scene', sel: 'everything.sel', mode: 'everything.mode', shape: 'everything.shape' };
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  /* ---------- state ---------- */
  var cv = document.getElementById('board'), ctx = cv.getContext('2d');
  var els = [], view = { x: 0, y: 0, z: 1 }, tool = 'move', undoStack = [], editing = null, selId = null, eraseIds = {};
  var NOTE_W = 200, NOTE_H = 88, LH = 20, nextId = 1, editNew = false;
  var dpr = 1, W = 0, H = 0, lastW = 0, TOP = 56;
  var sel = SEED[0].id, mode = 'A', anim = null;
  var areaById = {};
  SEED.forEach(function (a) { a.w = AREA_W; a.h = AREA_H; areaById[a.id] = a; });

  var MIN_Z = 0.15, MAX_Z = 4;
  function clampZ(z) { return Math.max(MIN_Z, Math.min(MAX_Z, z)); }
  function zoomAround(v, factor, cx, cy) {
    var z0 = v.z || 1, z1 = clampZ(z0 * factor);
    return { x: v.x + cx / z0 - cx / z1, y: v.y + cy / z0 - cy / z1, z: z1 };
  }
  function toWorld(cx, cy) { return { x: view.x + cx / view.z, y: view.y + cy / view.z }; }
  function toScreen(wx, wy) { return { x: (wx - view.x) * view.z, y: (wy - view.y) * view.z }; }

  var TYPES = ['note', 'text', 'pen', 'rect', 'diamond', 'ellipse', 'line', 'arrow'];
  var SHAPES = ['rect', 'ellipse', 'line', 'arrow'];
  function isClosed(t) { return t === 'rect' || t === 'diamond' || t === 'ellipse'; }
  function num(v, d) { v = Number(v); return isFinite(v) ? Math.max(-20000, Math.min(20000, v)) : d; }
  function str(v, n) { return typeof v === 'string' ? v.slice(0, n) : ''; }
  function clampSize(v) { v = Number(v); return isFinite(v) ? Math.max(10, Math.min(120, Math.round(v))) : 20; }
  function newId() { return 'e' + (nextId++); }

  function cleanEl(o) {
    if (!o || typeof o !== 'object' || TYPES.indexOf(o.type) < 0) return null;
    var e = { id: typeof o.id === 'string' && /^[\w-]{1,24}$/.test(o.id) ? o.id : null, type: o.type, x: num(o.x, 0), y: num(o.y, 0) };
    if (o.type === 'pen') {
      if (!Array.isArray(o.pts) || !o.pts.length) return null;
      e.pts = o.pts.slice(0, 5000).map(function (p) { return [num(p && p[0], 0), num(p && p[1], 0)]; });
    } else if (o.type === 'text') {
      e.text = str(o.text, 2000);
      if (!e.text.trim()) return null;
      e.size = clampSize(o.size); e.w = Math.max(40, Math.min(2000, Math.abs(num(o.w, 280))));
    } else if (o.type === 'note') {
      e.text = str(o.text, 400); e.w = Math.max(60, Math.min(600, Math.abs(num(o.w, NOTE_W)))); e.h = Math.max(40, Math.min(800, Math.abs(num(o.h, NOTE_H))));
    } else { e.w = num(o.w, 0); e.h = num(o.h, 0); }
    return e;
  }
  function seedEls() {
    var out = [];
    SEED.forEach(function (a) {
      a.notes.forEach(function (t, i) { out.push({ id: 'e' + (out.length + 1), type: 'note', x: a.x + 20, y: a.y + 64 + i * (NOTE_H + 16), w: a.w - 40, h: NOTE_H, text: t }); });
    });
    return out;
  }
  var saved = lsGet(K.scene);
  if (saved === null) { els = seedEls(); lsSet(K.scene, JSON.stringify(els)); }
  else { try { var s = JSON.parse(saved); if (Array.isArray(s)) els = s.map(cleanEl).filter(Boolean); } catch (e) {} }
  els.forEach(function (e) { var n = parseInt(String(e.id).replace(/\D/g, ''), 10); if (n >= nextId) nextId = n + 1; });
  els.forEach(function (e) { if (!e.id) e.id = newId(); });
  if (lsGet(K.mode) === 'B' || lsGet(K.mode) === 'C') mode = lsGet(K.mode);
  if (areaById[lsGet(K.sel)]) sel = lsGet(K.sel);

  function save() { lsSet(K.scene, JSON.stringify(els)); }
  function snap() { undoStack.push(JSON.stringify(els)); if (undoStack.length > 60) undoStack.shift(); syncUndo(); }
  function syncUndo() { document.getElementById('undo').disabled = !undoStack.length; }
  function selEl() {
    if (!selId) return null;
    for (var i = 0; i < els.length; i++) if (els[i].id === selId) return els[i];
    selId = null; return null;
  }

  /* ---------- text layout ---------- */
  var FAMILY = '"Special Elite", "Courier New", monospace';
  var FONT = '400 16px ' + FAMILY;
  /* words wider than the line (links) are broken by character */
  function wrap(text, maxW, font) {
    ctx.font = font;
    var out = [];
    String(text || '').split('\n').forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean), line = '';
      if (!words.length) { out.push(''); return; }
      words.forEach(function (w) {
        while (w.length > 1 && ctx.measureText(w).width > maxW) {
          var n = w.length - 1;
          while (n > 1 && ctx.measureText(w.slice(0, n)).width > maxW) n--;
          if (line) { out.push(line); line = ''; }
          out.push(w.slice(0, n)); w = w.slice(n);
        }
        var t = line ? line + ' ' + w : w;
        if (line && ctx.measureText(t).width > maxW) { out.push(line); line = w; } else line = t;
      });
      out.push(line);
    });
    return out;
  }
  function noteLines(el) { return wrap(el.text, el.w - 16, FONT); }
  /* a note only ever grows to fit its words */
  function fitNote(el) { el.h = Math.max(el.h || NOTE_H, noteLines(el).length * LH + 16); }
  function textLH(el) { return Math.round(el.size * 1.4); }
  function textBox(el) {
    var font = '400 ' + el.size + 'px ' + FAMILY, lh = textLH(el);
    var lines = wrap(el.text, el.w, font);
    var w = 0; lines.forEach(function (l) { w = Math.max(w, ctx.measureText(l).width); });
    return { lines: lines, font: font, lh: lh, w: Math.max(24, w), h: Math.max(1, lines.length) * lh };
  }

  /* ---------- geometry ---------- */
  function bbox(el) {
    if (el.type === 'pen') {
      var minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
      el.pts.forEach(function (p) { minx = Math.min(minx, p[0]); miny = Math.min(miny, p[1]); maxx = Math.max(maxx, p[0]); maxy = Math.max(maxy, p[1]); });
      return { x: el.x + minx, y: el.y + miny, w: maxx - minx, h: maxy - miny };
    }
    if (el.type === 'text') { var t = textBox(el); return { x: el.x, y: el.y, w: t.w, h: t.h }; }
    if (el.type === 'line' || el.type === 'arrow') return { x: Math.min(el.x, el.x + el.w), y: Math.min(el.y, el.y + el.h), w: Math.abs(el.w), h: Math.abs(el.h) };
    return { x: el.x, y: el.y, w: el.w, h: el.h };
  }
  function distSeg(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy, t = l ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l)) : 0;
    return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
  }
  function hit(el, px, py) {
    var pad = 10 / view.z, pad4 = 4 / view.z;
    if (el.type === 'pen') {
      for (var i = 0; i < el.pts.length; i++) {
        var a = el.pts[i], b = el.pts[i + 1] || a;
        if (distSeg(px, py, el.x + a[0], el.y + a[1], el.x + b[0], el.y + b[1]) < pad) return true;
      }
      return false;
    }
    if (el.type === 'line' || el.type === 'arrow') return distSeg(px, py, el.x, el.y, el.x + el.w, el.y + el.h) < pad;
    var b2 = bbox(el);
    return px >= b2.x - pad4 && px <= b2.x + b2.w + pad4 && py >= b2.y - pad4 && py <= b2.y + b2.h + pad4;
  }
  /* which area an element belongs to: the one holding its center */
  function ownerOf(el) {
    var b = bbox(el), cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    for (var i = 0; i < SEED.length; i++) {
      var a = SEED[i];
      if (cx >= a.x && cx <= a.x + a.w && cy >= a.y && cy <= a.y + a.h) return a.id;
    }
    return null;
  }
  function touches(el, a) {
    var b = bbox(el);
    return b.x <= a.x + a.w && b.x + b.w >= a.x && b.y <= a.y + a.h && b.y + b.h >= a.y;
  }
  /* solo shows only the chosen area's content */
  function visible(el) {
    if (mode !== 'B') return true;
    var o = ownerOf(el);
    return o === sel || (o === null && touches(el, areaById[sel]));
  }
  function topAt(px, py) { for (var i = els.length - 1; i >= 0; i--) if (visible(els[i]) && hit(els[i], px, py)) return els[i]; return null; }

  function handles(el) {
    if (el.type === 'line' || el.type === 'arrow') return [{ x: el.x, y: el.y }, { x: el.x + el.w, y: el.y + el.h }];
    if (el.type === 'text') { var tb = bbox(el); return [{ x: tb.x, y: tb.y }, { x: tb.x + tb.w, y: tb.y }, { x: tb.x + tb.w, y: tb.y + tb.h }, { x: tb.x, y: tb.y + tb.h }]; }
    if (isClosed(el.type)) return [{ x: el.x, y: el.y }, { x: el.x + el.w, y: el.y }, { x: el.x + el.w, y: el.y + el.h }, { x: el.x, y: el.y + el.h }];
    return [];
  }
  function handleAt(el, px, py) {
    var hs = handles(el);
    for (var i = 0; i < hs.length; i++) if (Math.hypot(px - hs[i].x, py - hs[i].y) < 16 / view.z) return i;
    return -1;
  }

  /* ---------- rendering ---------- */
  function shapePath(g, el, x, y) {
    g.beginPath();
    if (el.type === 'rect') g.rect(x, y, el.w, el.h);
    else if (el.type === 'diamond') { g.moveTo(x + el.w / 2, y); g.lineTo(x + el.w, y + el.h / 2); g.lineTo(x + el.w / 2, y + el.h); g.lineTo(x, y + el.h / 2); g.closePath(); }
    else { g.ellipse(x + el.w / 2, y + el.h / 2, Math.abs(el.w / 2), Math.abs(el.h / 2), 0, 0, Math.PI * 2); g.closePath(); }
  }
  function drawEl(g, el, ox, oy) {
    g.save();
    g.lineWidth = el.type === 'pen' ? 2.2 : 1.5;
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = '#000'; g.fillStyle = '#000';
    var x = el.x - ox, y = el.y - oy;
    if (el.type === 'pen') {
      var p = el.pts;
      g.beginPath();
      if (p.length === 1) { g.arc(x + p[0][0], y + p[0][1], 1.4, 0, Math.PI * 2); g.closePath(); g.fill(); }
      else {
        g.moveTo(x + p[0][0], y + p[0][1]);
        for (var i = 1; i < p.length - 1; i++) g.quadraticCurveTo(x + p[i][0], y + p[i][1], x + (p[i][0] + p[i + 1][0]) / 2, y + (p[i][1] + p[i + 1][1]) / 2);
        g.lineTo(x + p[p.length - 1][0], y + p[p.length - 1][1]);
        g.stroke();
      }
    } else if (el.type === 'note') {
      g.fillStyle = '#fff'; g.fillRect(x, y, el.w, el.h);
      g.lineWidth = 1;
      g.strokeRect(x + .5, y + .5, el.w - 1, el.h - 1);
      if (editing !== el.id) {
        g.fillStyle = '#000'; g.textBaseline = 'top'; g.font = FONT;
        noteLines(el).forEach(function (l, i) { g.fillText(l, x + 8, y + 8 + i * LH); });
      }
    } else if (el.type === 'text') {
      if (editing !== el.id) {
        var t = textBox(el);
        g.font = t.font; g.textBaseline = 'middle'; g.textAlign = 'left';
        t.lines.forEach(function (l, i) { g.fillText(l, x, y + i * t.lh + t.lh / 2); });
      }
    } else if (isClosed(el.type)) {
      shapePath(g, el, x, y); g.stroke();
    } else if (el.type === 'line' || el.type === 'arrow') {
      var x2 = x + el.w, y2 = y + el.h;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
      if (el.type === 'arrow') {
        var a = Math.atan2(el.h, el.w), hl = 15;
        g.beginPath(); g.moveTo(x2 - hl * Math.cos(a - 0.45), y2 - hl * Math.sin(a - 0.45)); g.lineTo(x2, y2); g.lineTo(x2 - hl * Math.cos(a + 0.45), y2 - hl * Math.sin(a + 0.45)); g.stroke();
      }
    }
    g.restore();
  }
  function drawArea(g, a, alpha) {
    g.save();
    g.globalAlpha = alpha;
    g.strokeStyle = '#000'; g.fillStyle = '#000'; g.lineWidth = 1;
    var x = a.x - view.x, y = a.y - view.y;
    g.strokeRect(x + .5, y + .5, a.w - 1, a.h - 1);
    g.beginPath(); g.moveTo(x, y + 44.5); g.lineTo(x + a.w, y + 44.5); g.stroke();
    g.font = '400 20px ' + FAMILY; g.textBaseline = 'middle'; g.textAlign = 'left';
    var tt = a.title;
    while (tt.length > 1 && g.measureText(tt).width > a.w - 24) tt = tt.slice(0, -1);
    g.fillText(tt, x + 12, y + 23);
    g.restore();
  }
  function drawSel(g, el) {
    var b = bbox(el), z = view.z, o = toScreen(b.x, b.y);

    var s = selEl();
    if (!s) return;
    snap(); els = els.filter(function (e) { return e !== s; }); selId = null; save(); draw();
  }
  document.getElementById('undo').addEventListener('click', undo);
  document.getElementById('del').addEventListener('click', deleteSel);
  document.addEventListener('keydown', function (e) {
    var tag = document.activeElement && document.activeElement.tagName, typing = tag === 'TEXTAREA' || tag === 'INPUT';
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if ((e.key === 'Delete' || e.key === 'Backspace') && selEl()) { e.preventDefault(); deleteSel(); }
    else if (e.key === 'Escape' && tool === 'erase') setTool(prevTool);
    else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomBy(1.25, W / 2, H / 2); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomBy(1 / 1.25, W / 2, H / 2); }
    else if (e.key === '0') { e.preventDefault(); animateTo(fitView(sel)); }
    else if (e.key.toLowerCase() === 'e') { e.preventDefault(); setTool(tool === 'erase' ? prevTool : 'erase'); }
    else if (e.key.toLowerCase() === 't') { e.preventDefault(); setTool('text'); }
  });
  syncUndo();
  syncShape();

  /* ---------- start: a hash link lands on its area, otherwise the last NOW ---------- */
  var startId = hashId() || sel;
  sel = startId; lsSet(K.sel, sel);
  syncIndex();
  resize();
  if (!hashId()) { try { history.replaceState(null, '', '#' + sel); } catch (e) {} }
})();
</script>
