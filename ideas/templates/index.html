<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000;
    --paper: #fff;
    --serif: "Special Elite", "Courier New", monospace;
    --mono: "Special Elite", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body { background: var(--paper); color: var(--ink); font: 400 17px/1.45 var(--serif); font-synthesis: none; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  .app { max-width: 1040px; margin: 0 auto; padding: 24px 16px 56px; }
  .spaces { display: flex; justify-content: center; gap: 12px; }
  .spaces a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 0 16px; border: 1px solid transparent; border-radius: 0; font: 400 15px/1 var(--serif); text-decoration: none; }
  .spaces a[aria-current="page"] { border-color: var(--ink); }
  h1 { font: 400 clamp(26px, 6vw, 38px)/1.2 var(--serif); margin: 10px 0 28px; text-align: center; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px 28px; max-width: 640px; margin-left: auto; margin-right: auto; }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: none; } }
  .card { position: relative; display: flex; min-width: 0; min-height: 340px; aspect-ratio: 3 / 2; padding: 8px; background: var(--paper); border: 1px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); container-type: inline-size; transition: transform 120ms, box-shadow 120ms; }
  .card::before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(0,0,0,.12); pointer-events: none; }
  .card:hover, .card:focus-visible, .card:focus-within { transform: translate(-2px, -2px); }
  .card:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .card:focus-visible, .card:focus-within { outline: 2px solid var(--ink); outline-offset: 3px; }
  .card .pic { flex: 0 0 58%; position: relative; margin: 8px 0 8px 8px; }
  .card .pic canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; background: var(--paper); }
  .card .msg { flex: 1 1 0; min-width: 0; margin: 8px 8px 8px 12px; padding: 76px 8px 0 12px; border-left: 1px solid rgba(0,0,0,.55); }
  .card .title { display: block; margin-bottom: 14px; font-size: 20px; line-height: 1.2; font-style: italic; overflow-wrap: anywhere; }
  .card .title span { display: block; transform: rotate(-1.5deg); transform-origin: left; }
  .card .author .xlink { color: inherit; text-transform: none; }
  .card .author .xlink:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
  .card .author { display: block; font: 400 13px/26px var(--mono); border-bottom: 1px solid rgba(0,0,0,.25); overflow-wrap: anywhere; }
  .card .rule { height: 26px; border-bottom: 1px solid rgba(0,0,0,.25); }
  .card .lines { position: relative; }
  .card .desc { position: absolute; top: 0; left: 0; right: 0; max-height: 78px; margin: 0; font: 400 15px/26px var(--serif); color: var(--ink); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; overflow-wrap: anywhere; pointer-events: none; }
  /* the title link covers the whole card; the X link sits above it */
  .card .title::after { content: ""; position: absolute; inset: 0; }
  .card .author .xlink { position: relative; z-index: 1; }
  /* top-right corner: one flex row (postmark, 12px gap, stamp), 16px inset, clear of the title (starts 76px down) and the thumbnail */
  .corner { position: absolute; top: 16px; right: 16px; display: flex; align-items: flex-start; gap: 12px; pointer-events: none; }
  .stamp { flex: 0 0 auto; width: 56px; height: 68px; padding: 6px; border: 2px dashed #000; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; overflow: hidden; white-space: nowrap; font: 400 10px/1.1 var(--mono); text-transform: uppercase; letter-spacing: .04em; }
  .stamp svg { display: block; flex: none; }
  .flag { position: absolute; top: -12px; left: 16px; z-index: 2; padding: 3px 10px; border: 1px solid var(--ink); background: var(--paper); font: 400 13px/1.2 var(--mono); text-transform: uppercase; letter-spacing: .06em; transform: rotate(-2deg); pointer-events: none; }
  .postmark { display: none; flex: none; width: 136px; height: 64px; }
  /* side by side: the postmark only shows when it fits right of the thumbnail; stacked: whenever the card is at least 280px wide */
  @container (min-width: 600px) { .postmark { display: block; } }
  @media (max-width: 519px) {
    .card { display: block; aspect-ratio: auto; min-height: 0; }
    .card .pic { margin: 84px 8px 0; aspect-ratio: 4 / 3; }
    .card .msg { margin: 12px 8px 8px; padding: 12px 0 0; border-left: 0; border-top: 1px solid rgba(0,0,0,.55); }
    @container (min-width: 280px) { .postmark { display: block; } }
  }
  @media (hover: none) { .card:hover, .card:focus-visible, .card:focus-within { transform: none; } .card:active { transform: translate(3px, 3px); } }
  @media (prefers-reduced-motion: reduce) { .card, .card:hover, .card:focus-visible, .card:focus-within, .card:active { transition: none; transform: none; } }

  .section { margin-top: 56px; }
  h2 { font: 400 clamp(22px, 5vw, 28px)/1.2 var(--serif); margin: 0 0 24px; text-align: center; }
  .note { margin: 0; text-align: center; font: 300 14px/1.4 var(--mono); }
  .note a { text-decoration: underline; text-underline-offset: 4px; }
  .story { display: block; width: 100%; margin: 10px 0 0; padding: 0; border: 0; background: none; color: inherit; text-align: left; font: 300 14px/1.4 var(--serif); cursor: pointer; }
  .story .q { display: block; font: 300 12px/1.4 var(--mono); margin-top: 6px; }
  .story .a { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .story[aria-expanded="true"] .a { display: block; }
  .use, .more { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 12px; padding: 0 16px; border: 1px solid var(--ink); border-radius: 0; background: #faf8f2; color: var(--ink); font: 300 14px/1 var(--mono); cursor: pointer; }
  .more { background: var(--paper); }
  .use:hover, .more:hover { background: var(--ink); color: var(--paper); }
  .more-wrap { display: flex; justify-content: center; margin-top: 32px; }
  .more-wrap .more { margin-top: 0; }
  [hidden] { display: none !important; }

  /* the one splash of color: confetti and rainbow waves around a just-published card */
  .thanks { grid-column: 1 / -1; margin: 0; text-align: center; font: 400 clamp(22px, 5vw, 30px)/1.2 var(--serif); }
  .hoorah { z-index: 1; }
  .celebrate { position: absolute; left: -90px; top: -90px; width: calc(100% + 180px); height: calc(100% + 180px); pointer-events: none; z-index: 3; }

  .add { display: flex; justify-content: center; margin-top: 48px; }
  .add a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; font: 300 14px/1 var(--mono); }
  .add a:hover { text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
<div class="app">
  <nav class="spaces" aria-label="Spaces"><a href="../my-boards/">My boards</a><a href="./" aria-current="page">Community</a></nav>
  <h1>Community</h1>
  <div class="grid" id="grid"></div>
  <div class="more-wrap" id="cmorewrap" hidden><button type="button" class="more" id="cmore">Show more</button></div>
  <div class="add"><a id="add" href="#" rel="noopener">Add yours</a></div>
</div>

<script src="../ai-whiteboard/supabase-config.js"></script>
<script src="../ai-whiteboard/templates.js"></script>
<script>
(function () {
  'use strict';

  var FAMILY = '"Special Elite", "Courier New", monospace';
  var FONT = '400 16px ' + FAMILY;
  var FONT_BIG = '400 22px ' + FAMILY;
  var probe = document.createElement('canvas').getContext('2d');

  /* publishing happens on a board: make one, tap share, it lands here */
  document.getElementById('add').href = '../ai-whiteboard/';
  var publishedId = new URLSearchParams(location.search).get('published') || '';
  if (!/^[\w-]{1,60}$/.test(publishedId)) publishedId = '';

  /* ---------- the whiteboard's element format ---------- */
  function wrap(g, text, maxW, font) {
    g.font = font;
    var out = [];
    String(text || '').split('\n').forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean), line = '';
      if (!words.length) { out.push(''); return; }
      words.forEach(function (w) {
        var t = line ? line + ' ' + w : w;
        if (line && g.measureText(t).width > maxW) { out.push(line); line = w; } else line = t;
      });
      out.push(line);
    });
    return out;
  }
  function textBox(el) {
    var lines = wrap(probe, el.text, 280, FONT_BIG), w = 0;
    lines.forEach(function (l) { w = Math.max(w, probe.measureText(l).width); });
    return { lines: lines, w: Math.max(20, w), h: Math.max(1, lines.length) * 28 };
  }
  function bbox(el) {
    if (el.type === 'pen') {
      var a = 1e9, b = 1e9, c = -1e9, d = -1e9;
      el.pts.forEach(function (p) { a = Math.min(a, p[0]); b = Math.min(b, p[1]); c = Math.max(c, p[0]); d = Math.max(d, p[1]); });
      return { x: el.x + a, y: el.y + b, w: c - a, h: d - b };
    }
    if (el.type === 'text') { var t = textBox(el); return { x: el.x, y: el.y, w: t.w, h: t.h }; }
    if (el.type === 'line' || el.type === 'arrow') return { x: Math.min(el.x, el.x + el.w), y: Math.min(el.y, el.y + el.h), w: Math.abs(el.w), h: Math.abs(el.h) };
    return { x: el.x, y: el.y, w: el.w, h: el.h };
  }
  function label(g, el, cx, cy, maxW) {
    if (!el.text) return;
    g.setLineDash([]); g.fillStyle = '#000'; g.textAlign = 'center'; g.textBaseline = 'middle';
    var ls = wrap(g, el.text, Math.max(30, maxW), FONT);
    g.font = FONT;
    ls.forEach(function (l, i) { g.fillText(l, cx, cy + (i - (ls.length - 1) / 2) * 20); });
    g.textAlign = 'left';
  }
  function drawEl(g, el, onImage) {
    g.save();
    g.lineWidth = el.type === 'pen' ? 2.2 : 1.5;
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = el.ai ? '#555' : '#000'; g.fillStyle = g.strokeStyle;
    if (el.ai && el.type !== 'pen') g.setLineDash([7, 5]);
    var x = el.x, y = el.y;
    if (el.type === 'pen') {
      var p = el.pts;
      g.beginPath();
      if (p.length === 1) { g.arc(x + p[0][0], y + p[0][1], 1.4, 0, Math.PI * 2); g.closePath(); g.fill(); }
      else {
        g.moveTo(x + p[0][0], y + p[0][1]);
        for (var i = 1; i < p.length - 1; i++) g.quadraticCurveTo(x + p[i][0], y + p[i][1], x + (p[i][0] + p[i + 1][0]) / 2, y + (p[i][1] + p[i + 1][1]) / 2);
        g.lineTo(x + p[p.length - 1][0], y + p[p.length - 1][1]);
        g.stroke();
      }
    } else if (el.type === 'note') {
      g.fillStyle = '#bfd7ff'; g.fillRect(x, y, el.w, el.h);
      g.lineWidth = 1; g.setLineDash(el.ai ? [4, 3] : []);
      g.strokeRect(x + .5, y + .5, el.w - 1, el.h - 1);
      g.setLineDash([]);
      /* same note fit as the whiteboard: 16px, shrinking to 12px when the square is too small */
      var nf, nlh, ls;
      for (var fs = 16; fs >= 12; fs--) {
        nf = '400 ' + fs + 'px ' + FAMILY; nlh = Math.round(fs * 1.25);
        ls = wrap(g, el.text, el.w - 16, nf);
        if (ls.length * nlh <= el.h - 16) break;
      }
      g.fillStyle = '#000'; g.textBaseline = 'top'; g.font = nf;
      ls.slice(0, Math.floor((el.h - 16) / nlh)).forEach(function (l, i) { g.fillText(l, x + 8, y + i * nlh + 8); });
    } else if (el.type === 'text') {
      var t = textBox(el);
      g.font = FONT_BIG; g.textBaseline = 'top';
      t.lines.forEach(function (l, i) { g.fillText(l, x, y + i * 28 + 3); });
    } else if (el.type === 'rect') {
      g.strokeRect(x, y, el.w, el.h); label(g, el, x + el.w / 2, y + el.h / 2, el.w - 12);
    } else if (el.type === 'ellipse') {
      g.beginPath(); g.ellipse(x + el.w / 2, y + el.h / 2, Math.abs(el.w / 2), Math.abs(el.h / 2), 0, 0, Math.PI * 2); g.closePath(); g.stroke();
      label(g, el, x + el.w / 2, y + el.h / 2, el.w * 0.7);
    } else if (el.type === 'line' || el.type === 'arrow') {
      var x2 = x + el.w, y2 = y + el.h;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
      if (el.type === 'arrow') {
        var a = Math.atan2(el.h, el.w), hl = 12;
        g.setLineDash([]);
        g.beginPath(); g.moveTo(x2 - hl * Math.cos(a - 0.45), y2 - hl * Math.sin(a - 0.45)); g.lineTo(x2, y2); g.lineTo(x2 - hl * Math.cos(a + 0.45), y2 - hl * Math.sin(a + 0.45)); g.stroke();
      }
    } else if (el.type === 'image' && /^https?:\/\//i.test(el.url || '')) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () { onImage(img, el); };
      img.src = el.url;
    }
    g.restore();
  }

  /* ---------- preview ---------- */
  function preview(cv, els) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = cv.clientWidth || 260, H = cv.clientHeight || 195;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    var g = cv.getContext('2d');
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    els.forEach(function (el) {
      var b = bbox(el);
      x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h);
    });
    if (x1 < x0) return;
    var pad = 12, k = Math.min((W - pad * 2) / Math.max(1, x1 - x0), (H - pad * 2) / Math.max(1, y1 - y0));
    var tx = (W - (x1 - x0) * k) / 2 - x0 * k, ty = (H - (y1 - y0) * k) / 2 - y0 * k;
    function setup() { g.setTransform(dpr * k, 0, 0, dpr * k, dpr * tx, dpr * ty); }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    setup();
    els.forEach(function (el) {
      drawEl(g, el, function (img, e) { setup(); g.drawImage(img, e.x, e.y, e.w, e.h); });
    });
  }

  /* postcard furniture: stamp and postmark */
  function decorate(box, cv, kids) {
    var pic = document.createElement('div'); pic.className = 'pic'; pic.appendChild(cv);
    var msg = document.createElement('div'); msg.className = 'msg';
    kids.forEach(function (k) { msg.appendChild(k); });
    box.appendChild(pic); box.appendChild(msg);
    var corner = document.createElement('div'); corner.className = 'corner'; corner.setAttribute('aria-hidden', 'true');
    var pm = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    pm.setAttribute('class', 'postmark'); pm.setAttribute('viewBox', '0 0 136 64'); pm.setAttribute('fill', 'none'); pm.setAttribute('stroke', '#000'); pm.setAttribute('stroke-width', '1.2');
    pm.innerHTML = '<g opacity=".35"><circle cx="104" cy="32" r="31"/><path d="M1 24 q8 -6 16 0 t16 0 t16 0 t16 0"/><path d="M1 36 q8 -6 16 0 t16 0 t16 0 t16 0"/></g>';
    var st = document.createElement('div'); st.className = 'stamp';
    st.innerHTML = '<svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#000" stroke-width="1.5"><circle cx="11" cy="11" r="9"/><circle cx="11" cy="11" r="4"/></svg><span>Lab</span><span>12 Oct</span>';
    corner.appendChild(pm); corner.appendChild(st);
    box.appendChild(corner);
  }
  /* three ruled lines under the author; the description is written on top of them */
  function rules(text) {
    var box = document.createElement('div'); box.className = 'lines';
    for (var i = 0; i < 3; i++) { var r = document.createElement('div'); r.className = 'rule'; box.appendChild(r); }
    if (text) { var d = document.createElement('p'); d.className = 'desc'; d.textContent = text; box.appendChild(d); }
    return box;
  }
  function authorLine(name, x, byline) {
    var author = document.createElement('span'); author.className = 'author';
    var n = typeof name === 'string' ? name.trim() : '';
    if (n && n.toLowerCase() !== 'anonymous') author.textContent = byline ? 'by ' + n : n;
    else if (!x) author.textContent = byline ? 'by anonymous' : '';
    if (typeof x === 'string' && /^[A-Za-z0-9_]{1,15}$/.test(x)) {
      var xl = document.createElement('a');
      xl.className = 'xlink'; xl.textContent = '@' + x;
      xl.href = 'https://x.com/' + x; xl.target = '_blank'; xl.rel = 'noopener noreferrer nofollow';
      xl.setAttribute('aria-label', 'Open @' + x + ' on X');
      if (author.textContent) author.appendChild(document.createTextNode(' '));
      author.appendChild(xl);
    }
    return author;
  }

  /* ---------- gallery: one grid, community submissions first, then templates.json ---------- */
  var grid = document.getElementById('grid');
  var firstBuiltin = null;
  function card(t, opts) {
    var box = document.createElement('div');
    box.className = 'card';
    var cv = document.createElement('canvas');
    cv.setAttribute('role', 'img');
    cv.setAttribute('aria-label', t.title);
    var title = document.createElement('a'); title.className = 'title';
    var tt = document.createElement('span'); tt.textContent = t.title; title.appendChild(tt);
    title.href = opts.href;
    if (opts.onOpen) title.addEventListener('click', opts.onOpen);
    var author = authorLine(t.author, t.x, opts.byline);
    decorate(box, cv, [title, author, rules(t.desc || t.why)]);
    if (opts.community) grid.insertBefore(box, firstBuiltin);
    else { grid.appendChild(box); if (!firstBuiltin) firstBuiltin = box; }
    return { cv: cv, box: box };
  }
  function drawLater(cv, els) {
    var go = function () { preview(cv, els); };
    go();
    if (document.fonts && document.fonts.load) document.fonts.load('16px "Special Elite"').then(go, go);
    var timer;
    window.addEventListener('resize', function () { clearTimeout(timer); timer = setTimeout(go, 100); });
  }
  function builtinCard(t) {
    var c = card(t, { href: '../ai-whiteboard/?template=' + encodeURIComponent(t.id) });
    if (t.id === 'dream-board') { var flag = document.createElement('span'); flag.className = 'flag'; flag.textContent = 'Start here'; c.box.appendChild(flag); }
    (t.payload ? Promise.resolve(t.payload) : fetch(t.file).then(function (r) { return r.json(); })).then(function (els) {
      if (!Array.isArray(els)) return;
      drawLater(c.cv, els.filter(function (e) { return e && typeof e === 'object' && e.type; }));
    }).catch(function () {});
  }
  var staticList = function () { return fetch('templates.json').then(function (r) { return r.json(); }); };
  /* database first; null on any failure (flag off, offline, timeout) */
  var dbP = (window.AIWB_TEMPLATES ? AIWB_TEMPLATES.list() : Promise.resolve(null)).catch(function () { return null; });
  dbP.then(function (db) {
    var samples = window.AIWB_TEMPLATES ? AIWB_TEMPLATES.plan(db, [], '').samples : null;
    return samples || staticList();
  }).then(function (list) {
    if (Array.isArray(list)) list.forEach(function (t) { if (t && t.id && (t.file || t.payload) && !t.mine) builtinCard(t); });
  }).catch(function () {});

  /* ---------- submitted templates (open issues in lilly-builds/lab) ---------- */
  var API = 'https://api.github.com/repos/lilly-builds/lab/issues?state=open&per_page=100';
  var CACHE_KEY = 'labtpl.community.v1', CACHE_MS = 5 * 60 * 1000, PAGE = 24;
  var MARKER = /<!--\s*lab-template:v1:([A-Za-z0-9_-]+)\s*-->/;
  var cmoreWrap = document.getElementById('cmorewrap'), cmore = document.getElementById('cmore');
  var community = [], shown = 0;

  function b64urlBytes(str) {
    var b = str.replace(/-/g, '+').replace(/_/g, '/');
    while (b.length % 4) b += '=';
    var bin = atob(b), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function gunzip(bytes) {
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
  }
  function clean(v, max) { return typeof v === 'string' ? v.trim().slice(0, max) : null; }
  function validate(d) {
    if (!d || typeof d !== 'object' || d.v !== 1) return null;
    var title = clean(d.title, 60), why = clean(d.why, 400), love = clean(d.love, 400), author = clean(d.author, 40);
    if (!title || !why || !love || author === null) return null;
    if (!Array.isArray(d.elements) || d.elements.length > 120) return null;
    for (var i = 0; i < d.elements.length; i++) {
      var e = d.elements[i];
      if (!e || typeof e !== 'object' || Array.isArray(e)) return null;
    }
    var x = typeof d.x === 'string' && /^[A-Za-z0-9_]{1,15}$/.test(d.x) ? d.x : '';
    return { title: title, why: why, love: love, author: author, x: x, elements: d.elements };
  }
  function decode(issue) {
    var m = MARKER.exec(issue.body || '');
    if (!m) return Promise.resolve(null);
    return Promise.resolve().then(function () {
      var bytes = b64urlBytes(m[1]);
      return bytes.length > 2 && bytes[0] === 0x1f && bytes[1] === 0x8b ? gunzip(bytes) : bytes;
    }).then(function (bytes) {
      var d = validate(JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes)));
      if (d) d.created = String(issue.created_at || '');
      return d;
    }).catch(function () { return null; });
  }
  function loadCommunity() {
    try {
      var c = JSON.parse(sessionStorage.getItem(CACHE_KEY) || 'null');
      if (c && Array.isArray(c.items) && Date.now() - c.t < CACHE_MS) return Promise.resolve(c.items);
    } catch (e) {}
    return fetch(API, { headers: { Accept: 'application/vnd.github+json' } }).then(function (r) {
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function (list) {
      if (!Array.isArray(list)) throw new Error('shape');
      var issues = list.filter(function (i) {
        return i && typeof i === 'object' && !i.pull_request && typeof i.title === 'string' && i.title.indexOf('Community template:') === 0 && typeof i.body === 'string';
      });
      return Promise.all(issues.map(decode));
    }).then(function (items) {
      items = items.filter(Boolean).sort(function (a, b) { return a.created < b.created ? 1 : a.created > b.created ? -1 : 0; });
      try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), items: items })); } catch (e) {}
      return items;
    });
  }

  /* only plain drawable shapes reach the preview; images are never fetched here */
  var SHAPES = { pen: 1, note: 1, text: 1, rect: 1, ellipse: 1, line: 1, arrow: 1 };
  function num(v) { return typeof v === 'number' && isFinite(v); }
  function previewEls(els) {
    var out = [];
    els.forEach(function (e) {
      if (!SHAPES[e.type] || !num(e.x) || !num(e.y)) return;
      var c = { type: e.type, x: e.x, y: e.y, ai: !!e.ai };
      if (typeof e.text === 'string') c.text = e.text.slice(0, 500);
      if (e.type === 'pen') {
        if (!Array.isArray(e.pts) || !e.pts.length) return;
        c.pts = [];
        for (var i = 0; i < e.pts.length && i < 2000; i++) {
          var p = e.pts[i];
          if (!Array.isArray(p) || !num(p[0]) || !num(p[1])) return;
          c.pts.push([p[0], p[1]]);
        }
      } else if (e.type !== 'text') {
        if (!num(e.w) || !num(e.h)) return;
        c.w = e.w; c.h = e.h;
      }
      out.push(c);
    });
    return out;
  }

  /* rows from the database are untrusted text: clamp every field to the dialog's caps */
  function tidy(t) {
    var title = clean(t && t.title, 60);
    if (!title || !Array.isArray(t.elements)) return null;
    t.title = title;
    t.why = clean(t.why, 802) || '';
    t.author = clean(t.author, 40) || '';
    t.x = typeof t.x === 'string' && /^[A-Za-z0-9_]{1,15}$/.test(t.x) ? t.x : '';
    t.elements = t.elements.slice(0, 120).filter(function (e) { return e && typeof e === 'object' && !Array.isArray(e); });
    return t;
  }

  var RAINBOW = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#00c7be', '#007aff', '#af52de'];
  /* short confetti burst and rippling rainbow waves around one card, then they fade; the words stay */
  function celebrate(box) {
    box.classList.add('hoorah');
    var thanks = document.createElement('p');
    thanks.className = 'thanks'; thanks.setAttribute('role', 'status');
    thanks.textContent = 'thanks for contributing';
    grid.insertBefore(thanks, box);
    var cv = document.createElement('canvas');
    cv.className = 'celebrate'; cv.setAttribute('aria-hidden', 'true');
    box.appendChild(cv);
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = cv.clientWidth || box.offsetWidth + 180, H = cv.clientHeight || box.offsetHeight + 180;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    var g = cv.getContext('2d'), M = 90, DUR = 4500, FADE = 900;
    var bits = [];
    for (var i = 0; i < 110 && !still; i++) {
      bits.push({
        x: M + (box.offsetWidth * (0.15 + 0.7 * Math.random())), y: M + 20,
        vx: (Math.random() - 0.5) * 520, vy: -(260 + Math.random() * 420),
        w: 6 + Math.random() * 6, h: 3 + Math.random() * 5,
        r: Math.random() * 6, vr: (Math.random() - 0.5) * 14, c: RAINBOW[i % RAINBOW.length]
      });
    }
    function waves(t, alpha) {
      g.lineWidth = 3; g.lineCap = 'round';
      [M - 28, M + box.offsetHeight + 28].forEach(function (baseY, side) {
        RAINBOW.forEach(function (col, k) {
          g.strokeStyle = col; g.globalAlpha = alpha;
          g.beginPath();
          for (var x = 0; x <= W; x += 6) {
            var y = baseY + (side ? 1 : -1) * k * 4 + Math.sin(x / 38 + t * 3 + k * 0.35) * (7 + 3 * Math.sin(t * 1.5));
            if (x) g.lineTo(x, y); else g.moveTo(x, y);
          }
          g.stroke();
        });
      });
      g.globalAlpha = 1;
    }
    var t0 = null, last = 0;
    function frame(now) {
      if (t0 === null) { t0 = now; last = now; }
      var el = now - t0, dt = Math.min(0.05, (now - last) / 1000); last = now;
      var alpha = Math.max(0, Math.min(1, (DUR - el) / FADE));
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, W, H);
      waves(el / 1000, alpha);
      bits.forEach(function (b) {
        b.vy += 900 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt; b.vx *= 0.995;
        g.save(); g.translate(b.x, b.y); g.rotate(b.r); g.globalAlpha = alpha; g.fillStyle = b.c;
        g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); g.restore();
      });
      if (el < DUR) requestAnimationFrame(frame); else cv.remove();
    }
    if (still) { g.setTransform(dpr, 0, 0, dpr, 0, 0); waves(0, 1); }
    else requestAnimationFrame(frame);
    if (window.history && history.replaceState) history.replaceState(null, '', location.pathname);
  }

  function communityCard(t) {
    var c = card(t, {
      community: true,
      byline: true,
      href: '../ai-whiteboard/?template=pending',
      onOpen: function () {
        try { sessionStorage.setItem('aiwb.pendingTemplate', JSON.stringify(t.elements)); } catch (e) {}
      }
    });
    drawLater(c.cv, previewEls(t.elements));
    if (publishedId && t.id === publishedId) celebrate(c.box);
  }
  function showMore() {
    community.slice(shown, shown + PAGE).forEach(communityCard);
    shown = Math.min(community.length, shown + PAGE);
    cmoreWrap.hidden = shown >= community.length;
  }
  cmore.addEventListener('click', showMore);
  /* newest first: database rows and the older GitHub-issue submissions together, so nothing vanishes */
  Promise.all([dbP, loadCommunity().catch(function () { return []; })]).then(function (r) {
    var pl = window.AIWB_TEMPLATES ? AIWB_TEMPLATES.plan(r[0], r[1], publishedId) : { community: r[1] };
    community = pl.community.map(tidy).filter(Boolean);
    showMore();
    if (publishedId && !grid.querySelector('.thanks')) { /* published, but the list could not show it yet: still say thanks */
      var thanks = document.createElement('p');
      thanks.className = 'thanks'; thanks.setAttribute('role', 'status'); thanks.textContent = 'thanks for contributing';
      grid.insertBefore(thanks, grid.firstChild);
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
